syntax = "proto3";

package dnd5e.api.session.v1alpha2;

import "dnd5e/api/session/v1alpha2/act_geometry.proto";

// THE ACT, AS ONE RECIPIENT RECEIVES IT (rpg-project ideas/event-stream R5,
// R6, R16, R17, R19, R22, R27, R30, R31, Laws 6, 7 and 11).
//
// The act stream is the record folded into acts: who did what, to whom, how it
// was decided and what changed. Each member's acts are folded from that
// member's own story, so an act holds only what its recipient perceived, or,
// at the party's shared view (rpg-project#935), what a party member perceived
// and `perceived.via` names. The recipient is the subscription's and the
// read's `member`, never a field here.
//
// Every message mirrors the session SDK's act type of the same name, field for
// field. Content-authored words stay strings (an ability, a skill, a slot, an
// item, a cause, a reason, a temper); every set the code closes is an enum
// (Law 8). Nothing here imports v1alpha1 (Law 11, R18).

// Act is one segment of one act, as one recipient receives it.
//
// IT CARRIES NO SEQ (R30). Its ids are the record's wire id and the act tag,
// and nothing else.
message Act {
  // session is the session the act happened in.
  string session = 1;

  // id is the record id of the LAST record beat this segment folds (R31), the
  // same id space as RecordEvent.id: an ordering key, not a counter (R27).
  // Compare two ids as strings to order them. A gap between two ids means
  // nothing.
  //
  // It is the RESUME POINT: StreamEvents and GetStory after an id return
  // exactly the acts that follow it.
  //
  // ACTS SHARING AN ID ARE ONE DELIVERY UNIT. One record entry can fold into
  // several acts — a rest and the concentrations and conditions it ended, a
  // departure or an ending and the conditions it lifted — and each carries
  // that entry's id. They are always adjacent, a transport never splits them,
  // and resuming after the id skips them all. StreamEvents closes a lagging
  // subscriber, and GetStory ends a page, only between two ids, never inside
  // a same-id run; cutting inside one would lose the rest of it with no
  // signal (R28). The last act of every run carries `run_end`. Acts that share only an act tag (`act`), such as a line and
  // its own table answer, are separate entries with their own ids.
  string id = 2;

  // at is the world-clock reading, in rounds, of the last folded beat.
  uint64 at = 3;

  // act is the act id, `<verb>:<id>` (R27). Every segment, reaction, state,
  // answer and perception the act caused carries it. Empty only for an entry
  // outside any act, such as a tick or a join.
  string act = 4;

  // verb is the verb half of `act`; empty when `act` is empty.
  string verb = 5;

  // family is what kind of entry this is (R16). The beat decides it, never the
  // verb.
  Family family = 6;

  // segment numbers this recipient's FAMILY_ACT segments of one act, from 1: a
  // walk interrupted by a reaction is segments 1 and 2. Every other family is
  // 0.
  int32 segment = 7;

  // refused is true when this act could not be read into its body (R22). It
  // keeps its id and its place in the stream, carries `refusal` and no body,
  // and the acts after it still arrive: one bad act fails that act, not the
  // read.
  bool refused = 8;

  // refusal is why the act was refused; empty unless `refused`.
  string refusal = 9;

  // run_end is true on the LAST act of a same-id run (see `id`), and on every
  // act that is a run of one. The producer knows the unit, so it marks it: a
  // transport may cut — end a page, close a lagging stream — only after an act
  // with run_end, and a client closes a live run when it sees one, never on a
  // timer or on the next id.
  bool run_end = 10;

  // perceived is how this entry reached its recipient (rpg-project#934, R6).
  // `senses` says which senses delivered it, where the session states them (a
  // `speech` body and a `perception` body today). `via` is non-empty when some
  // or all of it came through party members at the shared view
  // (rpg-project#935), on any body; empty means the recipient's own senses.
  // Absent on a body the session says nothing about, which reaches its
  // recipient as it always has.
  Perceived perceived = 11;

  // body is the family's typed body: one of the act bodies for FAMILY_ACT and
  // FAMILY_REACTION, and table_answer, state, perception or clock for the
  // others. Unset exactly when `refused`.
  //
  // A REACTION IS A FAMILY, NOT A BODY (Law 6): an opportunity attack is
  // `family = FAMILY_REACTION` with `attack` set and `attack.reaction` present.
  oneof body {
    WalkAct walk = 20;
    AttackAct attack = 21;
    CastAct cast = 22;
    ActivateAct activate = 23;
    // DEPRECATED — SUPERSEDED BY speech (rpg-project#934, R6). Kept working
    // until the client has moved; then no longer sent.
    SpeakAct speak = 24 [deprecated = true];
    DeathSaveAct death_save = 25;
    LootAct loot = 26;
    HoldAct hold = 27;
    DropAct drop = 28;
    DoorAct door = 29;
    EquipAct equip = 30;
    StayAct stay = 31;
    SneakAct sneak = 32;
    RestAct rest = 33;
    TableAnswer table_answer = 34;
    StateChange state = 35;
    Perception perception = 36;
    ClockEntry clock = 37;
    BarredAct barred = 38;
    // speech is one spoken thing as this recipient perceived it: a
    // character's line, a creature's answer, a hail, a shout, an overheard
    // voice (rpg-project#934, R6). Every spoken thing rides this one body.
    Speech speech = 39;
    // relocate is a member set down at a place without walking, as this
    // recipient perceived it (rpg-project#925).
    RelocateAct relocate = 40;
    // arrest is a party arrested, as this recipient perceived it
    // (rpg-project#925). Family FAMILY_STATE.
    ArrestAct arrest = 41;
    // interact is a thing done to a prop, as this recipient perceived it
    // (rpg-project#959): seen, not heard.
    InteractAct interact = 42;
  }
}

// Family is which kind of thing an act entry is (R16).
enum Family {
  FAMILY_UNSPECIFIED = 0;
  // FAMILY_ACT is a verb's own deed: a walk, a swing, a cast, a line. Every
  // Speech rides this family, whoever spoke (rpg-project#934); how its reader
  // perceived it is Act.perceived's job, never the family's.
  FAMILY_ACT = 1;
  // FAMILY_REACTION is a deed done in answer to another act, under that act's
  // id: an opportunity attack inside the walk that provoked it.
  FAMILY_REACTION = 2;
  // FAMILY_TABLE_ANSWER is a table roll: a creature's or a prop's answer, a
  // faction's temperament deal.
  FAMILY_TABLE_ANSWER = 3;
  // FAMILY_STATE is a change of standing an act caused: a fall, a stance, a
  // concentration ended, a condition lifted, experience paid.
  FAMILY_STATE = 4;
  // FAMILY_PERCEPTION is what one observer newly perceived.
  FAMILY_PERCEPTION = 5;
  // FAMILY_CLOCK is the table's own bookkeeping: ticks, turns, fights,
  // arrivals and departures, windows.
  FAMILY_CLOCK = 6;
}

// PartyKind is what a Party names.
enum PartyKind {
  PARTY_KIND_UNSPECIFIED = 0;
  // PARTY_KIND_MEMBER is an encounter member: a character or a creature.
  PARTY_KIND_MEMBER = 1;
  PARTY_KIND_PROP = 2;
  PARTY_KIND_FACTION = 3;
  // PARTY_KIND_WORLD is the world itself: a change with no party behind it.
  PARTY_KIND_WORLD = 4;
}

// Party is who did something, or had it done to them (R17). A Party field is
// absent when the act names nobody there.
message Party {
  PartyKind kind = 1;
  string id = 2;
}

// RollModifier is one flat contribution to a roll, named by its source.
message RollModifier {
  // source is the contribution's source name ("Strength", "Fighter").
  string source = 1;
  int32 value = 2;
  // source_ref is the source's full ref ("dnd5e:classes:fighter"), verbatim.
  // Empty when the rulebook recorded a name only.
  string source_ref = 3;
  // source_id is the entity the source belongs to, when the rulebook named
  // one; empty otherwise.
  string source_id = 4;
  // source_label is the source's role within the roll's calculation, when the
  // rulebook recorded one ("Fighter level"); empty otherwise.
  string source_label = 5;
}

// Roll is one roll as an act states it (R17): every die an act carries, said
// one way. Nothing is re-added on the client: total is authoritative.
message Roll {
  // expression is the roll as dice and a flat modifier, "1d20+5". Empty when
  // the beat carried no calculation to build it from.
  string expression = 1;

  // dice are the faces that counted, in order. A die a keep rule discarded
  // (the low face of advantage) is not here.
  repeated int32 dice = 2;

  repeated RollModifier modifiers = 3;

  int32 total = 4;

  // against is the number the roll was made against: a DC or an AC. Absent for
  // an unopposed roll such as damage, healing or a table die.
  optional int32 against = 5;

  // beaten is whether the roll beat `against`, as the beat says it. Absent
  // when `against` is absent.
  optional bool beaten = 6;

  // of is the die size of a table roll: a roll of N on a table of `of`
  // entries. 0 otherwise.
  int32 of = 7;

  // influences are the advantage and disadvantage that shaped the roll, each
  // with its source, in the order the rulebook recorded them (R17: a roll
  // carries its sources). Empty when nothing granted or imposed either.
  repeated RollInfluence influences = 8;

  // terms are the roll's dice pools, one per pool the rulebook rolled, in
  // calculation order, each with the source that brought it: the attack's own
  // d20, Bless's +1d4, Bane's -1d4. `dice` is these terms' kept faces
  // concatenated. Empty when the beat carried no calculation.
  repeated RollDiceTerm terms = 9;
}

// RollDiceTerm is one dice pool of a roll and the source that brought it.
message RollDiceTerm {
  // count is how many faces counted: len(faces). A die a keep rule discarded
  // is not counted (advantage's d20 [7,15] is count 1, faces [15]); the keep
  // itself is the roll's `influences`. die_size is each die's size.
  int32 count = 1;
  int32 die_size = 2;
  // faces are the faces that counted, in order; a face a keep rule discarded
  // is not here.
  repeated int32 faces = 3;
  // subtract is true when the pool is taken from the total (Bane's -1d4).
  bool subtract = 4;
  // source_ref is the source's full ref ("dnd5e:spells:bless"), verbatim.
  string source_ref = 5;
  // source_name is the source's display name ("Bless").
  string source_name = 6;
  // source_id is the entity the source belongs to, when the rulebook named
  // one; empty otherwise.
  string source_id = 7;
  // rolled is the pool as first rolled, before any reroll and before any keep
  // rule: advantage's d20 [7,15], Great Weapon Fighting's 2d6 [1,5]. Empty
  // when the rulebook recorded no trace for the pool.
  repeated int32 rolled = 8;
  // kept_indices are the indices into `rolled` whose (possibly rerolled)
  // faces counted, in order. Empty means every die was kept. A plain d20 is
  // rolled [12], kept_indices [], faces [12]; advantage is rolled [7,15],
  // kept_indices [1], faces [15].
  repeated int32 kept_indices = 9;
  // rerolls are the dice of `rolled` a feature rerolled, each with the source
  // that rerolled it, in the order they happened. `faces` already holds each
  // die's final face.
  repeated RollReroll rerolls = 10;
  // source_label is the source's role within the roll's calculation, when the
  // rulebook recorded one; empty otherwise.
  string source_label = 11;
}

// RollReroll is one die of a pool rerolled, and the source that rerolled it
// (Great Weapon Fighting rerolling a 1).
message RollReroll {
  // die_index is the die's index into its term's `rolled`.
  int32 die_index = 1;
  // before is the face the die showed before the reroll.
  int32 before = 2;
  // after is the face the reroll produced.
  int32 after = 3;
  // source_ref is the rerolling source's full ref
  // ("dnd5e:fighting-styles:great-weapon-fighting"), verbatim.
  string source_ref = 4;
  // source_name is the rerolling source's display name.
  string source_name = 5;
  // source_id is the entity the source belongs to, when the rulebook named
  // one; empty otherwise.
  string source_id = 6;
  // source_label is the rerolling source's role within the roll's
  // calculation, when the rulebook recorded one; empty otherwise.
  string source_label = 7;
}

// InfluenceKind is whether a source granted advantage or imposed
// disadvantage on a roll.
enum InfluenceKind {
  INFLUENCE_KIND_UNSPECIFIED = 0;
  INFLUENCE_KIND_ADVANTAGE = 1;
  INFLUENCE_KIND_DISADVANTAGE = 2;
}

// RollInfluence is one source of advantage or disadvantage on a roll.
message RollInfluence {
  InfluenceKind kind = 1;
  // source_ref is the source's full ref ("dnd5e:conditions:prone"), verbatim.
  string source_ref = 2;
  // source_id is the entity the source belongs to, when the rulebook named
  // one; empty otherwise.
  string source_id = 3;
  // name is the source's display name ("Prone"), as the rulebook recorded it.
  string name = 4;
  // source_label is the source's role within the roll's calculation, when the
  // rulebook recorded one; empty otherwise.
  string source_label = 5;
}

// DamageType is the rulebook's closed set of thirteen damage types.
enum DamageType {
  DAMAGE_TYPE_UNSPECIFIED = 0;
  DAMAGE_TYPE_ACID = 1;
  DAMAGE_TYPE_BLUDGEONING = 2;
  DAMAGE_TYPE_COLD = 3;
  DAMAGE_TYPE_FIRE = 4;
  DAMAGE_TYPE_FORCE = 5;
  DAMAGE_TYPE_LIGHTNING = 6;
  DAMAGE_TYPE_NECROTIC = 7;
  DAMAGE_TYPE_PIERCING = 8;
  DAMAGE_TYPE_POISON = 9;
  DAMAGE_TYPE_PSYCHIC = 10;
  DAMAGE_TYPE_RADIANT = 11;
  DAMAGE_TYPE_SLASHING = 12;
  DAMAGE_TYPE_THUNDER = 13;
}

// AttackRef identifies what was swung.
message AttackRef {
  // ref is the full catalog ref, "dnd5e:weapons:longsword". An open set.
  string ref = 1;
  // name is the catalog's display name, "Longsword".
  string name = 2;
  DamageType damage_type = 3;
}

// ReactionRef identifies what a deed was taken as, when it was a reaction.
message ReactionRef {
  // ref is the reacting condition's or feature's ref,
  // "dnd5e:conditions:opportunity_attack".
  string ref = 1;
  // name is its display name, "Opportunity Attack".
  string name = 2;
}

// SequenceRef names the multiattack a swing was performed inside.
message SequenceRef {
  string ref = 1;
  string name = 2;
}

// SpellRef identifies a spell.
message SpellRef {
  // ref is "dnd5e:spells:vicious-mockery". An open set.
  string ref = 1;
  string name = 2;
}

// AbilityRef identifies an activated ability or feature.
message AbilityRef {
  // ref is "dnd5e:features:rage". An open set.
  string ref = 1;
  string name = 2;
}

// DamageComponent is one part of an attack's damage.
message DamageComponent {
  // source is the part's source name.
  string source = 1;
  DamageType damage_type = 2;
  // multiplier is resistance, vulnerability or immunity applied to the part;
  // absent when none applied.
  optional double multiplier = 3;
  // roll is the part's own dice and modifier, said as a Roll (R17).
  Roll roll = 4;
  // source_ref is the part's provider identity, the full catalog ref
  // ("dnd5e:weapons:longsword"); empty when the beat named none.
  string source_ref = 5;
}

// WalkStep is one cell of a walk.
message WalkStep {
  // cell is where the step landed.
  Position cell = 1;
  // doors are the doors the step went through.
  repeated string doors = 2;
}

// MoveKind is how a body moved: its own walk, its legs under somebody else's
// order, or moved without its legs.
enum MoveKind {
  // MOVE_KIND_UNSPECIFIED is a walk from a writer that does not know the
  // kind; a reader falls back to `forced` (true is displaced, else own).
  MOVE_KIND_UNSPECIFIED = 0;
  // MOVE_KIND_OWN is a walk the creature chose.
  MOVE_KIND_OWN = 1;
  // MOVE_KIND_COMPELLED is the creature's own legs under somebody else's
  // order (Command, Dissonant Whispers): it walks.
  MOVE_KIND_COMPELLED = 2;
  // MOVE_KIND_DISPLACED is a body moved without its legs (Thunderwave): it
  // slides.
  MOVE_KIND_DISPLACED = 3;
}

// WalkAct is a walk: one mover's steps under one act. A walk's later segment
// starts at the cell its earlier segment left the mover on.
message WalkAct {
  Party mover = 1;
  // path is the walk's cells in order.
  repeated WalkStep path = 2;
  // cause is what moved them, when something did.
  string cause = 3;
  // forced is DEPRECATED: a mirror of kind == MOVE_KIND_DISPLACED, still
  // written for readers that do not know `kind`. Read `kind`.
  bool forced = 4 [deprecated = true];
  // kind is how the body moved. A walk segment never mixes kinds.
  MoveKind kind = 5;
}

// RelocateEnd is which end of a relocation this recipient perceived
// (rpg-project#925).
enum RelocateEnd {
  // RELOCATE_END_UNSPECIFIED is never set on a well-formed RelocateAct.
  RELOCATE_END_UNSPECIFIED = 0;
  // RELOCATE_END_BOTH: the recipient perceived the leaving and the arriving.
  // The mover's own version is always BOTH, and a witness to both ends gets
  // BOTH too: the client tells the mover's own version by mover == viewer,
  // never by `words`.
  RELOCATE_END_BOTH = 1;
  // RELOCATE_END_LEFT: the recipient saw the member leave and not where they
  // were set down.
  RELOCATE_END_LEFT = 2;
  // RELOCATE_END_ARRIVED: the recipient saw the member arrive and not where
  // they came from.
  RELOCATE_END_ARRIVED = 3;
}

// RelocateAct is a member set down at a place without walking: taken away
// under arrest, say (rpg-project#925). There is no path; the member leaves one
// place and is at another. Each recipient receives only the end it saw, and a
// recipient who saw neither end receives nothing.
message RelocateAct {
  // mover is the member set down. Always set.
  Party mover = 1;
  // from is where the member was taken from. Present when the recipient saw
  // the leaving (`end` BOTH or LEFT). ABSENT means the recipient did not see
  // where the member came from; absent is never to be read as the cell [0,0]
  // (the zero position).
  Position from = 2;
  // to is where the member was set down. Present when the recipient saw the
  // arriving (`end` BOTH or ARRIVED). ABSENT means the recipient was not told
  // the destination; absent is never to be read as the cell [0,0] (the zero
  // position).
  Position to = 3;
  // cause is the full ref of what relocated the member, verbatim, for example
  // an arrest's consequence ref. Always set. The client words it for an
  // observer; a client never branches a rule on it.
  string cause = 4;
  // words are the authored words the mover is told, verbatim. Always set in
  // the mover's own version; EMPTY for every other recipient.
  string words = 5;
  // end is which end of the relocation this recipient perceived. Always set.
  RelocateEnd end = 6;
}

// InteractAct is a thing done to a prop, as one recipient perceived it
// (rpg-project#959): seen, not heard. Each part is present only when this
// recipient perceived it.
//
//   - The doer: prop, option, words (the authored `do`), beaten, and skill
//     with roll when the thing was checked.
//   - A witness shown the prop: prop, and words (the authored `seen`).
//   - A witness who sees the doer and is not shown the prop: place, the cell
//     the doer stood on, and no prop.
//
// A HIDDEN THING IS NEVER NAMED to a recipient who has not been shown it.
message InteractAct {
  // actor is who did it. Always set.
  Party actor = 1;
  // prop is the thing it was done to. A recipient who SAW the thing used comes
  // to know it, and is sent the version with `prop` set ("if you saw it, you
  // know it", encounter v0.215.0). ABSENT for a recipient not shown the prop;
  // a client then names no thing.
  Party prop = 2;
  // option is the thing's option id: the doer's version only. EMPTY for every
  // witness.
  string option = 3;
  // words are what this recipient is told. In the doer's version they are the
  // doer's own second-person `do` words ("You lift the grate"); in a shown
  // witness's version they are the third-person `seen` words ("She lifts the
  // grate"). The doer's version is the one whose `actor` is the viewer's own
  // character, and only it sets `option` and the check; a client tells the
  // two apart that way and never keys on `words`. EMPTY means no words were
  // authored for this recipient, and the client words a generic ("<name> uses
  // <thing>").
  string words = 4;
  // place is where the doer stood. Present only for a witness who saw the
  // doer and not where the thing stands, and so is not shown the prop. ABSENT
  // for everyone else; absent is never read as the cell [0,0] (the zero
  // position).
  Position place = 5;
  // beaten is the verdict: the doer's version only, true for a plain thing.
  // ABSENT for every witness.
  optional bool beaten = 6;
  // skill is the check's skill: the doer's version, when the thing was
  // checked. EMPTY otherwise.
  string skill = 7;
  // roll is the doer's check: total, the DC as `against`, `beaten` and the
  // dice. ABSENT for a plain thing and for every witness.
  Roll roll = 8;
}

// ArrestAct is a party arrested (rpg-project#925): the members taken, as THIS
// recipient perceived them taken, and the cell region they are to be held in.
// Per recipient, under FAMILY_STATE. It names no arresting guard.
//
// WHO IS WANTED IS NEVER ON THE WIRE. The guards' memory of a member they mean
// to arrest on sight is theirs alone, and this act has no field that could
// carry it.
message ArrestAct {
  // interaction is the id of the conversation whose outcome arrested (the
  // castle's front gate, for example). Opaque; a client never branches on it.
  string interaction = 1;
  // taken are the members taken that this recipient perceives, in the
  // engine's order. NEVER EMPTY: a recipient who perceived nobody taken
  // receives no act at all.
  repeated Party taken = 2;
  // cell is the id of the region the taken are to be held in.
  string cell = 3;
}

// AttackOutcome is how a swing ended (Law 6).
enum AttackOutcome {
  ATTACK_OUTCOME_UNSPECIFIED = 0;
  ATTACK_OUTCOME_HIT = 1;
  ATTACK_OUTCOME_MISS = 2;
  // ATTACK_OUTCOME_WARDED is a ward stopping the swing before a roll.
  ATTACK_OUTCOME_WARDED = 3;
}

// WardSave is the save a ward forced on an attacker.
message WardSave {
  // source is the warding creature.
  Party source = 1;
  string ability = 2;
  Roll roll = 3;
}

// AttackAct is one swing, with its outcome inside it (Law 6).
message AttackAct {
  Party by = 1;
  Party to = 2;
  AttackRef attack = 3;
  AttackOutcome outcome = 4;
  bool critical = 5;
  int32 damage = 6;
  repeated DamageComponent damage_components = 7;
  // roll is the attack roll; absent on a warded swing, which rolled nothing.
  Roll roll = 8;
  // ward is the save the ward forced; present only on a warded swing.
  WardSave ward = 9;
  // sequence is the multiattack the swing was inside; absent on a lone swing.
  SequenceRef sequence = 10;
  // reaction is present when the swing was a reaction (family
  // FAMILY_REACTION).
  ReactionRef reaction = 11;
  // presentation_id is the swing's shared-dice token.
  string presentation_id = 12;
}

// CastOutcome is how a cast ended for one target.
enum CastOutcome {
  CAST_OUTCOME_UNSPECIFIED = 0;
  CAST_OUTCOME_MISS = 1;
  CAST_OUTCOME_WARDED = 2;
  // CAST_OUTCOME_SAVED is a save that succeeded.
  CAST_OUTCOME_SAVED = 3;
  // CAST_OUTCOME_FAILED is a save that failed.
  CAST_OUTCOME_FAILED = 4;
}

// CastResult is one target's result of a cast.
message CastResult {
  Party target = 1;
  CastOutcome outcome = 2;
  // ability is the save's or ward's ability.
  string ability = 3;
  // save is the save or ward roll; absent on a miss.
  Roll save = 4;
  // source is the warding creature on a warded result.
  Party source = 5;
}

// CastAct is a cast and each target's result, in record order.
message CastAct {
  Party by = 1;
  SpellRef spell = 2;
  repeated Party targets = 3;
  repeated CastResult results = 4;
}

// SaveResult is a save an activation forced.
message SaveResult {
  Party saver = 1;
  string ability = 2;
  // source is what forced it.
  SpellRef source = 3;
  Roll roll = 4;
}

// Stabilization is a stabilized result's detail.
message Stabilization {
  string before = 1;
  string after = 2;
  int32 hit_points = 3;
  int32 successes = 4;
  int32 failures = 5;
  int32 successes_needed = 6;
  int32 failures_remaining = 7;
  bool stabilized = 8;
  bool dead = 9;
}

// ActivationResult is one result of an activation.
message ActivationResult {
  // kind is the result's kind, as the activation states it.
  string kind = 1;
  Party target = 2;
  // ref and name are the result's source identity.
  string ref = 3;
  string name = 4;
  // source_id is a condition's source entity.
  string source_id = 5;
  // amount, requested, before and after are a healing's or a damage's numbers.
  int32 amount = 6;
  int32 requested = 7;
  int32 before = 8;
  int32 after = 9;
  // roll is a healing's or a damage's roll; absent otherwise.
  Roll roll = 10;
  // damage_type is a damage result's type; unspecified otherwise.
  DamageType damage_type = 11;
  // detail is a condition's own detail.
  string detail = 12;
  // description is a granted capacity.
  string description = 13;
  // moved and stopped_by are a push's distance and what stopped it.
  int32 moved = 14;
  string stopped_by = 15;
  // stabilization is present on a stabilized result.
  Stabilization stabilization = 16;
}

// ActivateAct is an activation and its results. A removed condition is not a
// result here: it is a state entry under the same act.
message ActivateAct {
  Party by = 1;
  AbilityRef ability = 2;
  // target is the selected target; absent when none was selected.
  Party target = 3;
  repeated ActivationResult results = 4;
  repeated SaveResult saves = 5;
}

// SpeakAct is a line spoken, and its answer.
//
// DEPRECATED — SUPERSEDED BY Speech (rpg-project#934, R6). Kept working until
// the client has moved; then no longer sent, and kept in the contract.
message SpeakAct {
  option deprecated = true;

  Party by = 1;
  // to is who or what was spoken to.
  Party to = 2;
  // option is the line's option id.
  string option = 3;
  // line is the line's text, verbatim as authored.
  string line = 4;
  string skill = 5;
  // roll is the line's check; absent when the line rolled nothing.
  Roll roll = 6;
  // answer is the target's answer when it folded into the line. A line whose
  // answer did not fold in has its answer as its own FAMILY_TABLE_ANSWER act:
  // its own record id, under the same act tag (`Act.act`).
  TableAnswer answer = 7;
}

// DeathSaveAct is one death save.
message DeathSaveAct {
  Party by = 1;
  Roll roll = 2;
  string outcome = 3;
  int32 successes_added = 4;
  int32 failures_added = 5;
  int32 successes = 6;
  int32 failures = 7;
  int32 successes_needed = 8;
  int32 failures_remaining = 9;
  bool stabilized = 10;
  bool dead = 11;
  bool recovered = 12;
  // hp_restored is hit points a natural 20 restored.
  int32 hp_restored = 13;
  // continuation is what the save does to the turn.
  string continuation = 14;
  string presentation_id = 15;
}

// LootAct is a body looted.
message LootAct {
  Party by = 1;
  // from is the body.
  Party from = 2;
}

// HoldAct is a prop taken in hand.
message HoldAct {
  Party by = 1;
  Party prop = 2;
}

// DropAct is a prop put down.
message DropAct {
  Party by = 1;
  Party prop = 2;
  // cell is where it landed.
  Position cell = 3;
}

// DoorAct is a door changing.
message DoorAct {
  // by is who changed it; absent for an unattributed change.
  Party by = 1;
  string door = 2;
  // state is what it is now.
  string state = 3;
  // roll is an unlock attempt's check; absent for an open or a close.
  Roll roll = 4;
}

// EquipAct is an item drawn or stowed.
message EquipAct {
  Party by = 1;
  string slot = 2;
  string item = 3;
  // change is draw or stow.
  string change = 4;
}

// StayAct is a driven word that did nothing.
message StayAct {
  Party member = 1;
  // cause is what drove the word.
  string cause = 2;
  // why is the reason nothing happened.
  string why = 3;
}

// SneakAct is a sneaker's Stealth roll against one watcher.
message SneakAct {
  Party by = 1;
  // watcher is present when the sneaker sees it.
  Party watcher = 2;
  Roll roll = 3;
}

// BarredAct is a bump: a step refused by a body, as a beat the barrier answers
// (rpg-project#842, the-guard-holds-the-gate R2). It is FAMILY_ACT, under the
// act tag of the Move that bumped.
//
// WHAT WRITES IT. A player's step refused by a body: a step onto the cell a
// body stands on, or a step across an edge a post holds. A door verb refused
// by a hold is a bump too. Nothing else writes it: not a wall, not a door by
// its state, not a field, not a masked refusal, and never a driven walk (a
// driven walk routes round). A bump spends nothing; the refused step is not
// paid. A step bump carries the cell it was refused into, never the mover's
// own; a door bump carries the door and no cell.
//
// WHO HEARS IT. The barrier alone, at once, in the Move that bumped. His
// answer is not here: it rides the existing answered beat, a FAMILY_TABLE_ANSWER
// act (or a `speak` line's answer) under the same act tag, heard by others on
// the next raise. The web folds the barrier's answer beside this act.
message BarredAct {
  // mover is who was stopped.
  Party mover = 1;
  // barrier is who stopped them: the body in the way, or on a held crossing
  // the nearest holder the mover is stopped by.
  Party barrier = 2;
  // cell is the cell the step was REFUSED INTO: the destination the mover
  // tried to enter, never the mover's own cell (the last moved beat already
  // says where he stands). For a body stop it is the barrier's own cell; for
  // a held crossing it is the far cell of the held edge. Unset when the bump
  // was a refused door verb; `door` is set instead.
  Position cell = 3;
  // door is the door id when the bump was a door verb refused by a hold;
  // empty for a step. Exactly one of `cell` and `door` is set.
  string door = 4;
}

// RestAct is a rest. The concentrations and conditions it ended are state
// entries under the same act, sharing this act's id.
message RestAct {
  Party by = 1;
  // kind is short or long.
  string kind = 2;
  int32 hit_points_restored = 3;
  int32 hit_points = 4;
  int32 hit_dice_spent = 5;
  int32 hit_dice_returned = 6;
  int32 hit_dice_remaining = 7;
  repeated string resources_refilled = 8;
  // roll is the hit dice spent; absent when none were.
  Roll roll = 9;
}

// TableCandidate is one row a table roll could have landed on.
message TableCandidate {
  int32 entry = 1;
  int32 weight = 2;
  int32 percent = 3;
  int32 loaded = 4;
}

// Temper is a faction's temperament deal for one creature.
message Temper {
  // faction is the die's owner.
  Party faction = 1;
  // temper is the dealt word.
  string temper = 2;
  Roll roll = 3;
}

// ActivityCue is an authored presentation cue on a spoken answer. It carries
// intent, not clip names, timing, movement or gameplay authority. Consumers
// resolve the reference against the body's appearance provider.
message ActivityCue {
  // ref is the nonempty, provider-owned activity reference.
  string ref = 1;
  // cycles is the positive number of complete sustain cycles. Enter/Exit do
  // not count. Zero is invalid, not an infinite-playback spelling.
  uint32 cycles = 2;
}

// TableAnswer is a table roll's answer: a creature's or a prop's pick, or a
// temperament deal. It never carries the answer's fact (R10).
message TableAnswer {
  // who answered.
  Party who = 1;
  string option = 2;
  // key is the table key.
  string key = 3;
  // word is the outcome word.
  string word = 4;
  // selector is the outcome's selector word.
  string selector = 5;
  // say is what was said.
  //
  // DEPRECATED — SUPERSEDED BY Speech.words (rpg-project#934, R6, R9). The
  // words a pick says travel only in each reader's own Speech; TableAnswer
  // stays for the pick's arithmetic.
  string say = 6 [deprecated = true];
  // temperament is the temperament column the pick read.
  string temperament = 7;
  // entry is the row picked.
  int32 entry = 8;
  repeated TableCandidate candidates = 9;
  // roll is the table die; absent on a hold with nothing eligible.
  Roll roll = 10;
  // dealt is present on a temperament deal, absent on a pick.
  Temper dealt = 11;
  // activity is present only when this spoken answer authored a cue. Omitted
  // means no cue. It starts with the live response's presentation and returns
  // to the body's configured default after its sustain cycles. Movement or a
  // newer request discards unfinished cycles; arrival never resumes them.
  // Catch-up data retains this value but must not replay the animation.
  ActivityCue activity = 12;
  // to is the member this line is spoken to (rpg-project#923). Set when a
  // creature answers, with a `say`, someone who walked up to or into him (a
  // hail or a bump). Unset for a table pick, a line spoken to nobody in
  // particular, and a prop. A client shows a line spoken to its viewer as
  // speech to them; it grants nothing.
  //
  // DEPRECATED — SUPERSEDED BY Speech.spoken_to (rpg-project#934, R4, R6),
  // which names the addressee only to a reader who sees them.
  Party to = 13 [deprecated = true];
  // narration is the words a PROP answers with, verbatim as authored
  // (rpg-project#959): a prop has no voice, so its words are narrated, not
  // spoken. Present only on a prop's answer, and only for recipients who saw
  // it. A creature's answer rides Speech and never sets this field. Never
  // `say`'s replacement for a creature.
  string narration = 14;
}

// StateKind is what a state entry changed.
enum StateKind {
  STATE_KIND_UNSPECIFIED = 0;
  STATE_KIND_DOWNED = 1;
  STATE_KIND_STANCE = 2;
  STATE_KIND_CONCENTRATION_ENDED = 3;
  STATE_KIND_CONDITION_REMOVED = 4;
  STATE_KIND_EXPERIENCE = 5;
  // STATE_KIND_MACHINE is a creature's machine moving from one state to
  // another (rpg-project#766).
  STATE_KIND_MACHINE = 6;
}

// MachineChange is a creature's machine moving from one state to another.
message MachineChange {
  // from is the state left.
  string from = 1;
  // to is the state entered.
  string to = 2;
  // reason is the author's reason word for the transition.
  string reason = 3;
}

// Downed is a fall's detail.
message Downed {
  // kind is the fallen member's kind.
  string kind = 1;
}

// StanceTurn is two factions' stance turning.
message StanceTurn {
  repeated Party between = 1;
  string stance = 2;
  string cause = 3;
}

// ConditionLifted is a removed condition's detail.
message ConditionLifted {
  string ref = 1;
  string name = 2;
  string source_id = 3;
  string reason = 4;
}

// ConcentrationEnded is a concentration's end.
message ConcentrationEnded {
  SpellRef spell = 1;
  string reason = 2;
}

// ExperienceGrant is one character's share of one grant.
message ExperienceGrant {
  string character = 1;
  int32 amount = 2;
  // total is their cumulative experience after the grant.
  int32 total = 3;
}

// StateChange is a change of standing, under the act that caused it. Exactly
// the part matching `change` is set.
message StateChange {
  // party is who changed; absent for a stance, which names no party.
  Party party = 1;
  StateKind change = 2;
  Downed downed = 3;
  StanceTurn stance = 4;
  ConcentrationEnded concentration = 5;
  ConditionLifted condition = 6;
  repeated ExperienceGrant experience = 7;
  // machine is set for STATE_KIND_MACHINE.
  MachineChange machine = 8;
}

// Sense is how a perception entry was perceived.
enum Sense {
  SENSE_UNSPECIFIED = 0;
  SENSE_SIGHT = 1;
  SENSE_HEARING = 2;
  SENSE_DISCOVERY = 3;
  SENSE_REVEAL = 4;
  SENSE_CELLS = 5;
}

// SightChange is what came into or out of sight. The lists are member ids.
message SightChange {
  repeated string gained = 1;
  repeated string lost = 2;
  repeated string changed = 3;
  bool knowledge_changed = 4;
}

// Sound is a sound heard: a clang, a crash, a boom (rpg-project#934, R6 keeps
// every sound that is not speech here).
message Sound {
  // kind is the sound's kind word.
  //
  // `voice` IS RETIRED FOR PLAYERS (rpg-project#934, R6): a voice a player
  // perceived arrives as a Speech, with only the parts that player perceived.
  // A `voice` Sound keeps working until the client has moved; then it is no
  // longer sent to a player.
  string kind = 1;
  // cell is where it came from.
  Position cell = 2;
  // hops is how far it carried.
  int32 hops = 3;
}

// DiscoveryCheck is a search's check.
message DiscoveryCheck {
  string ability = 1;
  Roll roll = 2;
}

// SecretRevealed is a concealment's contents, revealed to the observer.
message SecretRevealed {
  string concealment = 1;
  repeated Position cells = 2;
  repeated AtlasProp props = 3;
  repeated RevealedDoor doors = 4;
  repeated AtlasRegion regions = 5;
  repeated AtlasBoundary boundaries = 6;
  repeated AtlasSegment segments = 7;
  repeated Position sealed = 8;
  repeated AtlasStructuralWall structural_walls = 9;
  repeated AtlasStructuralDoor structural_doors = 10;
  repeated StructuralWallOpeningsReplacement structural_wall_openings_replacements = 11;
  repeated PropPresentation prop_presentations = 12;
}

// CellsLearned is fixed layout the observer newly learned.
message CellsLearned {
  // regions are the regions' newly known cells.
  repeated AtlasRegion regions = 1;
  repeated Position scenery = 2;
  repeated AtlasProp props = 3;
  repeated AtlasBoundary boundaries = 4;
  repeated AtlasSegment segments = 5;
  repeated Position sealed = 6;
  repeated AtlasDoorway doorways = 7;
  repeated AtlasPlacedProp placed = 8;
  repeated AtlasExit exits = 9;
  repeated AtlasStructuralWall structural_walls = 10;
  repeated AtlasStructuralDoor structural_doors = 11;
  repeated StructuralWallOpeningsReplacement structural_wall_openings_replacements = 12;
  repeated PropPresentation prop_presentations = 13;
}

// Perception is what one observer newly perceived. It is folded from the
// observer's own entries. Exactly the part matching `sense` is set.
//
// AT THE SHARED VIEW IT MAY REACH ANOTHER PARTY MEMBER (rpg-project#935): sent
// with `observer` naming the friend whose perception it is and the act's
// `perceived.via` naming that friend. The recipient is SHOWN it; their
// character knows nothing from it. A client never treats a perception whose
// `observer` is not the viewer, or whose `perceived.via` is non-empty, as the
// viewer's own knowledge: no map change, no known-secret change.
message Perception {
  // observer is whose perception this is: the viewer for their own, a party
  // member for one shared at the shared view.
  Party observer = 1;
  Sense sense = 2;
  SightChange sighted = 3;
  Sound heard = 4;
  DiscoveryCheck discovery = 5;
  SecretRevealed revealed = 6;
  CellsLearned cells = 7;
}

// Loudness is how loudly a line was said (rpg-project#930, R2, R10): the
// author's word, and how far the words reach in rooms.
enum Loudness {
  // LOUDNESS_UNSPECIFIED is never set on a well-formed Speech: an unmarked
  // line is LOUDNESS_SPEAK.
  LOUDNESS_UNSPECIFIED = 0;
  // LOUDNESS_WHISPER reaches only the member addressed, from beside them.
  LOUDNESS_WHISPER = 1;
  // LOUDNESS_SPEAK reaches every member in the speaker's room.
  LOUDNESS_SPEAK = 2;
  // LOUDNESS_SHOUT reaches the speaker's room and the next room over.
  LOUDNESS_SHOUT = 3;
  // LOUDNESS_SCREAM reaches two rooms over.
  LOUDNESS_SCREAM = 4;
}

// Speech is one spoken thing, as one recipient perceived it (rpg-project#934,
// R1, R3, R4, R6, R8). Every version of one utterance, whoever reads it,
// carries the same `utterance` id.
//
// PARTS ARE PRESENT OR ABSENT, NEVER BLANKED. A version carries only the parts
// its reader perceived. An absent part means the reader did not perceive it,
// never that it was empty, and a client never fills one in: it never infers a
// speaker from the place, the words, the option or anything else.
//
// A SPEECH IS ALWAYS FAMILY_ACT, whoever spoke: a player or a creature. The
// family says what the entry is, a line; how this reader perceived it is
// Act.perceived.
message Speech {
  // utterance is the id every version of this one spoken thing carries, so a
  // client can tell two versions of one line from two lines. Always set;
  // opaque, a client never branches on its contents.
  string utterance = 1;

  // speaker is who spoke (R1). Present only when the reader SAW who spoke.
  // ABSENT means the reader did not see the speaker: the line is shown as
  // said by someone at `place`, never attributed to anybody.
  Party speaker = 2;

  // spoken_to is whom the line was said to: a member, or a prop the line was
  // said to (R4). Present only when the reader sees that member or is them;
  // a prop only with the words. ABSENT means the reader did not see the one
  // spoken to, or the line was said to nobody in particular; a client shows
  // no addressee and never guesses one.
  Party spoken_to = 3;

  // words is the line, verbatim as authored. Present only when the words
  // reached the reader (R2). ABSENT means the reader did not catch the words:
  // they saw someone speak, or only noticed a voice. Present and empty is an
  // authored empty line, not missed words.
  optional string words = 4;

  // option is the line's option id, when the line is a character's authored
  // option. Present only with `words`. Empty when the reader did not catch
  // the words, or the line is not an option (a creature's answer, a hail).
  string option = 5;

  // place is where the line was said. Always set.
  Position place = 6;

  // hops is how many rooms the voice carried to the reader. Present only when
  // the reader did not see the speaker; 0 then means the same room. ABSENT
  // when the reader sees the speaker, whose place is already theirs.
  optional int32 hops = 7;

  // loudness is how loudly the line was said. Always set, on every version.
  Loudness loudness = 8;

  // roll is the line's check (R3: the roll travels with the words): the
  // total, the DC as `against`, `beaten`, and the dice. It is the speaker's
  // roll when `speaker` is present and someone's roll when it is absent.
  // ABSENT means the line rolled nothing, or the reader did not catch the
  // words.
  Roll roll = 9;

  // skill is the check's skill. Set exactly when `roll` is; empty means no
  // roll reached this reader.
  string skill = 10;

  // fact is the id of the fact this line taught THIS reader (R9). Only ever
  // present with `words`. ABSENT means the line taught this reader nothing:
  // it teaches nothing, or the reader did not catch the words.
  string fact = 11;
}

// Perceived is how one entry reached its recipient (rpg-project#934, R6,
// R11): the senses that delivered it and the friends who contributed. A
// reusable part on the Act envelope.
message Perceived {
  // senses are the senses that delivered this entry: SENSE_SIGHT when the
  // speaker was seen, SENSE_HEARING when the words were caught or a voice was
  // noticed. Never empty on a present Perceived.
  repeated Sense senses = 1;

  // via are the party members whose senses contributed this entry under the
  // shared view (R5, R11, rpg-project#935). On a perception, a via entry names
  // the same friend its `observer` names. EMPTY means the recipient perceived
  // it with their own senses alone, and a client treats it so. A client shows
  // a shared entry as shared; it grants the recipient's character nothing.
  repeated Party via = 2;
}

// ClockMark is which piece of the table's bookkeeping a clock entry is.
enum ClockMark {
  CLOCK_MARK_UNSPECIFIED = 0;
  CLOCK_MARK_TICK = 1;
  CLOCK_MARK_TURN_ENDED = 2;
  CLOCK_MARK_FIGHT_FORMED = 3;
  CLOCK_MARK_FIGHT_DISSOLVED = 4;
  CLOCK_MARK_JOINED = 5;
  CLOCK_MARK_EXITED = 6;
  CLOCK_MARK_ARRIVED = 7;
  CLOCK_MARK_SCENE_OPENED = 8;
  // CLOCK_MARK_ENDED is the run ending.
  CLOCK_MARK_ENDED = 9;
  // CLOCK_MARK_WINDOW_OPENED is a step stopping to ask somebody.
  CLOCK_MARK_WINDOW_OPENED = 10;
  // CLOCK_MARK_ROLL_WINDOW_OPENED is a roll stopping to ask its roller.
  CLOCK_MARK_ROLL_WINDOW_OPENED = 11;
  // CLOCK_MARK_WAKE_CUT is the raise matching more beats than its bound and
  // cutting the rest (rpg-project#766).
  CLOCK_MARK_WAKE_CUT = 12;
}

// WakeCut is a raise that matched more beats than its bound and cut the rest.
message WakeCut {
  // matched is how many beats the raise matched.
  int32 matched = 1;
  // dropped is how many of those it cut.
  int32 dropped = 2;
}

// TurnPassed is a turn ending.
message TurnPassed {
  // member is whose turn ended.
  Party member = 1;
  // next is whose turn it is now.
  Party next = 2;
}

// FightFormed is a fight forming.
message FightFormed {
  // order is the initiative order.
  repeated Party order = 1;
  repeated Party surprised = 2;
}

// FightDissolved is a fight ending.
message FightDissolved {
  repeated Party members = 1;
  string cause = 2;
}

// Departure is a member leaving. The conditions it lifted are state entries
// sharing this act's id.
message Departure {
  Party member = 1;
  // holding is what left with them.
  repeated string holding = 2;
  // exit is the authored exit they took.
  string exit = 3;
}

// Arrival is a reserved placement entering.
message Arrival {
  string id = 1;
  string kind = 2;
  Position cell = 3;
}

// WindowOffer is one recipient of a window and what it offers.
message WindowOffer {
  Party audience = 1;
  ReactionRef reaction = 2;
}

// WindowOpened is a step stopping to ask.
message WindowOpened {
  // member is the mover.
  Party member = 1;
  // from and to are the step asked about.
  Position from = 2;
  Position to = 3;
  repeated WindowOffer windows = 4;
}

// RollWindowOpened is a roll stopping to ask its roller.
message RollWindowOpened {
  string presentation_id = 1;
  // audience is the roller.
  Party audience = 2;
  // offer is what they may spend.
  ReactionRef offer = 3;
  Roll roll = 4;
}

// EndingResult is what an ending meant for the party: the result the author
// declared on the ending that fired (rpg-project#714, S9). It is read from the
// ending, never stored beside it, so a reloaded closed run cannot disagree
// with its ending.
enum EndingResult {
  // ENDING_RESULT_UNSPECIFIED is an ending that states no result, and every
  // ending recorded before results existed. A client shows no result rather
  // than guessing one from the ending's name.
  ENDING_RESULT_UNSPECIFIED = 0;
  // ENDING_RESULT_SUCCESS is an ending the party won.
  ENDING_RESULT_SUCCESS = 1;
  // ENDING_RESULT_FAILURE is an ending the party lost.
  ENDING_RESULT_FAILURE = 2;
}

// ClockEntry is the table's bookkeeping. A clock entry inside an act carries
// that act's id and closes the act's open segment. Exactly the part matching
// `mark` is set; a scene opening carries none.
message ClockEntry {
  ClockMark mark = 1;
  // tick is the world clock's reading on a tick.
  uint64 tick = 2;
  TurnPassed turn = 3;
  FightFormed fight = 4;
  FightDissolved dissolved = 5;
  // member is who joined.
  Party member = 6;
  Departure departure = 7;
  Arrival arrival = 8;
  // ending is the ending reached.
  string ending = 9;
  WindowOpened window = 10;
  RollWindowOpened roll_window = 11;
  // outcome is the result the ending reached declares, beside `ending` on
  // CLOCK_MARK_ENDED (the ended beat's `outcome`); unspecified on every other
  // mark and on an ending that declares none.
  EndingResult outcome = 12;
  // wake_cut is set for CLOCK_MARK_WAKE_CUT.
  WakeCut wake_cut = 13;
}
