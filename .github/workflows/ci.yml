name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Default pull_request types are [opened, synchronize, reopened]; adding
    # labeled/unlabeled lets the breaking-change-approved override (see the
    # "Breaking change detection" step) take effect when the label is applied
    # *after* the PR is opened. Without this, applying the label later doesn't
    # retrigger CI and the breaking step keeps failing on its first run.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: write
  packages: write

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      
      - name: Lint
        run: buf lint
      
      - name: Format check
        run: buf format --diff --exit-code
      
      - name: Breaking change detection
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'breaking-change-approved')
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main"

      - name: Breaking change override notice
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'breaking-change-approved')
        run: |
          echo "::warning::buf breaking skipped — PR carries 'breaking-change-approved' label."
          echo "::warning::Per docs/how-to/breaking-change-workflow.md, this is acceptable for alpha packages with explicit reviewer ack, or when a version bump (e.g. v1alpha1→v1alpha2) is the chosen migration path."

  generate-and-test:
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v4
        with:
          go-version: '1.25'
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Test refgen tool
        run: cd tools/refgen && go test ./...

      - name: Test generated release transaction
        run: scripts/test-generated-release-transaction.sh

      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@latest

      - name: Generate code
        run: buf generate
      
      - name: Generate mocks
        run: make mocks
      
      - name: Verify Go generation
        run: |
          cd gen/go
          # Just verify the files were generated correctly
          find . -name "*.pb.go" -o -name "*.connect.go" | head -10
          echo "✓ Go files generated successfully"
      
      - name: Install TypeScript dependencies
        run: npm ci
      
      - name: Test TypeScript compilation
        run: |
          npx tsc --noEmit --project tsconfig.json
      
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-code
          path: gen/

  publish-packages:
    runs-on: ubuntu-latest
    needs: [lint-and-format, generate-and-test]
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: rpg-api-protos-generated-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: actions/setup-go@v4
        with:
          go-version: '1.25'
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
      
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      
      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@latest

      - name: Generate all code
        run: |
          buf generate
          make mocks
      
      - name: Setup Go module
        run: |
          cd gen/go
          go mod init github.com/KirkDiggler/rpg-api-protos/gen/go
          go mod tidy
      
      - name: Construct and validate local release
        run: |
          set -euo pipefail

          SOURCE_SHA="${{ github.sha }}"
          REPOSITORY_MODULE_PATH="github.com/${{ github.repository }}"
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          if [ "$CHECKED_OUT_SHA" != "$SOURCE_SHA" ]; then
            echo "Expected checkout $SOURCE_SHA, found $CHECKED_OUT_SHA" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --force --tags origin

          # Construct a generated commit locally. Its trailer is the durable,
          # repository-owned identity used to recognize same-source reruns.
          git checkout -B generated "$SOURCE_SHA"
          sed '/^gen\/$/d' .gitignore > .gitignore.tmp
          mv .gitignore.tmp .gitignore
          git add gen/ .gitignore
          git commit --allow-empty \
            -m "chore: update generated code and mocks" \
            -m "Source-SHA: $SOURCE_SHA"
          CANDIDATE_COMMIT="$(git rev-parse HEAD)"

          PLAN_FILE="$(mktemp)"
          scripts/plan-generated-release.sh \
            "$SOURCE_SHA" \
            "$CANDIDATE_COMMIT" \
            "$REPOSITORY_MODULE_PATH" > "$PLAN_FILE"
          # The planner emits constrained KEY=value fields only.
          # shellcheck disable=SC1090
          . "$PLAN_FILE"
          rm "$PLAN_FILE"

          if [ "$REUSE_RELEASE" = "true" ]; then
            # Publish from the immutable tagged commit, not from a newly
            # generated retry workspace whose tool dependencies may have moved.
            git reset --hard "$GENERATED_COMMIT"
          else
            git tag -a "$NEW_TAG" \
              -m "Generated code for $NEW_TAG" "$GENERATED_COMMIT"
            git tag -a "$GO_MODULE_TAG" \
              -m "Generated Go module for $NEW_TAG" "$GENERATED_COMMIT"
          fi

          # Validate the complete local release before any remote ref changes.
          ACTUAL_MODULE_PATH="$(cd gen/go && go list -m)"
          if [ "$ACTUAL_MODULE_PATH" != "$MODULE_PATH" ]; then
            echo "Expected Go module $MODULE_PATH, found $ACTUAL_MODULE_PATH" >&2
            exit 1
          fi
          EXPECTED_GO_MODULE_TAG="$MODULE_TAG_PREFIX/$NEW_TAG"
          if [ "$GO_MODULE_TAG" != "$EXPECTED_GO_MODULE_TAG" ]; then
            echo "Expected Go module tag $EXPECTED_GO_MODULE_TAG, found $GO_MODULE_TAG" >&2
            exit 1
          fi
          for TAG in "$NEW_TAG" "$GO_MODULE_TAG"; do
            if [ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]; then
              echo "Expected annotated tag: $TAG" >&2
              exit 1
            fi
            if [ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$GENERATED_COMMIT" ]; then
              echo "Tag $TAG does not point to generated commit $GENERATED_COMMIT" >&2
              exit 1
            fi
          done

          RELEASE_SOURCE="$(git show -s --format='%(trailers:key=Source-SHA,valueonly)' "$GENERATED_COMMIT")"
          if [ "$RELEASE_SOURCE" != "$SOURCE_SHA" ]; then
            echo "Generated commit $GENERATED_COMMIT does not record source $SOURCE_SHA" >&2
            exit 1
          fi

          # Build and inspect the npm payload in an isolated workspace. The
          # checked-in package version remains untouched.
          NPM_WORKSPACE="$RUNNER_TEMP/npm-release-$NPM_VERSION"
          rm -rf "$NPM_WORKSPACE"
          mkdir -p "$NPM_WORKSPACE/gen"
          cp package.json package-lock.json README.md "$NPM_WORKSPACE/"
          cp -R gen/ts "$NPM_WORKSPACE/gen/ts"
          (
            cd "$NPM_WORKSPACE"
            npm version --no-git-tag-version "$NPM_VERSION"
            npm pkg set \
              "rpgApiProtosRelease.tag=$NEW_TAG" \
              "rpgApiProtosRelease.goModuleTag=$GO_MODULE_TAG" \
              "rpgApiProtosRelease.sourceCommit=$SOURCE_SHA" \
              "rpgApiProtosRelease.generatedCommit=$GENERATED_COMMIT"
            npm pack --dry-run --json > npm-pack.json
            NPM_VERSION="$NPM_VERSION" node <<'NODE'
          const fs = require("fs");
          const pkg = require("./package.json");
          const pack = JSON.parse(fs.readFileSync("npm-pack.json", "utf8"));
          if (!Array.isArray(pack) || !pack[0]?.files?.some((file) => file.path.startsWith("gen/ts/"))) {
            throw new Error("npm payload does not contain generated TypeScript");
          }
          if (pkg.version !== process.env.NPM_VERSION) {
            throw new Error(`expected npm version ${process.env.NPM_VERSION}, found ${pkg.version}`);
          }
          NODE
            rm npm-pack.json
          )
          NPM_PACKAGE="$(cd "$NPM_WORKSPACE" && node -p 'require("./package.json").name')"
          if [ "$NPM_PACKAGE" != "@kirkdiggler/rpg-api-protos" ]; then
            echo "Unexpected npm package identity: $NPM_PACKAGE" >&2
            exit 1
          fi

          echo "Latest strict root tag: $LATEST_TAG"
          echo "Release root tag: $NEW_TAG"
          echo "Go module tag: $GO_MODULE_TAG"
          echo "Generated commit: $GENERATED_COMMIT"
          echo "Reuse release: $REUSE_RELEASE"

          {
            echo "SOURCE_SHA=$SOURCE_SHA"
            echo "GENERATED_COMMIT=$GENERATED_COMMIT"
            echo "NEW_TAG=$NEW_TAG"
            echo "GO_MODULE_TAG=$GO_MODULE_TAG"
            echo "NPM_VERSION=$NPM_VERSION"
            echo "NPM_PACKAGE=$NPM_PACKAGE"
            echo "NPM_WORKSPACE=$NPM_WORKSPACE"
          } >> "$GITHUB_ENV"

      - name: Atomically publish generated branch and release tags
        run: |
          set -euo pipefail
          git push --atomic origin \
            "+$GENERATED_COMMIT:refs/heads/generated" \
            "refs/tags/$NEW_TAG:refs/tags/$NEW_TAG" \
            "refs/tags/$GO_MODULE_TAG:refs/tags/$GO_MODULE_TAG"

      - name: Check GitHub release publication
        run: |
          set -euo pipefail
          DECISION="$(scripts/release-publication-status.sh \
            github "${{ github.repository }}" "$NEW_TAG")"
          echo "GitHub release $NEW_TAG: $DECISION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_TAG }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish npm package if absent
        run: |
          set -euo pipefail
          DECISION="$(scripts/release-publication-status.sh \
            npm "$NPM_PACKAGE" "$NPM_VERSION" "$NEW_TAG" \
            "$GO_MODULE_TAG" "$SOURCE_SHA" "$GENERATED_COMMIT")"
          case "$DECISION" in
            publish)
              (cd "$NPM_WORKSPACE" && npm publish --access public)
              ;;
            already-published)
              echo "$NPM_PACKAGE@$NPM_VERSION already has release identity $NEW_TAG; skipping publish"
              ;;
            *)
              echo "Unexpected npm publication decision: $DECISION" >&2
              exit 1
              ;;
          esac
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
