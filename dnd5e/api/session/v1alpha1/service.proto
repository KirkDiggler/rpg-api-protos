syntax = "proto3";

package dnd5e.api.session.v1alpha1;

import "dnd5e/api/session/v1alpha1/events.proto";
import "dnd5e/api/session/v1alpha1/types.proto";

option go_package = "github.com/KirkDiggler/rpg-api-protos/gen/go/dnd5e/api/session/v1alpha1;sessionpb";
option java_multiple_files = true;
option java_package = "com.kirkdiggler.rpg.api.dnd5e.session.v1alpha1";

// SessionService is the wire form of the toolkit's `rulebooks/dnd5e/session`
// package — one verb surface, transcribed (shapes read from session/v0.18.0;
// Afford from session/v0.21.3; VERB_MOVE, Declaration.remaining and Move's
// turn-clock refusals from the tag that closes rpg-toolkit#1169; combat-turn
// contract, rpg-project#249 — SDK fields land with the toolkit issues named
// inline: reach #1010, standing and names #1137, weapon identity #866).
//
// Three rules from rpg-project/ideas/session-api/design.md shape every message
// below, and are worth reading before adding anything to this file:
//
//  1. Messages mirror the SDK's exported input/output types FIELD-FOR-FIELD.
//     rpg-api invents no vocabulary; a field with no SDK counterpart is a design
//     change and goes through the design doc first.
//  2. A VERB'S RESPONSE DESCRIBES ONLY THE CALLER'S OWN ACTION. Everything else
//     — monsters acting, other members moving, the world waiting — reaches a
//     client through StreamEvents, single-player included. That is why every
//     mutating response below is narrow and why the stream is not optional.
//  5. CREATION IS THE LOBBY'S. The SDK's StartSession and Spawn are deliberately
//     absent from this service: LobbyService.StartEncounter calls them
//     in-process. There is no creation RPC here, in v1 or after.
//
// ONE MAP, AND NO TRAVERSE. Design §0's ruling has arrived in the SDK rather
// than remaining a destination this contract waits on: v0.10.0 made the Atlas
// one map, v0.11.0 took rooms off joins, placements and outcomes, and v0.12.0
// made a walk cross a doorway and retired the Traverse verb. So there is no
// Traverse RPC here, no room ID anywhere on the seam, and every position is
// dungeon-absolute. A doorway crossing is an ordinary step of Move.
//
// Response naming follows the SDK's return shape: where a verb returns a struct
// its fields are carried directly on the Response (MoveResponse IS
// session.MoveOutput), and where it returns a slice the Response wraps one
// repeated field. No Output type is re-wrapped in a single-field envelope.

// =============================================================================
// Roster
// =============================================================================

// JoinRequest brings a PLAYER into the session's encounter.
//
// Players only, and the split is by where the data comes from rather than by
// what the thing is: a character is loaded from the host's repository, a monster
// is built from a ref through Spawn (which is the lobby's, in-process). There is
// no ref field here and its absence is the point — no toolkit package can load a
// player character, so a "dnd5e:characters:..." ref would claim otherwise.
//
// NOT_FOUND if the session, encounter or character is absent; FAILED_PRECONDITION
// if the encounter has already ended.
message JoinRequest {
  // room = 3 named the room to place the member in, until session v0.11.0 made
  // placement a cell on the map. See Member in types.proto.
  reserved 3;
  reserved "room";

  string session = 1;
  // The joining player's character ID, which is also the ID they are known by
  // inside the encounter.
  string member = 2;
  // The cell to place them on, dungeon-absolute — the same coordinates the
  // Atlas and every other verb speak. Which room owns that cell is worked out
  // inside the composition: a caller places somebody on the map, not in a
  // chamber.
  Position position = 4;
}

// JoinResponse mirrors session.JoinOutput.
message JoinResponse {
  // The joined member's placement.
  Member member = 1;
  // The joined character's state, derived after loading. Always populated: a
  // player with no loadable character does not join at all.
  CharacterState character = 2;
  // What changed in each observer's perception, keyed by observer. Absent
  // observers saw nothing new.
  map<string, Discovery> discovered = 3;
  // The story sequence of the recorded join.
  uint64 seq = 4;
  // Present if an ending fired on the join.
  Outcome outcome = 5;
  // Present if arriving put the newcomer in sight of the other side and a fight
  // started around them.
  Formed formed = 6;
  SaveReport saved = 7;
  DeliveryReport delivery = 8;
}

// ExitRequest removes a member from the session's encounter.
message ExitRequest {
  string session = 1;
  string member = 2;
}

// ExitResponse mirrors session.ExitOutput.
message ExitResponse {
  // The member's final placement.
  MemberOutcome outcome = 1;
  // What the member knew on the way out — the knowledge that leaves with them
  // rather than staying with the encounter.
  repeated Sighting carry = 2;
  // The story sequence of the recorded exit.
  uint64 seq = 3;
  // Present if the encounter auto-closed because the last member left.
  Outcome closed = 4;
  SaveReport saved = 5;
  DeliveryReport delivery = 6;
}

// =============================================================================
// Free roam
// =============================================================================

// MoveRequest walks a member along a path, one cell at a time.
//
// A PATH, NOT A DESTINATION. Walking the cells in between is what makes them
// real: anything that fires because a member entered a particular cell can only
// be noticed by something that visits each of them. A single-cell path is the
// ordinary case and entirely legal.
//
// Validation is complete before the first cell is entered — a path with a gap is
// rejected whole rather than walked up to the gap, because a caller who
// mis-computed a route wants none of it rather than an arbitrary prefix.
// A WALK CROSSES A DOORWAY (session v0.12.0, rpg-toolkit#1048). The far side of
// a doorway is simply the next cell along, so a crossing is an ordinary step of
// the same size as any other and needs no separate verb — which is why the
// Traverse RPC is gone rather than deprecated.
//
// ADJACENCY IS NOT PERMISSION, though, and this is the trap worth knowing: a
// pair of cells can be perfectly adjacent and still have nothing to walk
// through. Two cells are walkable between only if a doorway joins them or they
// sit in open floor; the composition's internal chambers are what create the
// gap, but a client never sees those and does not need to — the observable
// rule is about cells. That case is invisible to a client reading only
// GetAtlasResponse.cells: the joint is in `doorways` or it is nowhere. The SDK
// refuses it with its own sentinel (ErrNoCrossing, "no doorway joins those
// cells"), kept distinct from a path that is not a walk at all.
//
// ON THE TURN CLOCK, A WALK SPENDS MOVEMENT (rpg-toolkit#1169). Through
// session/v0.21.x every member of a fight was refused this verb outright
// (ErrInBubble, "fights have their own turn structure, which this surface does
// not expose yet"). That lock is gone, and it was not loosened but REPLACED
// with two refusals the economy owns:
//
//   - NOT YOUR TURN. Only the fight's active member may walk; anyone else in
//     the bubble is refused with the SDK's ErrNotYourTurn — the same sentinel
//     EndTurn carries for the same question, and distinct from "not in a
//     fight". This is what the old fight-lock became for a non-active member;
//     there is no separate in-a-fight refusal on this verb any more.
//   - NOT ENOUGH MOVEMENT. The whole requested path is priced at the server's
//     five feet per cell and charged through the same gate Attack pays a swing
//     through, BEFORE any cell is entered. A path longer than the turn has
//     left is refused whole, naming the currency — ErrCannotAfford with the
//     text "movement: <N> ft needed, <M> ft left" — and not one cell of it
//     happens. Afford's VERB_MOVE declaration reports that M ahead of time.
//
// Both are rules refusals, not caller defects: FAILED_PRECONDITION, exactly as
// ErrCannotAfford already maps on Attack, never INVALID_ARGUMENT. On the turn
// clock `declaration_id` is required and selects the current compiled Move
// offer. On the world clock it must be empty. A non-empty selector arriving
// after a transition to the world clock is stale and must be refused; it must
// never become a free move. Free roam otherwise remains unpriced.
//
// INVALID_ARGUMENT for an empty or broken path, a bad position, or a step
// between two cells that nothing joins; FAILED_PRECONDITION if it is not the
// walker's turn, if the path costs more movement than the turn has left, or if
// the encounter is closed.
message MoveRequest {
  string session = 1;
  string member = 2;
  // The cells to walk through, in order, each adjacent to the last and the
  // first adjacent to where the member currently stands.
  repeated Position path = 3;
  // Required on the turn clock; empty on the world clock.
  string declaration_id = 4;
}

// MoveResponse mirrors session.MoveOutput.
//
// A SHORT WALK IS NOT AN ERROR. Fewer steps than the requested path means the
// walk stopped early, and the reason is in outcome or formed; the movement that
// happened, happened, and it is exactly what the caller asked for up to the
// point the world changed.
message MoveResponse {
  // What actually happened, in order.
  repeated Step steps = 1;
  // What changed in each observer's perception across the whole walk, keyed by
  // observer.
  map<string, Discovery> discovered = 2;
  // Present if an ending fired underfoot, which is also why the walk stopped.
  Outcome outcome = 3;
  // Present if the walk put the walker in sight of the other side and a fight
  // started, which is also why the walk stopped. The remaining cells were not
  // attempted: a fight member does not free-roam.
  Formed formed = 4;
  SaveReport saved = 5;
  DeliveryReport delivery = 6;
}

// =============================================================================
// Fight
// =============================================================================

// AttackRequest swings one member's weapon at another.
//
// MEMBER-NEUTRAL ON PURPOSE, mirroring the SDK: both sides are IDs and nothing
// here is character-shaped, even though v1 compiles CHARACTER attackers only
// (a monster attacker is refused FAILED_PRECONDITION, from the SDK's
// ErrNotACharacter). Scope by the case, shape for the future — the day a monster
// attacker compiles, this message does not change and no client that wrote
// against it has to.
//
// One known gap the SDK names and this contract inherits verbatim: main hand,
// one-handed, melee only. "Nothing spends" stopped being a gap at
// session/v0.17.0 — a swing pays through the economy, and a second swing in a
// turn that bought one is refused FAILED_PRECONDITION with ErrCannotAfford
// naming the currency ("action: 1 needed, 0 left"). Afford reports that budget
// before the refusal.
//
// RULE REFUSALS ARE FAILED_PRECONDITION AND ANNOUNCED BY AFFORD FIRST
// (rpg-project#249). None is a caller defect or INVALID_ARGUMENT:
//
//   - NOT YOUR TURN. Only the fight's active member swings; anyone else in
//     the bubble gets the SDK's ErrNotYourTurn — the same sentinel Move and
//     EndTurn carry for the same question.
//   - DOWNED. ErrDowned blocks Attack (and Move), but never End Turn; End Turn
//     remains governed solely by its clock/turn gate.
//   - UNREADABLE. An unreadable character or Attack dependency emits an early
//     blocked Attack declaration rather than making the Attack row disappear.
//   - NO TARGET IN REACH. When no candidate is available, the compiled Attack
//     declaration is disabled with NO_TARGET_IN_REACH without dropping its
//     candidate rows. A named member beyond weapon reach (one cell for melee,
//     two with reach) remains in those rows with candidate-level
//     TARGET_OUT_OF_REACH (rpg-toolkit#1010, ErrOutOfReach). A ranged weapon
//     stays refused as today. An unavailable or absent target is refused here.
//   - ACTION BUDGET. ErrCannotAfford, "action: 1 needed, 0 left", as above.
//
// AN EMPTY HAND IS NOT A REFUSAL. A character with nothing equipped swings an
// unarmed strike — catalog ref "dnd5e:weapons:unarmed-strike", bludgeoning —
// because that is the rule, not a gap (rpg-toolkit#1168). ErrBadAttack stays
// for a sheet the rulebook cannot read at all.
//
// `declaration_id` is required and must select the current compiled Attack
// offer. Unknown, stale, mismatched, or now-unavailable selectors are refused
// with FAILED_PRECONDITION; the client refreshes and never retries implicitly.
message AttackRequest {
  string session = 1;
  // Who swings.
  string attacker = 2;
  // Who they swing at.
  string target = 3;
  // Non-empty opaque selector echoed from Afford.
  string declaration_id = 4;
}

// AttackResponse mirrors session.AttackOutput.
message AttackResponse {
  // The d20 as rolled, after any advantage or disadvantage.
  int32 roll = 1;
  // The roll plus everything the attack chain added.
  int32 total = 2;
  // The number the total had to reach.
  int32 against = 3;
  bool hit = 4;
  bool critical = 5;
  // What was dealt. Zero on a miss.
  int32 damage = 6;
  // The story sequence of the recorded beat.
  uint64 seq = 7;
  SaveReport saved = 8;
  DeliveryReport delivery = 9;
  // What was swung — ref, name and damage type. This must equal the selected
  // Declaration.attack and the corresponding Struck.attack or Missed.attack;
  // the provider must not offer one Attack and resolve another. The beat line's
  // "6 slashing" and "with a longsword" come from here. Lands with
  // rpg-toolkit#866.
  AttackRef attack = 10;
}

// TurnRequest asks what one member is waiting on.
//
// ASKED OF A MEMBER, NEVER OF THE SESSION, and that is not a convenience choice.
// Several clocks can run at once — a fight in the crypt while the rest of the
// party explores the hall — so "whose turn is it?" has no answer here and never
// will. A top-level query would have to pick one privileged clock to be THE
// clock, and every client written against it would need rewriting the first time
// a second fight started. GetStatus deliberately learns nothing per-member for
// the same reason.
message TurnRequest {
  string session = 1;
  string member = 2;
}

// TurnResponse mirrors session.TurnOutput.
message TurnResponse {
  // Which kind of time they are in.
  ClockKind clock = 1;
  // Whose turn it currently is on that clock. Empty on the world clock, which
  // has no turn order.
  string active = 2;
  // Which round that clock is in. Zero on the world clock.
  int32 round = 3;
  // The initiative order of the fight they are in, first to act first. Empty on
  // the world clock.
  repeated string order = 4;
  // The same members as `order`, in the same order, each with what a bare id
  // cannot carry: name, kind, standing, and whether they are the active one.
  // Empty on the world clock. `order` stays for the readers it already has —
  // a new client reads this and never joins the two. See Participant for why
  // this is not the roster read the seam refuses. Lands with rpg-toolkit#1137.
  repeated Participant participants = 5;
}

// AffordRequest asks what one member can still declare this turn.
//
// Added with session/v0.21.3 (toolkit#1138, ADR-0042), and it closes the gap
// the economy opened: v0.17.0 made a second swing in a turn that bought one
// refusable, and the refusal is careful to name the currency that ran out —
// but nothing on the seam said so BEFORE the refusal. A turn UI built against
// that had exactly two options: offer the button and let the server say no, or
// re-derive 5e's economy client-side — a level-1 fighter gets one swing, Extra
// Attack lands at level 5 — which is the Boundary Rule violation this whole
// seam exists to prevent. This read is the third option.
//
// THE MEMBER'S OWN BUDGET, and the singular is the same law GetWhere and Turn
// keep: the host binds `member` to the authenticated caller, because the SDK
// cannot tell who is asking and a client-supplied ID wired through unchecked
// turns a caller-scoped read into one that answers about anybody.
//
// NOT_FOUND if the session, encounter or member is absent. Session/world load
// failures fail the read; unreadable character/action dependencies are instead
// projected per verb as UNREADABLE so independent declarations still arrive.
message AffordRequest {
  string session = 1;
  // Whose budget is being asked about — the caller's own.
  string member = 2;
}

// AffordResponse mirrors session.AffordOutput.
//
// DECLARATIONS, NOT REMAINING CURRENCIES. Kirk's ruling on toolkit#1138:
// "backend tells dumb client what it can do." Reporting {action: 0, bonus: 1}
// would still make the client know a swing costs an action — the rule would
// have leaked through the very read meant to keep it server-side. So this
// carries can-or-cannot per verb, with the Slot a client lights and the
// Shortfall it can repeat. See Declaration in types.proto and ADR-0042.
//
// THE COMPLETE CURRENT GATE. Each compiled declaration is one action/cost
// variant with a fixed target kind and availability under every gate applicable
// to that verb. Every compiled Attack, turn-clock Move, and End Turn has a
// non-empty selector. Every compiled Attack carries its exact full-ref
// AttackRef and every current live-sight member except the actor exactly once,
// including unavailable candidates and their target-specific reasons; a live
// holding with no position fails Afford. Candidate why is present if and only
// if candidate available is false. Candidate-level TARGET_OUT_OF_REACH remains
// alongside its row; declaration-level NO_TARGET_IN_REACH disables the Attack
// without removing rows.
//
// EARLY BLOCKERS ARE ROWS, NOT OMISSIONS. If a per-verb gate stops compilation,
// Afford still emits that verb's declaration (including Attack) with
// available=false, why present, empty id, absent attack, empty candidates, and
// its fixed target kind. Compiled offers disabled by later budget/target gates
// retain their non-empty id and, for Attack, attack and candidate rows. The
// fixed mapping for compiled and blocked rows is Attack -> MEMBER, Move -> PATH,
// End Turn -> NONE; UNSPECIFIED is a producer defect. remaining is present only
// for Move and absent for Attack and End Turn. DOWNED blocks Attack and Move
// only; End Turn is governed solely by clock/turn. The client never computes
// reach, cost, eligibility, or refusal precedence.
message AffordResponse {
  // Which kind of time they are in. CLOCK_KIND_WORLD means the action economy
  // does not apply to them at all.
  ClockKind clock = 1;
  // One entry per compiled Attack variant, or an Attack blocker when Attack
  // compilation cannot proceed, plus independently compiled/blocked Move and
  // End Turn rows. Move carries provider-authored `remaining` feet for
  // display/context only (rpg-toolkit#1169). Clients do not convert it to cells
  // or derive path cost; the server authoritatively prices and accepts or
  // refuses the whole path.
  //
  // EMPTY ON THE WORLD CLOCK, AND EMPTY IS THE ANSWER. A client must not read
  // an empty list as "unknown" or as a shorter way of asking again: free roam
  // has no budget to report, and the SDK goes out of its way to marshal this
  // as "[]" rather than omit it, for the same false-vs-absent reason every
  // bool at this seam keeps. Proto carries no empty-vs-absent distinction on a
  // repeated field, which is fine — `clock` says which case this is.
  repeated Declaration declarations = 2;
}

// EndTurnRequest ends a member's turn and hands the fight to whoever is next.
//
// There is deliberately no "end the current turn" form — that would be the
// privileged-clock question wearing a verb's clothes (see TurnRequest).
// `declaration_id` is required and must select the current compiled End Turn
// offer. FAILED_PRECONDITION if it is empty, unknown, stale, the member is not
// in a fight, or it is not their turn.
message EndTurnRequest {
  string session = 1;
  // Whose turn is ending — and it must be THEIR turn.
  string member = 2;
  // Non-empty opaque selector echoed from Afford.
  string declaration_id = 3;
}

// ActivateRequest uses a combat ability or feature the member already carries
// — Dodge, Dash, Disengage, Help, Hide, Rage, Second Wind.
//
// `declaration_id` is required and must select the current compiled Activate
// offer, which is also WHICH ability is being used: the selector identifies one
// of seven rows, so there is no ability ref on this request. A client that sent
// a ref instead of a selector would be naming the ability itself, which is the
// thing Afford exists to have already decided.
//
// Unknown, stale, mismatched or now-unavailable selectors are refused with
// FAILED_PRECONDITION; the client refreshes and never retries implicitly. The
// same code covers a spent slot, exhausted charges, and the ability's own
// refusal — each of which Afford reported ahead of the attempt.
message ActivateRequest {
  string session = 1;
  // Who is activating. Bound to the authenticated caller by the host.
  string member = 2;
  // Non-empty opaque selector echoed from Afford.
  string declaration_id = 3;
  // Required when the selected declaration's target_kind is MEMBER, which at
  // level 1 means Help and nothing else. Empty for the other six, and a
  // populated target on a TARGET_KIND_NONE declaration is INVALID_ARGUMENT
  // rather than a value quietly ignored.
  string target = 4;
}

// ActivateResponse is an acknowledgement, by Kirk's ruling (rpg-project#300):
// *"empty ack for success or an error."*
//
// # It says nothing about what the member can do next
//
// The rulebook's own ActivateAbilityOutput carries a refreshed ability list,
// and returning that here would put a SECOND declaration surface on the wire
// beside Afford — two RPCs answering "what can I do", free to disagree, with
// the client left to learn which one wins. The client re-reads Afford. One
// round trip more; exactly one source of truth.
//
// # A refusal is an ERROR, never a field
//
// There is no success bool and no error string, and that is load-bearing rather
// than minimal. The rulebook underneath returns (output{Success:false}, nil)
// for "not in combat", "unknown ability", "no charges left" and every feature
// refusal. A host that forwarded those as a successful response would make an
// empty success and an empty refusal THE SAME BYTES — a silent no-op, which is
// precisely what an ack this thin cannot survive. The host translates:
// Success:false becomes FAILED_PRECONDITION carrying the rulebook's own words.
//
// # Why it is not literally empty
//
// saved and delivery are not "what you can do next" — they are S6's law, which
// every mutating verb at this seam keeps: a partial save is an error carrying a
// populated report, never a silent shrug. An activation writes a sheet and
// publishes a condition, so both can be half-done, and a caller told only
// "fine" would have no way to tell a durable rage from one that never reached
// disk.
message ActivateResponse {
  SaveReport saved = 1;
  DeliveryReport delivery = 2;
}

// EndTurnResponse mirrors session.EndTurnOutput.
message EndTurnResponse {
  // Who acts now.
  string next = 1;
  // Whether that was the last turn of the round, so the order has come back
  // around.
  bool round_wrapped = 2;
  // The story sequence of the recorded beat.
  uint64 seq = 3;
  SaveReport saved = 4;
  DeliveryReport delivery = 5;
}

// DissolveRequest ends the fight a member is in and returns everyone to free
// roam.
//
// A fight is reached THROUGH a member rather than by name, because it has no
// name: the composition models a bubble as something you find by asking who is
// in it.
//
// This is the half of ending a fight that a verb can fix — the party deciding to
// disengage. Defeat is the other half and will never be a second verb: it is a
// fact the world notices, so it arrives as another DissolveKind produced by the
// composition, not as a caller-invoked mechanism.
message DissolveRequest {
  string session = 1;
  // Anyone in the fight.
  string member = 2;
  // Why it is ending. Required — a caller that will not say why is asking for
  // an effect without an account of it. The SDK models this as a sealed
  // interface whose declared wire form is exactly this enum.
  //
  // BY_DECISION is the only cause a caller can honestly declare, because THIS
  // VERB IS THE DECISION. BY_DEFEAT is a real value of this enum and a real
  // thing that happens, but the world notices it — sending it here does not
  // fail the call and does not change the outcome, it simply does not survive
  // contact with the answer. See DissolveKind.
  DissolveKind cause = 3;
}

// DissolveResponse mirrors session.DissolveOutput.
message DissolveResponse {
  // Everyone who was in it, now back on the world clock. Time spent fighting is
  // spent, not banked: everyone re-homes at budget zero.
  repeated string members = 1;
  // Why it ended, echoed for a caller handling the response.
  DissolveKind cause = 2;
  // The story sequence of the recorded beat.
  uint64 seq = 3;
  SaveReport saved = 4;
  DeliveryReport delivery = 5;
}

// =============================================================================
// Endings
// =============================================================================

// EndRequest closes the session's encounter through a declared EXTERNAL ending.
//
// Endings are declared when a world is authored, so NOT_FOUND here means the
// caller named something that was never on the menu — not that the encounter is
// missing.
message EndRequest {
  string session = 1;
  // The key of the declared external ending to fire.
  string ending = 2;
}

// EndResponse mirrors session.EndOutput.
message EndResponse {
  // The final state: which ending fired and where everyone stood.
  Outcome outcome = 1;
  SaveReport saved = 2;
  DeliveryReport delivery = 3;
}

// =============================================================================
// Reads
// =============================================================================

// GetStatusRequest asks whether a session's encounter is open.
message GetStatusRequest {
  string session = 1;
}

// GetStatusResponse mirrors session.Status.
//
// Encounter-wide and NEVER per-member — pinned by the SDK rather than merely
// unimplemented. A convenience field here answering "the" active actor would
// create a privileged clock by implication; ask TurnRequest instead.
message GetStatusResponse {
  // Whether the encounter is active.
  bool open = 1;
  // The ending that fired, present only once closed.
  Outcome outcome = 2;
}

// GetStoryRequest reads the beats a member has witnessed.
//
// THE RESYNC SOURCE OF TRUTH (design rule 6). Delivery on StreamEvents is
// best-effort and carries no replay obligation; a client that notices a gap in
// `seq` re-queries here from its last known value.
//
// NOT_FOUND with the SDK's ErrStoryTrimmed semantics means the requested resume
// point has aged out of the retention window and the caller must resync from
// zero rather than resume — a short answer would be indistinguishable from a
// complete one and would leave a permanent hole in the client's view.
message GetStoryRequest {
  string session = 1;
  // The viewer whose story is requested.
  string member = 2;
  // The INCLUSIVE lower bound: entries begin AT this sequence. To resume after
  // entry N, pass N+1. Zero means "I hold nothing, send what you have" and is
  // always answerable, however much has aged out.
  uint64 from_seq = 3;
}

// GetStoryResponse carries session.Story's return slice, projected through
// the SAME converter StreamEvents uses.
//
// Each entry is the Event a live subscriber would have received for this seq
// — kind, typed body, recipient and all — so a client catching up after a gap
// reads exactly what it missed. Catch-up and live are ONE shape: there is no
// second, lossier projection of a beat that a client has to decode
// differently (rpg-api-protos#239 — the old StoryEntry carried only the raw
// payload, which left caught-up beats untyped in the client's feed).
//
// Entries are addressed to `member`: every Event's `recipient` equals the
// requested member, the same assertion StreamEvents makes.
message GetStoryResponse {
  repeated Event entries = 1;
}

// GetViewRequest asks what one member currently perceives.
message GetViewRequest {
  string session = 1;
  // The observer.
  string member = 2;
}

// GetViewResponse carries session.View's return slice.
//
// WHAT THIS MEMBER PERCEIVES OF OTHERS. It skips self, and that is a division of
// labour rather than a gap: GetWhere answers "where am I" (session/v0.13.0),
// and GetView answers "what do I hold of everyone else" — reporting only what
// the observer actually perceives, which is what keeps it from leaking the
// cells of members behind a door they have not opened.
//
// Through session/v0.12.0 the omission WAS a gap, because nothing else answered
// self either; design rule 11 tracked it and reconnect leaned on GetStory
// replay for position. That is closed — see GetWhereRequest below.
message GetViewResponse {
  repeated Sighting sightings = 1;
}

// GetWhereRequest asks where one member stands.
//
// Added with session/v0.13.0 (toolkit#1051), and it closes design rule 11 on
// the wire: a cold client can now learn its own position from a read. Before
// this, a client knew its own cell only by remembering the last Move it made —
// which holds right up until the moment it matters: a reconnect, a fresh tab, a
// second device, a response it never received.
//
// NOT_FOUND if the session, encounter or member is absent.
message GetWhereRequest {
  string session = 1;
  // The member whose own placement is being asked for.
  string member = 2;
}

// GetWhereResponse mirrors session.WhereOutput.
//
// ONE MEMBER'S OWN PLACEMENT, and the singular is the design rather than a
// first cut. There is deliberately no read that returns everybody's positions:
// a roster would hand a client the cells of members it has never perceived —
// around a corner, in a room it has not entered, behind a door it has not
// opened — which is the one thing perception exists to prevent, and exactly the
// fog-of-war leak design rule 4 keeps rpg-api away from. Where somebody ELSE
// is, is GetView's answer, and GetView reports only what the observer holds.
//
// A LIVE READ, not a stored one: the position comes from the composition's
// roster, which projects each member's cell when asked. A member who has walked
// is reported where they are now.
message GetWhereResponse {
  // The cell they stand on, dungeon-absolute — the same coordinates the Atlas
  // draws and every verb takes.
  Position position = 1;
}

// GetRosterRequest asks who is in a session.
message GetRosterRequest {
  string session = 1;
}

// GetRosterResponse carries the public half of every member — see
// PublicMemberInfo for the public/private law and why there are no
// positions here. Load once per session, re-pull on a joined event,
// reference at render.
message GetRosterResponse {
  repeated PublicMemberInfo members = 1;
}

// GetAtlasRequest asks for a session's static world map, as one member
// knows it.
message GetAtlasRequest {
  string session = 1;
  // The viewer. Bound to the authenticated caller by the host — the same
  // law Afford and GetWhere keep — because concealed structure makes this a
  // member-scoped answer: a client-supplied ID wired through unchecked
  // would read another member's secrets. Added with rpg-api-protos#266;
  // scoping reaches exactly as far as concealed structure requires
  // (below) and no further.
  string member = 2;
}

// GetAtlasResponse mirrors session.Atlas.
//
// CONSTRUCTION TRUTH — unchanged by movement, joins, exits or endings —
// WITH ONE CARVE-OUT: concealed structure this member has not had
// revealed is not in their answer (ruled on rpg-project#350 and #351,
// review findings ratified). The absence law:
//
//   - ABSENT FROM EVERY DOOR-LIST: a concealed unfound door's
//     AtlasDoorway entries do not appear in `doorways`, nor its DoorInfo
//     in GetDoors — presence in any list, even marked, leaks the secret.
//   - MASKED AS WALL IN GEOMETRY: `boundaries` gains a synthetic ordinary
//     boundary at the door's edges, indistinguishable from an authored
//     wall — nothing marks it. Masked rather than omitted because a
//     door's edges carry no authored boundary (a door cannot stand in a
//     wall; the authored wall run has a gap there, filled by the doorway
//     entry), so pure omission would render a HOLE in the wall run
//     exactly where the secret is — the absence itself would leak. The
//     fiction already says what belongs there: a concealed door IS a
//     wall until found.
//   - THE ROOM HIDES WITH ITS DOOR (ruled on rpg-project#351: client fog
//     does not hide unexplored space, so the map itself must keep the
//     secret). A concealed region a member has not had revealed is
//     absent ENTIRELY — its cells from `cells`, its AtlasRegion from
//     `regions`, its props from `props`, its interior boundaries from
//     `boundaries` — so the space reads as solid mass exactly like
//     anywhere beyond the map's edge, with the masquerade wall covering
//     the one gap its door would leave. Every entrance of a concealed
//     region is itself a concealed door (authoring refuses anything
//     else), each keeping the two door halves above.
//
// That is rpg-api-protos#266 — rpg-toolkit#1020's shelf coming due for
// doors, per the standing ruling that detection beats are per-player from
// birth. Everything else is identical for every member — full data until
// v1.0.
//
// Still fetch once per encounter and cache it, never per frame — then
// patch it from the reveal beats on the stream: DOOR_REVEALED carries the
// doorways this answer withheld and the boundaries that replace the mask;
// REGION_REVEALED carries a hidden room's whole slice (the load-once,
// beat-refreshed shape).
//
// The builder's PutDungeon answers with this same message as the AUTHOR'S
// view — an all-knowing member's, since an author already knows
// everything they drew.
message GetAtlasResponse {
  // rooms = 1 held a repeated AtlasRoom — the per-room decomposition — until
  // session v0.10.0 flattened the Atlas into one map. `doorways` below keeps
  // tag 2: same name, same type, genuinely unchanged by the reshape.
  reserved 1;
  reserved "rooms";

  // The coordinate family the whole map speaks. One value, not one per room.
  GridKind grid = 3;
  // How to lay the cells out to draw them. Set exactly when `grid` is
  // GRID_KIND_HEX and UNSPECIFIED otherwise — the composition's own law (a hex
  // field must declare an orientation, a square field must not) mirrored at
  // the wire. Not a default: a square map that said pointy-top would be a
  // client believing something that cannot be true about its grid. See
  // HexLayout for why this is a separate word from the authoring orientation.
  HexLayout layout = 8;
  // occluders = 5 held a repeated Position — the subset of `cells` that blocked
  // line of sight, as bare coordinates — until session/v0.18.0 replaced it with
  // `props` below (rpg-toolkit#1130). A NEW TAG rather than a retype of 5, on
  // purpose: reusing a tag while changing its type is the one proto break that
  // is SILENT, and an old client decoding AtlasProp bytes as Position would not
  // fail, it would draw furniture in the wrong places.
  reserved 5;
  reserved "occluders";

  // Every cell of the map, sorted by coordinate. Cells occupied by props are
  // included: a prop's blocking is a property of the prop, not of whether the
  // floor exists under it.
  //
  // Sorted by coordinate rather than concatenated room by room, so the
  // flattening does not leak the old grouping back through iteration order — a
  // map that still came out room-by-room would be the old shape wearing a new
  // type.
  repeated Position cells = 4;
  // Everything standing on the map, each naming what it is and answering both
  // blocking questions for itself. See AtlasProp for why this replaced a bare
  // list of occluded coordinates; a host that wants that list back filters on
  // blocks_line_of_sight.
  repeated AtlasProp props = 7;
  // Every wall and barrier on the map, sorted by endpoint.
  //
  // WALLS ARE DECLARED, NOT IMPLIED BY ROOMS. On one canvas two chambers side
  // by side are ONE OPEN SPACE until somebody draws the seam between them, so
  // this list — not the room structure a world was authored from — is the whole
  // answer to what a member cannot walk through or see past. Anything that
  // authors a world for this service owes it these (rpg-toolkit#1130).
  repeated AtlasBoundary boundaries = 6;
  // Every crossable cell pair, sorted by connection ID. Route planning needs
  // this as well as `cells` — see AtlasDoorway on why adjacency is not
  // permission.
  repeated AtlasDoorway doorways = 2;
  // Every named area of the map, each listing its own cells in the same
  // absolute frame as `cells`. EVERY FLOOR CELL APPEARS IN EXACTLY ONE
  // REGION — no cell unowned, no cell shared — so a client asking "which
  // region is this cell in" always has one answer. Regions are construction
  // truth like the rest of the atlas: fetched once with it, cached with it,
  // unchanged by anything that happens in the session. Lighting rides here
  // because it is a world fact, not a render hint: a client that cannot read
  // "this hall is dark" off the wire re-derives it by experiment. See
  // AtlasRegion for why regions are not rooms, and the law on archetype.
  repeated AtlasRegion regions = 9;
}

// =============================================================================
// Doors
// =============================================================================

// GetDoorsRequest asks for every door's live state, as one member knows it.
message GetDoorsRequest {
  string session = 1;
  // The viewer. Bound to the authenticated caller by the host — the same
  // law GetAtlasRequest.member states, for the same reason, added by the
  // same change (rpg-api-protos#266).
  string member = 2;
}

// GetDoorsResponse carries one DoorInfo per door THIS MEMBER KNOWS.
//
// THE LIVE HALF OF THE ATLAS'S DOORWAYS: GetAtlas says where a door's edges
// are; this says what each door is doing now. A concealed door the member
// has not found is ABSENT from this list — the door-list half of the
// absence law, whose geometry half masks the door as a wall (see
// GetAtlasResponse; rpg-toolkit#1020's shelf coming due for doors, and it
// reaches no further than concealed structure — every never-concealed
// door is here for everyone, full data until v1.0). Fetch once, then
// update from DOOR events on the stream and
// ADD from DOOR_REVEALED beats, which carry exactly the DoorInfo this
// answer omitted — the same load-once, beat-refreshed shape GetRoster set
// (rpg-project#264).
message GetDoorsResponse {
  repeated DoorInfo doors = 1;
}

// OpenDoorRequest pushes a shut door open.
//
// THE PROBE LAW (ruled on rpg-project#350): everywhere a door id is
// spoken, a concealed door the caller has not found answers NOT_FOUND,
// byte-identical to a door that does not exist — never the DC-naming
// FAILED_PRECONDITION below, which would confirm existence to a guessed
// id. Unlock keeps the same law.
message OpenDoorRequest {
  string session = 1;
  // Who pushes it — the DOOR beat's actor. The caller must be seated as, or
  // hosting, this member (the same acting-as gate every verb has).
  string member = 2;
  string door = 3;
}

// OpenDoorResponse reports the door as it now stands.
//
// A locked door refuses with FAILED_PRECONDITION naming the DC — that refusal
// is a fiction beat, not a defect (rpg-toolkit#1135). Opening a door refreshes
// sight and can start a fight; both arrive where they always arrive — on the
// stream — not in this response.
message OpenDoorResponse {
  DoorInfo door = 1;
}

// UnlockRequest tries a lock: the member's hands, the member's ability
// modifier, the lock's authored approaches. The caller names no approach —
// the resolver applies the character's best listed one (see CheckApproach;
// approach choice is postponed by ruling, rpg-project#350).
//
// A concealed door the caller has not found answers NOT_FOUND, identical
// to a door that does not exist — the probe law, stated on
// OpenDoorRequest.
message UnlockRequest {
  string session = 1;
  string member = 2;
  string door = 3;
}

// UnlockResponse is the attempt, in the open. The roll is public — full data
// until v1.0 — and the beat every member hears carries the same numbers.
message UnlockResponse {
  // Whether the check beat the DC. The session rolled it; the toolkit
  // composition was told this verdict and nothing else — the total below is
  // wire data for players, not something the composition ever learned.
  bool beaten = 1;
  // What the check totalled.
  int32 total = 2;
  // What it had to reach — the DC of the one approach the resolver applied,
  // not of the whole lock, which prices each route separately.
  int32 dc = 3;
  // The door as it now stands: OPEN when beaten — a beaten lock opens the
  // door, it does not merely unlock it — unchanged and retryable when not.
  DoorInfo door = 4;
}

// SearchRequest declares a search of a room — the player's verb for finding
// what a place hides.
//
// THE TARGET IS A REGION, NEVER A DOOR: a player cannot target structure
// they do not know exists, so the verb names a place to sweep and the world
// decides what that place holds (rpg-project#350). Universally attemptable
// — no prerequisites, no class gate. In v1 the named region must be the one
// the searcher stands in — presence is the host's truth, and any other
// region is refused FAILED_PRECONDITION.
message SearchRequest {
  string session = 1;
  // Who searches. Bound to the authenticated caller by the host, the same
  // law Afford and GetWhere keep.
  string member = 2;
  // The AtlasRegion id to sweep — where the searcher stands, in v1.
  string region = 3;
}

// SearchResponse acknowledges that the search happened, and deliberately
// nothing more.
//
// THE ANSWER NEVER LEAKS THE QUESTION. An empty room and a failed check
// answer with these same bytes — a response that said anything about
// outcome would tell a failed searcher whether there had been something to
// find, which is the one thing a failed search must not learn. So there is
// no found list, no roll, no count, and no seq: nothing here varies with
// what the room holds. A find reaches the searcher the way all world
// change reaches anybody — as a beat (design rule 2): DOOR_REVEALED on
// their own stream, audience = the searcher alone.
//
// saved and delivery are S6's law, kept by every mutating verb at this
// seam: a successful search writes a fact and publishes a beat, either can
// half-fail, and a partial save is an error carrying a populated report,
// never a silent shrug (ActivateResponse's shape, for the same reasons).
message SearchResponse {
  SaveReport saved = 1;
  DeliveryReport delivery = 2;
}

// =============================================================================
// Stream
// =============================================================================

// StreamEventsRequest subscribes to the events addressed to one member.
//
// `member` is the RECIPIENT IDENTITY, and the server delivers only events whose
// Event.recipient is that member — verbatim, as the toolkit projected them.
// rpg-api neither filters nor re-derives visibility (design rule 4): events
// arrive from the SDK already projected per audience, so the wire only ever
// carries what the recipient may see. A host that filtered would be
// reimplementing perception, and its first mistake would leak fog of war.
//
// Unlike StreamLobby, the subscriber is a request field rather than purely the
// authenticated identity: one authenticated player controls one member today,
// but the recipient of a projection is an encounter member, and the two are not
// the same vocabulary. Servers MUST still verify the caller is entitled to that
// member's stream.
//
// No snapshot-then-deltas here, deliberately — this stream has no replay
// obligation. A subscriber that needs to catch up reads GetStory, and one that
// needs the static map reads GetAtlas.
message StreamEventsRequest {
  string session = 1;
  string member = 2;
}

// =============================================================================
// Service
// =============================================================================

service SessionService {
  // Join brings a player into the encounter and reports what came into view as
  // a result. Creation is the lobby's — there is no StartSession here.
  rpc Join(JoinRequest) returns (JoinResponse);

  // Exit removes a member, returning what they knew on the way out. The last
  // member leaving auto-closes the encounter (ExitResponse.closed).
  rpc Exit(ExitRequest) returns (ExitResponse);

  // Move walks a member along a path, one cell at a time, crossing doorways as
  // ordinary steps. A short walk is an answer, not an error. On the turn clock
  // only the active member walks, and the whole path is paid for in movement
  // before the first step (rpg-toolkit#1169).
  rpc Move(MoveRequest) returns (MoveResponse);

  // Attack swings one member's weapon at another. Character attackers only in
  // v1. Refused FAILED_PRECONDITION when it is not the attacker's turn, the
  // target is out of reach, or the action is spent — each of which Afford
  // announces first.
  rpc Attack(AttackRequest) returns (AttackResponse);

  // OpenDoor pushes a shut door open, as `member`. A locked door refuses with
  // FAILED_PRECONDITION naming the DC (rpg-toolkit#1135: fiction, not defect).
  rpc OpenDoor(OpenDoorRequest) returns (OpenDoorResponse);

  // Unlock tries a lock as `member`: the server rolls the check against the
  // authored DC and reports the attempt; a beaten lock leaves the door OPEN.
  // Failure changes nothing and is retryable.
  rpc Unlock(UnlockRequest) returns (UnlockResponse);

  // Search declares a search of the region `member` stands in. The response
  // acknowledges the attempt and never says what, if anything, was there —
  // an empty room and a failed check answer identically. A find arrives as
  // a DOOR_REVEALED beat on the searcher's own stream.
  rpc Search(SearchRequest) returns (SearchResponse);

  // Turn reports what one member is waiting on. Asked of a member, never of the
  // session.
  rpc Turn(TurnRequest) returns (TurnResponse);

  // Afford reports what one member can still declare this turn — can-or-cannot
  // per gated verb, with the shape it would spend and the words a refusal
  // would use. Not Get-prefixed: it mirrors session.Afford the way Turn
  // mirrors session.Turn, a per-member read named for its question. The
  // caller's own budget, bound to the authenticated member as GetWhere is
  // (toolkit#1138, ADR-0042).
  rpc Afford(AffordRequest) returns (AffordResponse);

  // Activate uses a combat ability or feature the member already carries. The
  // selector says which one; there are seven at level 1 and only Help takes a
  // target.
  rpc Activate(ActivateRequest) returns (ActivateResponse);

  // EndTurn ends a member's turn and hands the fight to whoever is next.
  rpc EndTurn(EndTurnRequest) returns (EndTurnResponse);

  // Dissolve ends the fight a member is in, by decision. Defeat is not a caller
  // verb and never will be.
  rpc Dissolve(DissolveRequest) returns (DissolveResponse);

  // End closes the encounter through a declared external ending.
  rpc End(EndRequest) returns (EndResponse);

  // GetStatus reports whether the encounter is open, and how it ended if not.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);

  // GetStory reads the beats a member has witnessed — the resync source of
  // truth when the stream drops a beat or a client reconnects.
  rpc GetStory(GetStoryRequest) returns (GetStoryResponse);

  // GetView reports what one member currently perceives.
  rpc GetView(GetViewRequest) returns (GetViewResponse);

  // GetWhere reports the cell one member stands on — the caller's own
  // position, answerable cold. Deliberately singular; a roster read would leak
  // the cells of members the client has never perceived.
  rpc GetWhere(GetWhereRequest) returns (GetWhereResponse);

  // GetAtlas returns the static world map as `member` knows it — concealed
  // structure the member has not had revealed is absent or masked.
  // Construction truth otherwise; cache per encounter, patch from
  // DOOR_REVEALED and REGION_REVEALED beats.
  rpc GetAtlas(GetAtlasRequest) returns (GetAtlasResponse);

  // GetRoster reports the public half of every member — identity (name, kind,
  // the body's refs), never position and never the sheet. Stable per session:
  // fetch once, re-pull on a joined event, reference at render.
  rpc GetRoster(GetRosterRequest) returns (GetRosterResponse);

  // GetDoors reports the live state of every door `member` knows — the
  // dynamic half of GetAtlas's doorways. Fetch once, update from DOOR
  // events, add from DOOR_REVEALED beats.
  rpc GetDoors(GetDoorsRequest) returns (GetDoorsResponse);

  // StreamEvents delivers the events addressed to one member. Everything a
  // client must render that is not the caller's own action arrives here —
  // monsters acting, the clock advancing, another member crossing a doorway —
  // single-player included (design rule 2). Best-effort: a recipient that
  // notices a gap in Event.seq re-queries GetStory (rule 6).
  rpc StreamEvents(StreamEventsRequest) returns (stream Event);
}
