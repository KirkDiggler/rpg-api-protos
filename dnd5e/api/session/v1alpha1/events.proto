syntax = "proto3";

package dnd5e.api.session.v1alpha1;

import "dnd5e/api/session/v1alpha1/types.proto";

option go_package = "github.com/KirkDiggler/rpg-api-protos/gen/go/dnd5e/api/session/v1alpha1;sessionpb";
option java_multiple_files = true;
option java_package = "com.kirkdiggler.rpg.api.dnd5e.session.v1alpha1";

// Read from session/v0.18.0; typed event bodies from the combat-turn contract
// (rpg-project#249) and the current explicit Death Save contract from
// session/v0.54.1.

// EventKind names what an event reports. Mirrors session.EventKind.
//
// A proto enum, because the SDK says so in as many words: it models EventKind as
// a string enum rather than free-form prose precisely because "it maps directly
// onto a proto enum", and it is the field clients branch on.
//
// Read from session/v0.18.0, WITH THE FIRST RETIREMENT: the vocabulary held
// UNCHANGED across v0.9.0 -> v0.13.0 (the one-map reshape and the Where read
// added no beat and removed none), then v0.18.0 both dropped TRAVERSED and
// added DOWNED — see each below for why. The set has grown since (DOOR,
// rpg-project#269; DOOR_REVEALED and REGION_REVEALED, rpg-api-protos#266;
// STANCE_CHANGED and ARRIVED, rpg-project#375) and will again, so a client
// pinned to an older set must be re-read rather than counted.
//
// Removing a kind is the compatible half of that pair only because nothing can
// produce it: TRAVERSED's number and name are RESERVED here, so no future beat
// can silently inherit either. A client still holding the old generated enum
// keeps a symbol nothing will ever send, which is a dead branch, not a
// misreading. That is the strongest guarantee available for a removal, and it
// is why the removal is safe to make while the deliberate ambiguity of REUSING
// the tag would not be.
//
// The vocabulary is OPEN TO GROWTH, which is a property of proto3 enums rather
// than something this file has to build: an unrecognised number is PRESERVED on
// the wire and readable by the receiver (`EventKind(37)` in Go, the raw number
// in @bufbuild/es), never dropped and never a parse failure. So a kind the
// combat train adds (rpg-toolkit#959) reaches an old client intact, and that
// client's `seq` accounting keeps working — which is the whole point of the
// SDK's delivered-not-dropped rule. Adding a kind is compatible; changing what
// an existing one means is not.
//
// A parallel `string kind_raw` was considered and rejected: it has no SDK
// counterpart, and design rule 1 makes inventing one a design change rather than
// a transcription. The enum already carries what a passthrough string would.
//
// UNSPECIFIED and UNKNOWN are different things, and the split follows the
// house precedent set by HexState in the v1alpha2 encounter package:
//   - UNSPECIFIED (0) means the producer failed to set a kind. A defect.
//   - UNKNOWN mirrors the SDK's own session.EventUnknown — a beat THIS VERSION
//     of the toolkit does not recognise, delivered on purpose rather than
//     dropped so the recipient still learns its sequence advanced. Dropping it
//     would manufacture a gap and trigger a resync that was never needed.
enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;

  // A member stepped to a new cell.
  EVENT_KIND_MOVED = 1;
  // 2 was EVENT_KIND_TRAVERSED: a member's step carried them through a doorway.
  //
  // IT OUTLIVED THE VERB, THEN THE BEAT OUTLIVED IT. There has been no Traverse
  // RPC since session/v0.12.0, and this kind stayed distinct from MOVED through
  // that reshape on the SDK's own argument — ONE MAP DOES NOT MEAN ONE
  // NARRATION. session/v0.18.0 retired it anyway, for the reason that argument
  // could not answer: the composition stopped EMITTING the beat. A crossing is
  // written like any other step now (rpg-toolkit#1048, #1059), which was the
  // point of absolute coordinates, so nothing upstream can tell the two apart.
  // A kind nothing can produce is worse than no kind at all — it reads as a
  // contract.
  //
  // The information is not lost, only moved. GetAtlasResponse.doorways lists
  // every crossable pair, so a step whose from/to matches one IS a traversal,
  // and a client that draws a doorway differently from a corridor derives it
  // there. Restoring the distinction means deriving it, not waiting for a beat
  // that is not coming.
  reserved 2;
  reserved "EVENT_KIND_TRAVERSED";
  // A member entered the encounter.
  EVENT_KIND_JOINED = 3;
  // A member left the encounter.
  EVENT_KIND_EXITED = 4;
  // The encounter closed.
  EVENT_KIND_ENDED = 5;
  // The encounter's opening beat.
  EVENT_KIND_SCENE_OPENED = 6;
  // The clock advanced.
  EVENT_KIND_TICK = 7;
  // A member's turn in a fight ended and the order moved on.
  EVENT_KIND_TURN_ENDED = 8;
  // Two sides came into contact and a fight began, with its initiative order.
  // Every member of the encounter hears it, not only the ones in the fight: a
  // fight is localized (the rest of the party keeps free-roaming) but it is not
  // secret, and a client that learned of it only from the fighters' own
  // responses could not render the party's shared view of the scene.
  EVENT_KIND_FIGHT_STARTED = 9;
  // A fight dissolved and its members returned to free roam.
  EVENT_KIND_FIGHT_ENDED = 10;
  // An attack landed. The payload carries the numbers behind it — the roll,
  // what it totalled, what it had to reach, and how much was done.
  EVENT_KIND_STRUCK = 11;
  // An attack did not land. Two kinds rather than one with a hit flag, because
  // a client branches on them: a landed blow and a whiffed one are different
  // animations, different sounds, and different things to say. A miss omits the
  // damage key rather than reporting zero — "missed for 0" reads as a hit that
  // did nothing.
  EVENT_KIND_MISSED = 12;
  // A member is DOWNED: at zero hit points, with Attack and Move blocked. The
  // member remains in initiative and End Turn remains governed only by the
  // clock/turn gate. The opposite state is UP.
  //
  // DOWNED rather than "down" because a bare "down" also reads as PRONE, and
  // prone is a different thing entirely — a posture condition the rulebook
  // tracks, still in the fight and still acting. A client narrating the two the
  // same way would say somebody died every time they were knocked flat (Kirk's
  // ruling, rpg-toolkit#1084).
  //
  // Kind and who, and nothing else: hit points are NOT on this beat. What a
  // client renders is somebody down; how much damage produced it is a separate
  // question with its own answer (ruled fork (d) on rpg-toolkit#959).
  //
  // Nobody announces it — the world NOTICES it. There is no downing verb and no
  // way to push this beat in: the composition asks the rulebook who is standing
  // at every sight refresh (rpg-toolkit#1077), so it arrives on whatever verb
  // happened to refresh sight, frequently NOT the verb that dealt the damage.
  //
  // There is deliberately no separate kind for coming back up. A natural-20
  // Death Save carries RECOVERED in EVENT_KIND_DEATH_SAVE_ROLLED, so that typed
  // result already names the transition without a second event vocabulary.
  //
  // Read this one alongside STRUCK and MISSED — same family, same audience, and
  // a client reads all three side by side while narrating one exchange.
  EVENT_KIND_DOWNED = 13;
  // A door changed — opened, closed, or an unlock attempt, beaten or not. A
  // failed attempt is as much fiction as a beaten one, and the composition
  // writes both through one path. Every member WHO KNOWS THE DOOR hears it:
  // for a door that was never concealed that is every member (full data
  // until v1.0), and for a concealed one it is exactly the members it has
  // been revealed to — scoped as far as concealed structure requires and no
  // further. A member's first knowledge of a door is never this kind; it is
  // DOOR_REVEALED, below.
  EVENT_KIND_DOOR = 14;
  // A door entered THIS RECIPIENT'S knowledge — by their own search, by an
  // open in their presence, or by perceiving the opened door as present
  // state on arriving later. THE CAUSES ARE EXAMPLES OF KNOWLEDGE
  // ARRIVING, NOT A CLOSED SET (ruled on rpg-project#350); the full
  // trigger set is owned where perception lives, with the sight-seam
  // design round. Recipient-scoped by design: a concealed, unknown door is
  // absent from a non-knower's door-lists and — between two visible
  // spaces — masked as an ordinary wall in their geometry (see
  // GetAtlasResponse), so the beat that introduces
  // it carries everything the client needs to patch its cached view — the
  // load-once, beat-refreshed law (rpg-project#264). This is
  // rpg-toolkit#1020's shelf coming due for doors, per the standing ruling
  // that detection beats are per-player from birth.
  //
  // DEPRECATED: superseded by ConcealmentRevealed (rpg-project#490). A door is
  // not a thing that hides on its own — it is a member of a concealment, and
  // the concealment is the one knowledge moment. Still delivered until nothing
  // emits it; a client reads CONCEALMENT_REVEALED instead.
  EVENT_KIND_DOOR_REVEALED = 15 [deprecated = true];
  // A concealed region entered THIS RECIPIENT'S knowledge: they perceived
  // its concealed door OPEN — present at the opening, or walking up later
  // (present state; the same exemplary-causes law as DOOR_REVEALED).
  // NEVER on merely finding the door — two knowledge moments, deliberately
  // distinct (ruled on rpg-project#351): knowing where a door is is not
  // seeing what is behind it, so DOOR_REVEALED carries the door alone and
  // this beat carries the room. Recipient-scoped like DOOR_REVEALED, for
  // the same reasons, patching the same cached atlas.
  //
  // DEPRECATED: superseded by ConcealmentRevealed (rpg-project#490). The split
  // this kind exists to keep — knowing where a door is is not seeing what is
  // behind it — was a split between two flags; one concealment holds its cells
  // and its doors together and reveals them together. Still delivered until
  // nothing emits it; a client reads CONCEALMENT_REVEALED instead.
  EVENT_KIND_REGION_REVEALED = 16 [deprecated = true];
  // A member successfully used an authored ability. This precedes every
  // ACTIVATION_RESULT produced by that activation. From rpg-toolkit#1433,
  // Session v0.48.0, via rpg-api-protos#275.
  EVENT_KIND_ACTIVATED = 17;
  // One ordered rulebook effect produced by a successful activation. From
  // rpg-toolkit#1433, Session v0.48.0, via rpg-api-protos#275.
  EVENT_KIND_ACTIVATION_RESULT = 18;
  // One explicit authoritative Death Save result. Visible to the whole party:
  // the physical d20 and progress pips are table-visible by ruling. Mirrors
  // session.EventDeathSave from Session v0.54.1.
  EVENT_KIND_DEATH_SAVE_ROLLED = 19;
  // A member looted a downed body. EVERY downed member is lootable and the
  // affordance never says which body carries anything — the answer must not
  // leak the question, the law Search already keeps (design
  // rpg-project#368 §4.2, P3). So this beat names the looter and the body
  // and NOTHING OF WHAT MOVED: a body that carried intel and a body that
  // carried nothing produce the same bytes here. What the looter GAINED
  // reaches the looter alone, on their own stream, as the kind that already
  // carries it — DOOR_REVEALED for intel, exactly the beat a search
  // produces. Audience: everyone present.
  EVENT_KIND_LOOTED = 20;
  // A member picked up a holdable prop. The prop leaves the atlas for
  // EVERYONE — physical state folds on the truth grain — and the holder
  // carries it (design §4.3, §5). A client patches its cached GetAtlas by
  // dropping the prop, the way DOOR_REVEALED patches it by adding one.
  //
  // WAS EVENT_KIND_TAKEN, renamed by design R10 (2026-09-04) along with the
  // verb: this beat records a run-scoped HOLDING, and `take` is reserved for
  // the merchant lane's act of landing a thing in a character's inventory.
  // The number does not move — it is the same beat under its right name.
  EVENT_KIND_HELD = 21;
  // A carrier let go of a holding and it landed on the map: a member leaving
  // from anywhere but the scenario's bound exit drops what they carry where
  // they stood (design R9, §6). The prop reappears as a holdable prop at
  // that cell, so a client patches its cached GetAtlas by adding it back.
  // Never a player verb — there is no Drop RPC; this is a consequence of
  // departure, and the beat is how everyone learns of it.
  EVENT_KIND_DROPPED = 22;
  // The stance between two factions changed: a disposition's `until`
  // predicate held — the faction's mind came to know the fact the author
  // named — and the fight between those two factions dissolves (design
  // rpg-project#375, ideas/living-world/hold-out §3.4–3.5, §5). Audience:
  // everyone in the run. A stance is truth-grain, like a door standing
  // open; what is per-member is the KNOWLEDGE that led to it, and that
  // never rides this beat.
  EVENT_KIND_STANCE_CHANGED = 23;
  // A reserved placement entered the run: its `arrives` predicate held, and
  // on the first verb after that the placement was put on the map (design
  // §3.7, R6). Before this beat the placement had no cell, no turn and no
  // row anywhere — absent from roster and atlas for every member, the way a
  // concealed door is absent — so this is the first any client hears of it.
  // Audience: everyone in the run, the same law as HELD and DROPPED —
  // physical state folds on the truth grain.
  EVENT_KIND_ARRIVED = 24;
  // A reaction window opened and the fight is frozen on its answer: a monster
  // stepped out of a player's reach part-way through its turn, the seam
  // paused that turn and posed the reaction to that player (design
  // rpg-project#316, the interrupt design). The step's own MOVED does not
  // follow until the window is answered — the mover has not moved yet.
  // Audience: everyone in the run, pre-v1 full data. The body names whose
  // answer the fight is waiting on, so every client shows a pause rather than
  // a stall.
  EVENT_KIND_WINDOW_OPENED = 25;
  // A reaction window opened after a d20 was rolled and before its outcome
  // was read, and the fight is frozen on its answer: the roller holds
  // something spendable on that very roll — a Bardic Inspiration die — so the
  // machine stopped between the die and the hit (design rpg-project#316, the
  // post-roll window design). The STRUCK or MISSED beat does not follow until
  // the window is answered — the swing has not landed yet.
  // Audience: everyone in the run, pre-v1 full data. The body names whose
  // answer the fight is waiting on, so every client shows a pause rather than
  // a stall.
  EVENT_KIND_ROLL_WINDOW_OPENED = 26;
  // A creature made a saving throw, and the table saw the number: the roll,
  // the DC it was measured against, and the outcome the rulebook read from
  // the two (design rpg-project#405, R7). A save is the whole beat — what it
  // then delivers, or spares the saver, arrives as the beats that already
  // carry effects.
  //
  // ITS OWN KIND BECAUSE NO EXISTING BODY CARRIES AN ORDINARY SAVE HONESTLY.
  // DEATH_SAVE_ROLLED is death-shaped — stabilized, dead, hp_restored, a
  // continuation — and every one of those zero values would LIE on a
  // Wisdom save against a cantrip. Audience: everyone in the run, pre-v1
  // full data.
  EVENT_KIND_SAVED = 27;
  // A member cast a spell (design rpg-project#405, R1). The beat names the
  // caster, the spell and the target — and NOTHING OF WHAT FOLLOWED.
  // What a cast forced reaches the table as SAVED, and what it delivered as
  // ACTIVATION_RESULT: the damage arm, the condition arms, and the move arm a
  // spell that shoves somebody lands on.
  // A cast that delivers nothing still produces this beat, because the table
  // watched somebody cast. Audience: everyone in the run.
  EVENT_KIND_CAST = 28;
  // A caster's concentration ended, and everything the spell was holding on
  // the board ended with it (design rpg-project#407, R10). The body names the
  // caster, the spell that was being concentrated on, and why it ended.
  //
  // ITS OWN KIND RATHER THAN INFERRED FROM THE REMOVALS. Three of the six
  // reasons produce no saving throw at all, so there is no beat to read the
  // break off; and the effects that end land on OTHER members' sheets, where
  // a bare condition-removed reads as a random drop. Audience: everyone in
  // the run, pre-v1 full data.
  EVENT_KIND_CONCENTRATION_ENDED = 29;

  // THIS RECIPIENT's own perception changed: members who came into their
  // view, and members who left it. Recipient-scoped to exactly one member,
  // like DOOR_REVEALED and REGION_REVEALED — what somebody can see is news
  // for them, and a roster-wide audience would publish the sight graph to
  // the table.
  //
  // A NUDGE, NOT A PATCH, and the one place this differs from the two
  // reveals. Sighted carries NAMES AND NO TESTIMONY: what the recipient now
  // perceives about those members — cell, standing, what is in their hands —
  // is already answered, member-scoped, by GetView. A body restating it
  // would be a second computation of that same answer, which is how a patch
  // and a projection learn to disagree. A client re-reads its view.
  //
  // A TRANSITION, NEVER A STATE. It is published only when perception
  // actually changed, so no event means nothing changed: an observer who
  // keeps watching the same people hears nothing at all. It is NOT a
  // periodic "here is what you can see".
  EVENT_KIND_SIGHTED = 30;

  // A cast missed one named target. Carries the provider's supplied outcome,
  // without an attack roll or a reason inferred from the target's location.
  EVENT_KIND_CAST_MISSED = 31;

  // A member threatened a creature, and the table saw the die (design
  // rpg-project#454). PUBLISHED BEATEN OR NOT: a missed threat is as much
  // fiction as a beaten one, and the composition writes both through one path
  // — DOOR's own law, for the same reason.
  //
  // Audience: every member whose sight reaches the actor's cell, which is
  // exactly the set a beaten threat lands its deed on. Scoped to who could
  // have witnessed it and no further; a threat nobody can see is not news.
  //
  // WHAT THE THREATENED CREATURE DOES ABOUT IT IS NOT THIS BEAT. That is its
  // next turn, narrated from the beats that turn produces, and it differs by
  // the mind behind the creature — the same threat sends one monster running
  // and brings another one at you.
  EVENT_KIND_INTIMIDATED = 32;

  // A member talked a creature round, and the table saw the die (design
  // rpg-project#458). INTIMIDATED's twin, and published BEATEN OR NOT for the
  // same reason: a missed attempt is as much fiction as a beaten one, and one
  // composition path writes both.
  //
  // Audience: every member whose sight reaches the actor's cell, which is
  // exactly the set a beaten attempt lands its deed on.
  //
  // WHAT THE PERSUADED CREATURE DOES ABOUT IT IS NOT THIS BEAT. The world's
  // answer is rolled off the author's answer table and arrives as ANSWERED;
  // the creature's own mind has the turn after that.
  EVENT_KIND_PERSUADED = 33;

  // THE CREATURE'S AUTHORED ANSWER TO A CHECK, ROLLED BY THE WORLD (design
  // rpg-project#458, "The two rolls"). THE SECOND ROLL OF THE PAIR: the
  // player's check published INTIMIDATED or PERSUADED, and this says which of
  // the author's weighted entries the world then rolled, what the creature
  // did, and what it said.
  //
  // NOT THE React VERB, WHICH IS THE D&D REACTION. VERB_REACT and ReactRequest
  // are the rules' reaction — a window offered off your own turn, answered by
  // a player, with the fight frozen on the answer. This is answered by nobody
  // and freezes nothing. The design doc calls the author's list a "reaction
  // table"; this seam deliberately says ANSWER instead, because Reaction is a
  // rules term already spent on VERB_REACT and a beat named one letter from it
  // would be read as an opportunity attack by every client switching on the
  // body arm.
  //
  // R1 (Kirk, 2026-09-17): the die is on the beat and in the debug log; the
  // story shows the outcome and the creature's line. Full data down the log
  // until v1, which is what every beat here does.
  EVENT_KIND_ANSWERED = 34;

  // A CREATURE'S TEMPERAMENT WAS DEALT FROM ITS FACTION'S MIX AT SPAWN
  // (design rpg-project#465 §3, R5). A temperament is a weight profile and
  // nothing else — a map from table word to multiplier, applied to every
  // weighted pick the creature makes — so four goblins given one table and
  // one faction mix answer it four different ways. This beat is how the table
  // learns which goblin came out the coward.
  //
  // ONLY A DEALT ONE RAISES IT. A placement that names `temper:` outright was
  // not dealt: nothing was rolled, there is nothing to watch, and no beat is
  // published. Absence here therefore means "not dealt", never "no
  // temperament" — the creature's word is on Answered.temper on every pick it
  // makes, which is where a reader that only wants to know the word looks.
  //
  // Placement-scoped like ARRIVED, and audienced the same way: everyone in the
  // run. What a creature is made of is not anybody's private knowledge, and
  // the deal happens at spawn, before any member could have perceived it.
  EVENT_KIND_TEMPERED = 35;

  // An attack a Sanctuary-style ward stopped before any roll against the
  // target — the ATTACKER's own failed save against the warding caster's
  // DC, not a fact about the target. No attack roll happened at all.
  EVENT_KIND_WARDED = 36;

  // A cast a Sanctuary-style ward stopped before it reached one named
  // recipient — the CASTER's own failed save against the warding caster's
  // DC, EVENT_KIND_WARDED's Cast sibling. A different target in the same
  // multi-target cast is unaffected and gets its own ordinary beat.
  EVENT_KIND_CAST_WARDED = 37;

  // A CREATURE'S ROUTED WALK WENT NOWHERE: it was sent somewhere and did not
  // move (design rpg-project#465, from Kirk's walk). The ordered cell was
  // unreachable, or the creature was already standing where it was sent, so
  // the route came back with no path and the turn ended where it began.
  //
  // A FACT ABOUT THE WORLD, NOT A MALFUNCTION, which is why it is a beat and
  // not an error: a creature with a wall at its back has obeyed its orders,
  // and the turn is over.
  //
  // IT EXISTS BECAUSE THE SILENCE COST A ROUND. The world spends a round per
  // driven creature whether or not anybody moves, and a walk that moved
  // nobody used to produce nothing at all — so the log could not tell a
  // creature that was never asked from one that refused from one sent
  // somewhere it could not reach. A spent round that moved nobody has to be
  // visible, and this is it.
  //
  // Placement-scoped like ARRIVED, and audienced the same way: everyone in
  // the run. A creature standing still is not anybody's private knowledge,
  // and the party's own reading of the world clock depends on knowing that a
  // round went by with nothing in it.
  EVENT_KIND_STAYED = 38;

  // A CONCEALMENT ENTERED THIS RECIPIENT'S KNOWLEDGE (design rpg-project#490).
  // One authored secret — its floor, its props, its doors, its walls — arrives
  // as ONE beat, superseding DOOR_REVEALED and REGION_REVEALED above, which
  // split one hidden thing into two kinds because the engine hid doors and
  // regions with two separate flags. A concealment is the single noun an author
  // hides, so knowledge of it arrives once.
  //
  // Recipient-scoped by design, for the reasons the two superseded kinds give:
  // an unknown concealment is absent from this recipient's door lists and
  // atlas, and its member doors are masked as ordinary wall in their geometry
  // (see GetAtlasResponse), so the beat that introduces it carries everything
  // the client needs to patch its cached view — the load-once, beat-refreshed
  // law (rpg-project#264), under the standing ruling that detection beats are
  // per-player from birth.
  //
  // THE CAUSES ARE EXAMPLES OF KNOWLEDGE ARRIVING, NOT A CLOSED SET (the same
  // law DOOR_REVEALED carries): a search that found it, crossing into its
  // cells, perceiving one of its member doors standing open, perceiving a
  // creature standing on its cells, or looted or held intel that names it. The
  // full trigger set is owned where perception lives.
  EVENT_KIND_CONCEALMENT_REVEALED = 39;

  // A beat the producing toolkit version does not recognise. See the enum
  // comment: deliberately delivered, and NOT the same as UNSPECIFIED.
  EVENT_KIND_UNKNOWN = 100;
}

// Event is one thing that happened, addressed to one recipient. Mirrors
// session.Event field-for-field (design rule 3), which the SDK shaped flat and
// non-polymorphic for exactly this mapping: no interface-valued fields, no type
// switches on the wire, and no payload shape that varies by kind in a way a
// generated client cannot express.
//
// PER-RECIPIENT, NOT PER-OCCURRENCE. The same underlying beat becomes several
// Events, one per viewer who may know about it, and their payloads may differ.
// Projection is a rule decided where perception lives — inside the toolkit.
// rpg-api neither filters nor re-derives visibility (design rule 4); a host that
// filtered a single shared payload would be reimplementing perception, and its
// first mistake would leak fog of war.
message Event {
  // The session this event belongs to.
  string session = 1;
  // THIS RECIPIENT'S OWN NUMBER for the beat — per recipient, not per beat.
  // Each member's stream is densely numbered for that member alone (1, 2, 3
  // over the beats THEY were delivered), monotonic within that stream and
  // never renumbered. Two members receiving the same beat therefore carry
  // DIFFERENT numbers here, and neither number names anything in the other's
  // stream: comparing seqs across recipients is meaningless, and the only
  // question this field answers is "did MY next number arrive". The dense
  // numbering is what makes that question honest — a member never observes a
  // hole, however much of the shared story retention has trimmed underneath
  // (ruled on rpg-project#351, built in rpg-toolkit#1377).
  //
  // So a gap means one thing only: this recipient missed an event, and
  // re-queries GetStory from its last known value (design rule 6 — delivery is
  // best-effort, the story log is truth, and the stream carries no replay
  // obligation).
  //
  // NEVER FORWARD A SEQUENCE FROM ANOTHER NUMBERING SPACE INTO THIS FIELD.
  // The engine keeps its own whole-truth numbering over the shared record, and
  // a host-driven result can carry one — the SDK's Spawn output is the case
  // that exists, and its Seq is the record's, not any member's. Those are
  // different spaces. Copied here, such a number lands in the client's stream
  // as a gap or a repeat, and the client resyncs against a hole that was never
  // there.
  uint64 seq = 2;
  // The clock reading when the underlying beat was recorded. The world's clock,
  // not a wall time — hence uint64 rather than google.protobuf.Timestamp, which
  // is what the neighbouring v1alpha2 encounter stream uses for its own
  // (differently defined) timestamp.
  uint64 at = 3;
  // Groups cause and effect across events. Empty is legal.
  string correlation = 4;
  // The member this projection is addressed to. StreamEvents only ever delivers
  // events whose recipient is the subscribing member (see StreamEventsRequest),
  // so this is an assertion the client can check rather than a filter it applies.
  string recipient = 5;
  // What happened.
  EventKind kind = 6;
  // The kind-specific body, encoded by the toolkit. PASSTHROUGH: rpg-api
  // round-trips these bytes and never builds or inspects them.
  //
  // REMAINS FOR KINDS NOT YET TYPED. For every kind that has a member of
  // `body` below, the body is the beat and this is at most the same facts in
  // the toolkit's own encoding. A CLIENT READS `body` AND NEVER DECODES
  // `payload` — not as a fallback, not for a field it wishes were typed. A
  // fact a client needs that only `payload` carries is a missing body field
  // and goes through the design, the way Seen did for Sighting (ADR-0041).
  bytes payload = 7;

  // The beat, typed. Lands with rpg-toolkit#941 — beats record a declared
  // kind and a typed body, and the session seam projects them, replacing the
  // "TEMPORARY SHAPE" where session's kindOf unmarshalled the JSON payload to
  // learn what it was carrying. Done properly rather than bridged (Kirk,
  // rpg-project#249 §6): nothing here is a stopgap to be thrown away later.
  //
  // ONE-TO-ONE WITH `kind` where a body exists: a TURN_ENDED event carries
  // turn_ended, and so on down the list. A kind with no body member here
  // (SCENE_OPENED, TICK, UNKNOWN) leaves this unset and is read from `kind`
  // alone — those beats are not narrated from facts a client needs typed,
  // yet. Adding one is one additive oneof member — which is how JOINED and
  // EXITED got theirs (rpg-project#260), and how ENDED and DOOR got theirs
  // (rpg-project#269).
  //
  // Tags start at 10 to leave room beside the spine; 8 and 9 are unassigned.
  oneof body {
    TurnEnded turn_ended = 10;
    Downed downed = 11;
    Struck struck = 12;
    Missed missed = 13;
    FightStarted fight_started = 14;
    FightEnded fight_ended = 15;
    Moved moved = 16;
    Joined joined = 17;
    Exited exited = 18;
    Ended ended = 19;
    DoorChanged door = 20;
    DoorRevealed door_revealed = 21;
    RegionRevealed region_revealed = 22;
    Activated activated = 23;
    ActivationResult activation_result = 24;
    DeathSaveRolled death_save_rolled = 25;
    Looted looted = 26;
    Held held = 27;
    Dropped dropped = 28;
    StanceChanged stance_changed = 29;
    Arrived arrived = 30;
    WindowOpened window_opened = 31;
    RollWindowOpened roll_window_opened = 32;
    Saved saved = 33;
    Cast cast = 34;
    ConcentrationEnded concentration_ended = 35;
    Sighted sighted = 36;
    CastMissed cast_missed = 37;
    Intimidated intimidated = 38;
    Persuaded persuaded = 39;
    Answered answered = 40;
    Tempered tempered = 41;
    Warded warded = 42;
    CastWarded cast_warded = 43;
    Stayed stayed = 44;
    ConcealmentRevealed concealment_revealed = 45;
  }
}

// =============================================================================
// Typed bodies — one per kind a client narrates from
// =============================================================================
//
// Every id below is a member id, the same vocabulary Participant.member and
// Sighting.subject speak; a client that needs a name joins against
// TurnResponse.participants or Sighting.name. Bodies carry FACTS, not prose:
// "You hit skeleton-1 — 17 vs AC 13, 6 slashing" is rendered by the client
// from Struck, and the server never writes a sentence.

// TurnEnded: a member's turn ended and the order moved on (EVENT_KIND_TURN_ENDED).
//
// This is also "X's turn" as a moment: one of these per driven member, so the
// monster's turn is a visible beat ("skeleton-1's turn", then whatever its
// driver did) rather than a gap between two of the player's. Pacing is the
// client's (rpg-dnd5e-web#561).
message TurnEnded {
  // Whose turn ended.
  string member = 1;
  // Whose turn it is now — the same answer EndTurnResponse.next gives the
  // member who ended it, here for everyone else.
  string next = 2;
}

// Downed: a member is at zero hit points with Attack and Move blocked, while
// End Turn remains governed only by clock/turn (EVENT_KIND_DOWNED). Who, and
// nothing else — see the kind's own doc for why hit points are not here.
message Downed {
  string member = 1;
}

// DeathSaveRolled is the whole-party typed body for one explicit authoritative
// Death Save (EVENT_KIND_DEATH_SAVE_ROLLED). It exposes the same provider result
// as DeathSaveResponse, excluding persistence/delivery and the recipient-local
// response sequence. Every recipient receives its own Event.seq but the same
// authoritative roll, outcome, continuation, progress facts, and opaque
// presentation_id.
message DeathSaveRolled {
  string actor = 1;
  // The one authoritative d20 result retained across presentation retries.
  int32 roll = 2;
  // Provider-classified outcome; never derived from roll by a client.
  DeathSaveOutcome outcome = 3;
  int32 successes_added = 4;
  int32 failures_added = 5;
  int32 successes = 6;
  int32 failures = 7;
  // Provider-derived remaining count; clients do not apply a threshold.
  int32 successes_needed = 8;
  // Provider-derived remaining count; clients do not apply a threshold.
  int32 failures_remaining = 9;
  bool stabilized = 10;
  bool dead = 11;
  bool recovered = 12;
  int32 hp_restored = 13;
  // END_TURN follows settlement, KEEP_TURN refreshes and retains the actor,
  // and ALREADY_ADVANCED refreshes without another mutation.
  DeathSaveContinuation continuation = 14;
  // The same opaque provider-generated token returned by DeathSaveResponse. It
  // contains no Story/global sequence and is never parsed. An off-table retry
  // presents this same authoritative result with this same token and a new
  // attempt; it never repeats the game mutation.
  //
  // The presentation service receives numeric authority_seq separately from
  // the actor's recipient-local response seq and every witness's local
  // Event.seq; none of those values is parsed from presentation_id.
  string presentation_id = 15;
  // The authoritative sourced calculation behind this Death Save. It is the
  // same settled calculation returned to the actor and is never rerolled or
  // recomputed by a receiver.
  RollCalculation calculation = 16;
}

// -----------------------------------------------------------------------------
// Roll trace primitives — the dice and sourced additive modifiers any roll
// domain carries. From Session v0.51.0 (rpg-toolkit#1479), via
// rpg-api-protos#283.
// -----------------------------------------------------------------------------
//
// These five messages describe dice and sourced additive modifiers the way the
// producing rulebook asserts them, and nothing else: damage type, critical
// state, multipliers, AC, DC, requested/applied amounts and HP stay on the
// domain bodies that carry them. A receiver maps these fields through to
// presentation and performs NO arithmetic — every subtotal and total below is
// asserted by the producer, not derived here, and a ref is never parsed, mapped
// to a rule, or turned into a label by anything downstream.

// RollSource names one provider-authored source of a roll, a reroll, or a
// modifier. Ref is the canonical catalog identity when the source has one
// ("dnd5e:features:second_wind"); name is the provider's display name for it
// ("Second Wind"); label is the provider's term for this specific contribution
// when it is narrower than the whole source ("Fighter level" for the
// class-level modifier on a Second Wind heal). Receivers print these; they do
// not interpret them.
message RollSource {
  // Canonical ref when the source has catalog identity; empty otherwise.
  string ref = 1;
  // Provider-authored display name.
  string name = 2;
  // Provider-authored term for this contribution, when more specific than
  // name.
  string label = 3;
  // The responsible character or entity when this contribution has entity
  // provenance. This is not a player, dice-set, or presentation-style key.
  string source_id = 4;
}

// DiceReroll is one reroll applied to one die of a DiceTrace, in the order it
// happened.
message DiceReroll {
  // The stable index of the rerolled die — the same index space
  // DiceTrace.original_rolls and final_rolls number.
  int32 die_index = 1;
  // The face the die showed before this reroll — the value current at
  // die_index at this point in the ordered history.
  int32 before = 2;
  // The face the die shows from this reroll on.
  int32 after = 3;
  // Who ordered the reroll (e.g. Great Weapon Fighting).
  RollSource source = 4;
}

// KeepRule names the rule that decided DiceTrace.kept_indices.
enum KeepRule {
  KEEP_RULE_UNSPECIFIED = 0;
  KEEP_RULE_ADVANTAGE = 1;
  KEEP_RULE_DISADVANTAGE = 2;
  // Granted and imposed sources met; the pool was rolled straight and the
  // record says why. kept_indices is empty.
  KEEP_RULE_CANCELLED = 3;
}

// DiceKeep records the rule that decided kept_indices and who brought it.
// Absent when nothing touched the pool: a straight roll keeps every face.
// The sibling of rerolls: rerolls explain final_rolls, keep explains
// kept_indices.
message DiceKeep {
  KeepRule rule = 1;
  // Sources that granted advantage. Each carries the granting entity in
  // source_id (Help names the helper).
  repeated RollSource granted = 2;
  // Sources that imposed disadvantage (Untrained names the roller).
  repeated RollSource imposed = 3;
}

// DiceTrace is one homogeneous physical dice group AS ACTUALLY ROLLED — the
// physical faces AND the notation of that physical pool, not a rule's printed
// pool: a critical whose printed domain dice are 2d6 records 4d6 here, the
// printed 2d6 remaining a separate domain fact beside the trace, and an
// advantaged d20 carries two physical faces, the one kept, and the keep
// record naming the rule that kept it.
//
// The face fields are one ordered story over the same stable die indices:
// original_rolls is what each index first showed; rerolls rewrite individual
// indices in application order; final_rolls is what every index shows once all
// rerolls have applied; kept_indices selects which final faces count.
message DiceTrace {
  // The physical dice expression this group ACTUALLY rolled — the notation of
  // the physical pool, doubled pool included: "4d6" when a critical doubled a
  // printed 2d6, never the printed "2d6" alongside the doubled faces. The
  // domain's printed expression stays a separate domain fact.
  string notation = 1;
  // The size of every die in the group.
  int32 die_size = 2;
  // What each die first showed, in index order, before any reroll —
  // including faces later rerolled away.
  repeated int32 original_rolls = 3;
  // Every reroll applied to the group, IN THE ORDER APPLIED. Each entry's
  // before is the value current at its die_index at that moment, and its
  // after is the value from then on. Empty when nothing rerolled.
  repeated DiceReroll rerolls = 4;
  // What each die shows after all rerolls, in the same index order and
  // cardinality as original_rolls.
  repeated int32 final_rolls = 5;
  // Which final faces participate — indices into original_rolls/final_rolls,
  // after advantage, disadvantage, or another keep/drop rule. Empty means
  // every final face is kept.
  repeated int32 kept_indices = 6;
  // The authoritative sum of the kept final faces, as the producing rulebook
  // asserts it. Receivers must not recompute it from the faces.
  int32 subtotal = 7;
  // The rule that decided kept_indices, and who granted or imposed it. Absent
  // when nothing touched the pool — a straight roll keeps every face and has
  // no rule to name. Present with KEEP_RULE_CANCELLED on a single-die pool
  // whose granted and imposed sources met: the faces look straight and this
  // record is the only account of why.
  DiceKeep keep = 8;
}

// RollComponent is one sourced input to a domain's roll calculation: who
// contributed (source), the physical dice they rolled (dice), and the flat
// additive modifier they added (modifier).
message RollComponent {
  // Who contributed.
  RollSource source = 1;
  // The physical dice this component rolled. Absent on a modifier-only
  // component.
  DiceTrace dice = 2;
  // The flat additive modifier this component contributed, signed — including
  // zero when a zero modifier actually participated.
  //
  // PRESENCE IS THE FACT. Unset (nil in Go, undefined in TS) means this
  // component carried no additive modifier at all; present with the value 0
  // means a modifier participated and its amount was zero. These are
  // different facts and the wire preserves the difference.
  optional int32 modifier = 3;
  // Whether this component's dice subtotal is subtracted from the calculation.
  // This applies only to dice; modifier remains a signed additive value.
  bool subtract_dice = 4;
}

// RollCalculation is one domain's ordered roll inputs and the total the
// producing rulebook asserts for them.
message RollCalculation {
  // The ordered sourced components, in producer order. A multiplier such as
  // resistance or immunity is NOT one of these — multipliers remain damage
  // facts beside the calculation, never additive modifiers within it.
  repeated RollComponent components = 1;
  // The authoritative total of every component's dice and additive modifiers,
  // as the producing rulebook asserts it. Receivers must not recompute it
  // from the components.
  int32 total = 2;
}

// DamageComponent is one ordered source-attributed input to resolved damage.
//
// DAMAGE REMAINS A DOMAIN COMPOSITION: the multiplier below is not a roll-trace
// modifier — resistance's half and immunity's zero are damage arithmetic facts
// and stay here, beside the component. The component's roll facts arrive in
// exactly one of the two representations below: the deprecated scalar fields
// when converted from a pre-trace record, or `roll` — ONE sourced roll
// component, not a whole calculation — when the producing rulebook authored a
// trace. New events populate only `roll`.
message DamageComponent {
  // The CATEGORY of the damage source — a coarse kind like "weapon" or
  // "monster_trait", NOT identity. Identity lives in the roll-trace source,
  // and in the deprecated source_ref below for pre-trace records.
  string source = 1;
  // LEGACY ONLY. The pre-trace source IDENTITY ref
  // ("dnd5e:conditions:sneak_attack") — succeeded by roll.source.ref.
  // Old-record conversion populates this and never `roll`; new events never
  // set it.
  string source_ref = 2 [deprecated = true];
  // LEGACY ONLY. The pre-trace aggregate dice expression — succeeded by
  // roll.dice.notation. See source_ref.
  string dice = 3 [deprecated = true];
  // LEGACY ONLY. The pre-trace aggregate final faces, with no reroll history
  // — succeeded by roll.dice.final_rolls. See source_ref.
  repeated int32 final_rolls = 4 [deprecated = true];
  // LEGACY ONLY. The pre-trace aggregate flat bonus — succeeded by
  // roll.modifier. See source_ref.
  int32 flat_bonus = 5 [deprecated = true];
  DamageType damage_type = 6;
  // Presence distinguishes an additive component from immunity's real zero.
  optional double multiplier = 7;
  // The component's authoritative roll facts as ONE sourced roll component:
  // who contributed (source), the physical dice they rolled — original faces,
  // ordered rerolls, final faces, kept faces, asserted subtotal (dice) — and
  // their sourced additive modifier, present-zero included (modifier). The
  // dice, when present, carry the pool ACTUALLY rolled, notation included: a
  // critical whose printed domain dice are 2d6 records 4d6 and its doubled
  // faces here, the printed 2d6 staying a separate domain fact beside the
  // trace. A multiplier-only trait component carries a sourced `roll` with
  // neither dice nor modifier. Set on new events instead of the deprecated
  // scalars above; never beside them.
  RollComponent roll = 8;
}

// AttackModifierSource identifies one source of advantage or disadvantage.
message AttackModifierSource {
  string source_ref = 1;
  string source_id = 2;
}

// Struck: an attack landed (EVENT_KIND_STRUCK). The numbers AttackResponse
// gives the attacker, here for every witness, plus what was swung.
message Struck {
  string attacker = 1;
  string target = 2;
  // The d20 as rolled.
  int32 roll = 3;
  // The roll plus everything the attack chain added.
  int32 total = 4;
  // The number the total had to reach.
  int32 against = 5;
  // What was dealt. Never zero on a Struck; a miss is a Missed.
  int32 damage = 6;
  // What was swung. Must equal the selected Declaration.attack and the
  // corresponding AttackResponse.attack. Lands with rpg-toolkit#866.
  AttackRef attack = 7;
  bool critical = 8;
  repeated DamageComponent damage_components = 9;
  // DEPRECATED. Superseded by calculation.components[0].dice.keep, which
  // carries the same sources on the trace of the dice they decided, so the two
  // cannot disagree (rpg-project#463). Never filled from session v0.94 on.
  repeated AttackModifierSource advantage_sources = 10 [deprecated = true];
  // DEPRECATED. Superseded by calculation.components[0].dice.keep
  // (rpg-project#463). Never filled from session v0.94 on.
  repeated AttackModifierSource disadvantage_sources = 11 [deprecated = true];
  // Set when this strike was a reaction rather than a declared action — an
  // opportunity attack lands here, during somebody else's turn. Absent on an
  // ordinary swing, which is how a witness tells the two apart.
  ReactionRef reaction = 12;
  // The same opaque provider-generated token returned to the attacker by
  // AttackResponse, here for every recipient of this beat. It contains no
  // Story/global sequence and is never parsed. Agreeing on one roll is the
  // whole job: the attacker's response and every witness's Struck carry this
  // same token, while each recipient's Event.seq is its own and correlates
  // nothing across streams.
  //
  // The presentation service receives numeric authority_seq separately from
  // the attacker's recipient-local response seq and every witness's local
  // Event.seq; none of those values is parsed from presentation_id.
  //
  // EMPTY IS LEGAL ON READ. A beat recorded before this field existed carries
  // an empty value here. A consumer reads that as "this roll has no shared
  // presentation" and narrates the strike alone; it is never an error.
  string presentation_id = 13;
  // The authoritative sourced calculation behind roll and total. It preserves
  // the ordered actual dice and modifiers selected for this attack.
  RollCalculation calculation = 14;
}

// Missed: an attack did not land (EVENT_KIND_MISSED). A separate body rather
// than Struck with damage 0, for the reason the kinds are separate — a whiff
// is a different animation, sound and sentence — and it carries no damage
// field at all so "missed for 0" cannot be said.
message Missed {
  string attacker = 1;
  string target = 2;
  int32 roll = 3;
  int32 total = 4;
  int32 against = 5;
  // What was swung. Must equal the selected Declaration.attack and the
  // corresponding AttackResponse.attack. Lands with rpg-toolkit#866.
  AttackRef attack = 6;
  // Set when this strike was a reaction rather than a declared action — see
  // Struck.reaction. A missed opportunity attack is still worth naming: the
  // reactor spent their reaction on it.
  ReactionRef reaction = 7;
  // The same opaque provider-generated token returned to the attacker by
  // AttackResponse, here for every recipient of this beat. It contains no
  // Story/global sequence and is never parsed. Agreeing on one roll is the
  // whole job: the attacker's response and every witness's Missed carry this
  // same token, while each recipient's Event.seq is its own and correlates
  // nothing across streams.
  //
  // The presentation service receives numeric authority_seq separately from
  // the attacker's recipient-local response seq and every witness's local
  // Event.seq; none of those values is parsed from presentation_id.
  //
  // EMPTY IS LEGAL ON READ. A beat recorded before this field existed carries
  // an empty value here. A consumer reads that as "this roll has no shared
  // presentation" and narrates the whiff alone; it is never an error.
  string presentation_id = 8;
  // The authoritative sourced calculation behind roll and total. It preserves
  // the ordered actual dice and modifiers selected for this attack.
  RollCalculation calculation = 9;
}

// Activated: a member successfully used an authored ability
// (EVENT_KIND_ACTIVATED). Ability is copied from the server-authored
// declaration; its name is not derived from its ref. Target is empty for an
// ability that selects nobody.
message Activated {
  string actor = 1;
  AbilityRef ability = 2;
  string target = 3;
}

// ActivationResult: one ordered rulebook effect produced by a successful
// activation (EVENT_KIND_ACTIVATION_RESULT). Exactly one result is set.
message ActivationResult {
  string actor = 1;
  oneof result {
    HealingApplied healing_applied = 2;
    ConditionApplied condition_applied = 3;
    ConditionRemoved condition_removed = 4;
    CapacityGranted capacity_granted = 5;
    DamageApplied damage_applied = 6;
    MoveImposed move_imposed = 7;
    Stabilized stabilized = 8;
  }
}

// Stabilized carries instantaneous stabilization without healing, revival or
// a roll. Mirrors session.StabilizedBody at session/v0.86.1 (rpg-toolkit#1743)
// in both live ActivationResult events and saved Story replay.
// All state and progress values are authoritative provider facts, including
// zero counters and false flags; consumers must not derive them from HP.
message Stabilized {
  string target = 1;
  string source_ref = 2;
  string source_name = 3;
  // Already-stabilized recipients are valid: before and after may both be
  // LIFE_STATE_STABILIZED.
  LifeState before = 4;
  LifeState after = 5;
  // Unchanged by stabilization. Spare the Dying leaves the target at zero HP.
  int32 hit_points = 6;
  // Post-result progress, present even when both counters are zero. Spare the
  // Dying clears successes and failures, sets stabilized, and leaves dead false.
  // Remaining counts are copied from the provider, never computed here.
  DeathSaveProgress progress = 7;
}

// HealingApplied carries authoritative post-clamp healing facts, including
// both the amount applied and the amount requested by the rulebook.
//
// The requested roll arrives in exactly one of two representations: the
// deprecated scalar fields when this beat was converted from a pre-trace
// record, or `calculation` when the producing rulebook authored the full
// sourced calculation. New events populate only `calculation`.
message HealingApplied {
  string target = 1;
  int32 amount = 2;
  // LEGACY ONLY. The pre-trace die total behind the requested healing. See
  // calculation.
  int32 roll = 3 [deprecated = true];
  // LEGACY ONLY. The pre-trace flat modifier behind the requested healing.
  // See calculation.
  int32 modifier = 4 [deprecated = true];
  string source_ref = 5;
  string source_name = 6;
  int32 hp_before = 7;
  int32 hp_after = 8;
  int32 requested = 9;
  // The authoritative calculation behind the requested healing: ordered
  // sourced components (dice traces, additive modifiers, present-zero
  // included) and the producing rulebook's asserted total, never recomputed
  // by receivers. When set, its total equals requested; amount stays the
  // post-clamp fact. Set on new events instead of the deprecated scalars
  // above; never beside them.
  RollCalculation calculation = 10;
}

// DamageApplied carries authoritative post-application damage facts as one
// rulebook effect — the mirror of HealingApplied, and the arm a spell that
// hurts somebody needs (design rpg-project#405, R7). Vicious Mockery's 1d4
// psychic is the first of them.
//
// The requested roll arrives as `calculation`: the ordered sourced components
// and the producing rulebook's asserted total, never recomputed by receivers,
// so the 1d4 FACE reaches the client rather than a bare number. `amount` is
// the post-clamp fact — what the target actually lost.
message DamageApplied {
  string target = 1;
  int32 amount = 2;
  // The damage's type, authored by the rulebook — psychic for Vicious
  // Mockery. Never derived by a client from the source ref.
  DamageType damage_type = 3;
  string source_ref = 4;
  string source_name = 5;
  int32 hp_before = 6;
  int32 hp_after = 7;
  // What the rulebook asked for, before any clamp at zero hit points. When
  // `calculation` is set, its total equals this.
  int32 requested = 8;
  // The authoritative calculation behind the requested damage. See
  // HealingApplied.calculation, whose law this keeps exactly.
  RollCalculation calculation = 9;
}

// ConditionApplied identifies a condition attached to a target.
message ConditionApplied {
  string target = 1;
  string ref = 2;
  string name = 3;
  // The character or entity responsible for this condition. Together with
  // target and ref, this qualifies the condition being described.
  string source_id = 4;
}

// ConditionRemoved identifies a condition removed from a target and the
// provider-authored reason it ended.
message ConditionRemoved {
  string target = 1;
  string ref = 2;
  string name = 3;
  string reason = 4;
  // The character or entity responsible for the exact condition removed.
  string source_id = 5;
}

// CapacityGranted carries the member and provider-authored description of
// capacity an activation banked.
message CapacityGranted {
  string member = 1;
  string description = 2;
}

// MoveImposed: a rulebook effect moved a creature who did not choose to move —
// Thunderwave's shove is the first of them (design rpg-project#432). The
// effect decided the direction and the distance; this beat says what the floor
// allowed.
//
// HOW FAR IT GOT, NOT HOW FAR IT WAS ASKED FOR, and that distinction is the
// reason both fields exist rather than one. A two-cell shove that met a pillar
// after one cell reports one cell and names the pillar: "the push was weak"
// and "the push was stopped" are different stories, and a client shown only
// the rulebook's requested number would narrate the wrong one every time
// something was in the way.
//
// THE CELLS THEMSELVES ARE NOT IN HERE. Each cell actually entered reaches the
// table as an ordinary MOVED beat, one per step, exactly as a walk's do — a
// creature shoved across the room is watched the same way as one that walked
// there, and a second account of the same steps on this body would be a rival
// one.
message MoveImposed {
  // Who was moved. Never the caster of a caster-edge shape; a cast does not
  // shove the person casting it.
  string target = 1;
  // How many cells the target actually entered. Zero is legal and honest: the
  // very first cell was refused, so nothing moved and stopped_by says what
  // refused it.
  int32 moved_cells = 2;
  // What the move stopped in front of, authored by the rulebook — a prop's
  // ref, a wall, another creature standing in the way. Empty when nothing
  // stopped it and the whole budget was spent.
  string stopped_by = 3;
}

// Cast: a member cast a spell (EVENT_KIND_CAST). The spell is copied from the
// server-authored declaration; its name is not derived from its ref. Targets
// preserve the cast request's order. The following per-target CastMissed,
// Saved and ActivationResult beats are emitted in that same target order,
// including casts with a mixture of misses and effects.
message Cast {
  string actor = 1;
  SpellRef spell = 2;

  // Deprecated: use targets.
  string target = 3 [deprecated = true];
  // Every target of this cast, in request order. Empty only for a spell whose
  // declaration permits no targets.
  repeated string targets = 4;
}

// CastMissed: a cast missed one named target (EVENT_KIND_CAST_MISSED).
// Mirrors session/v0.82.0 CastMissedBody (rpg-toolkit#1712), for live stream
// and saved story alike. Actor and target are member ids; spell is the
// provider's existing reference and display name, never inferred by a client.
// This target's miss carries no save or effect. It is not a strike Missed:
// there is no roll, AC, aimed/actual location, or inferred reason to report.
message CastMissed {
  string actor = 1;
  string target = 2;
  SpellRef spell = 3;
}

// Warded: a Sanctuary-style ward stopped an attack before any roll against
// the target (EVENT_KIND_WARDED). No roll/total/against/damage/critical
// facts about the attack itself exist here — unlike Missed, there was no
// attack roll at all. What happened instead is the ATTACKER's own failed
// save against the warding caster's DC.
//
// NO SEPARATE SAVER FIELD: the saver of a ward's own save IS the attacker —
// nobody else rolls to break through somebody else's ward — so a second
// field naming them would be one that could disagree with `attacker`.
message Warded {
  string attacker = 1;
  string target = 2;
  AttackRef attack = 3;
  // The caster whose ward blocked this attempt.
  string source = 4;
  // The attacker's own failed save: which ability, what was rolled, what it
  // came to, and what it had to beat — the warding caster's DC.
  string ability = 5;
  int32 roll = 6;
  int32 total = 7;
  int32 dc = 8;
  // The authoritative sourced calculation behind that save.
  RollCalculation calculation = 9;
}

// CastWarded: a Sanctuary-style ward stopped a cast from reaching one named
// recipient (EVENT_KIND_CAST_WARDED). Warded's Cast sibling — the CASTER's
// own failed save, not a fact about the target. A different target in the
// same multi-target cast is unaffected and gets its own ordinary beat.
message CastWarded {
  string actor = 1;
  string target = 2;
  SpellRef spell = 3;
  // The caster whose ward blocked this attempt.
  string source = 4;
  // The caster's own failed save: which ability, what was rolled, what it
  // came to, and what it had to beat — the warding caster's DC.
  string ability = 5;
  int32 roll = 6;
  int32 total = 7;
  int32 dc = 8;
  // The authoritative sourced calculation behind that save.
  RollCalculation calculation = 9;
}

// Saved: one creature's saving throw, whole (EVENT_KIND_SAVED). The facts a
// player must see to believe the outcome — what was rolled, what it came to,
// what it had to beat, and what the rulebook read from that.
message Saved {
  // Who rolled. A member id, the same vocabulary every other body speaks.
  string saver = 1;
  // Which ability the save was made with, in the rulebook's own vocabulary —
  // "wis", "dex". Opaque to a client, which renders a display name from its
  // own table and never branches on it for a rule.
  string ability = 2;
  // The one authoritative d20 face.
  int32 roll = 3;
  // The roll plus the saver's own modifiers, as the rulebook asserts it.
  // Never recomputed by a receiver from `roll`.
  int32 total = 4;
  // The DC the total was measured against.
  int32 dc = 5;
  // The rulebook's own reading of total against dc. Provider-classified, the
  // law DeathSaveRolled.outcome keeps: a client NEVER compares the two
  // numbers itself, because the day a rule changes what beating a DC means,
  // every client that derived it would be wrong at once.
  bool succeeded = 6;
  // What forced the save, when a spell did. Unset when something else did —
  // a trap, a monster trait — and a client narrates the save alone.
  SpellRef source = 7;
  // The authoritative sourced calculation behind roll and total. It preserves
  // the ordered actual dice and modifiers selected for this save.
  RollCalculation calculation = 8;
}

// ConcentrationEnded: a caster stopped concentrating, and the effects the
// spell was holding ended with it (EVENT_KIND_CONCENTRATION_ENDED). The beat
// names the break; what it took off the board arrives as the condition
// removals the encounter's result set already carries.
message ConcentrationEnded {
  // Whose concentration ended. A member id, the same vocabulary every other
  // body speaks.
  string caster = 1;
  // The spell that was being concentrated on, copied from the server-authored
  // declaration the way Cast.spell is. Its name is not derived from its ref.
  SpellRef spell = 2;
  // Why it ended, in the rulebook's own vocabulary — "damage", "recast",
  // "duration", "combat_end", "spell_ended", "caster_down". An OPEN STRING,
  // following Saved.ability rather than FightEnded.cause: these are a
  // rulebook vocabulary, not a wire contract, and a client renders the
  // sentence the server authored rather than branching on it for a rule.
  string reason = 3;
}

// Sighted is EVENT_KIND_SIGHTED's body: who entered this recipient's view,
// and who left it.
//
// EITHER LIST MAY BE EMPTY AND NEVER BOTH. The server omits the half that
// did not happen and publishes nothing at all when neither did, so a
// delivered Sighted always names at least one member. A client may read an
// empty `gained` as "nobody arrived" without wondering whether the question
// was asked.
//
// GAINED MERGES FIRST CONTACT WITH RE-ACQUISITION on purpose. Somebody the
// recipient has never seen and somebody whose ghost just became real again
// are ONE FACT to a client — a peer is in view who was not — and the answer
// to both is the same re-read of GetView.
//
// LOST IS NOT A REMOVAL. A member who leaves your view stays on your map as
// a GHOST: what you last saw, at the moment you last saw it, hands and all.
// A client that deletes them on this beat is discarding testimony the server
// still holds and still serves. What changes is that the sighting is no
// longer current, which GetView already says.
message Sighted {
  // Members who came into this recipient's view. Member ids.
  repeated string gained = 1;
  // Members who left it, and who the recipient now holds only as a ghost.
  repeated string lost = 2;
  // Members STILL in this recipient's view whose appearance changed under
  // them — a weapon drawn or put away, and in time anything else an observer
  // can see. Not a transition: the recipient could see them before and can
  // see them now, so they are in neither list above.
  //
  // WHY IT IS THE SAME EVENT AND NOT ITS OWN. All three lists answer one
  // question — "what do I perceive now that I did not a moment ago?" — and a
  // client's answer to all three is identical: re-read GetView. Splitting
  // them would give a client two ways to learn the same thing and two places
  // to get it wrong.
  //
  // WHAT IT IS NOT is a list of what changed. The server does not say a
  // weapon was drawn, because saying so would tell this recipient a FACT
  // rather than that their own view is stale — and the fact is exactly what
  // an illusion has to be able to lie about. The recipient re-reads their
  // own view and sees whatever they are entitled to see, which may not be
  // what actually happened.
  repeated string changed = 3;
}

// FightStarted: two sides came into contact and a fight began
// (EVENT_KIND_FIGHT_STARTED). Delivered to every member of the encounter, in
// or out of the fight — see the kind.
message FightStarted {
  // The fight's members in initiative order, first to act first — the same
  // list Formed.order hands the member whose verb started it.
  repeated string members = 1;
}

// FightEnded: a fight dissolved and its members returned to free roam
// (EVENT_KIND_FIGHT_ENDED). `cause` says why, in the same enum
// DissolveResponse.cause speaks: BY_DECISION when somebody disengaged,
// BY_DEFEAT when a side ran out of standing members. TurnResponse.clock flips
// to WORLD on the same beat.
message FightEnded {
  DissolveKind cause = 1;
}

// Moved: a member stepped to a new cell (EVENT_KIND_MOVED). Dungeon-absolute,
// like every position on this seam. One body per step — a walk of four cells
// is four of these, each numbered in its own recipient's stream (Event.seq is
// per recipient: the walker and a witness both count all four steps, with
// different numbers).
message Moved {
  string member = 1;
  Position to = 2;
}

// Joined: a member entered the encounter (EVENT_KIND_JOINED). Who, and nothing
// else. This kind was read from `kind` alone until rpg-project#260: without a
// body a witness learns an arrival happened but not whose, and the feed showed
// exactly that — kind and no subject (rpg-dnd5e-web#786).
message Joined {
  // Who entered.
  string member = 1;
}

// Exited: a member left the encounter (EVENT_KIND_EXITED). The mirror of
// Joined, for the mirror reason: a departure without a name is not narratable.
message Exited {
  // Who left.
  string member = 1;
  // The PROP placement ids the member carried OUT — what they were holding
  // at the moment of departure (design §5). Empty is the ordinary case and
  // the honest one: most departures carry nothing.
  //
  // SINGULAR ON PURPOSE, though the field is repeated. It is the PARTICIPLE
  // in the statement this beat makes — "Aldric exited, holding the heirloom"
  // — which is the naming rule this whole slice runs on: a verb and a beat
  // are named by what the record will say. The seam already carries repeated
  // fields named this way where the word is not a count noun —
  // ExitResponse.carry, the nearest neighbour there is, and `sealed` on the
  // atlas — so this is the local convention rather than a missing `s`.
  //
  // PROPS ONLY. Intel is a holding too — an author gives a monster the
  // knowledge of a door and the same one mechanism moves it — and it NEVER
  // appears here or anywhere else on this wire (design P3). A departure that
  // carried nothing but knowledge is indistinguishable from one that carried
  // nothing at all, which is the point.
  //
  // Ids, not refs: a holding is one named placement from the dungeon file
  // (`place[].id`), the same id AtlasProp.id and Held.prop speak. A held
  // prop is ABSENT from the atlas, so a client cannot join this id against
  // GetAtlas to learn what it is — it names the thing from the HELD beat
  // that first told it who was carrying what.
  //
  // A departure from anywhere but a scenario's bound exit does not populate
  // this: the carrier DROPS what they hold where they stood (R9) and the
  // DROPPED beat says so, so a holding is either carried out through the
  // exit or left on the floor, never silently deleted.
  repeated string holding = 2;
  // The exit id they left through — one of the dungeon file's `exits[].id`.
  //
  // EMPTY FOR A DEPARTURE FROM ELSEWHERE, which is every departure today
  // that is not a scenario ending: the lobby's abandon, a disconnect, a
  // member walking out at a cell nobody authored as a way out. Empty is not
  // "unknown"; it is the truth that no authored exit was used, and it is
  // what tells a client this departure was not a withdrawal through the
  // front gate.
  string exit = 3;
}

// Ended: the encounter closed (EVENT_KIND_ENDED). The key of the declared
// ending that fired — "boss-down", "withdrawn", "abandoned". Keys are content
// strings, not an enum: what an ending MEANS is authored, and the client maps
// key to sentence (rpg-project#269 §6.3). The full outcome — where everybody
// stood — is GetStatus's answer. This beat arrives on the WORLD clock: the
// bubble dissolves before the encounter closes (rpg-project#269 §6.6), so
// FIGHT_ENDED precedes it.
message Ended {
  string ending = 1;
}

// DoorChanged: a door changed (EVENT_KIND_DOOR) — opened, closed, or an
// unlock attempt. Delivered only to members who know the door — see the
// kind; a member learning of the door for the first time gets DoorRevealed
// instead, on the same underlying beat.
message DoorChanged {
  string door = 1;
  DoorState state = 2;
  // Who did it. Empty when nobody did — authored state reported at open.
  string actor = 3;
  // dc, total and beaten are set only on unlock-attempt beats — the
  // composition's door beat carries them on those and nothing on a plain
  // open or close. A beat with dc = 0 is a plain open/close. On a
  // multi-approach lock, dc is the DC of the approach the resolver applied
  // (see CheckApproach) — an attempt resolves through exactly one route.
  int32 dc = 4;
  int32 total = 5;
  bool beaten = 6;
  // The authoritative sourced calculation behind total. Its first component is
  // the d20 as actually rolled, both faces under advantage or disadvantage,
  // with the keep record. Set only on unlock-attempt beats, like dc, total and
  // beaten — a plain open or close carries no calculation.
  RollCalculation calculation = 7;
}

// DoorRevealed: a door entered the recipient's knowledge
// (EVENT_KIND_DOOR_REVEALED) — by search, by presence at its opening, or
// by any later way knowledge arrives (the kind's causes are exemplary).
// The payload is BUILT for its recipient rather than shared: a non-knower
// held no honest wire trace of this door — no list entry, a wall mask in
// its geometry — so the reveal carries the door's identity, live state
// and its own geometry, and the client patches its cached GetDoors and
// GetAtlas views in place — the load-once, beat-refreshed shape
// (rpg-project#264).
//
// DELIBERATELY NARROW — one door's own edges and nothing else — unlike the
// repo-wide GeometryRevealed this repo removed in #197/#198. A wider
// reveal (a lit room, a scried map) is not this beat grown fatter; it is
// rpg-toolkit#1020's own design round.
//
// A knower who already holds the door gets DoorChanged, never a second
// reveal: DOOR_REVEALED is about knowledge, DOOR is about state.
//
// THE DOOR ALONE. What lies behind it stays hidden until RegionRevealed —
// knowing where a door is is not seeing what is behind it (two knowledge
// moments, ruled on rpg-project#351).
//
// NO SEGMENT RIDES THIS BEAT, and none needs to. A concealed door in a wall
// was already presented as that wall's WHOLE segment — the masquerade — so
// the wall drew correctly before this beat and draws correctly after. What
// changes is the GAP, and a gap is derived where the doorways below meet a
// segment the recipient already holds. RegionRevealed carries segments
// because a hidden ROOM's walls were withheld outright; a hidden DOOR's
// never were.
//
// DEPRECATED: superseded by ConcealmentRevealed (rpg-project#490). Kept, tag
// for tag, until nothing emits EVENT_KIND_DOOR_REVEALED.
message DoorRevealed {
  option deprecated = true;

  // The door's identity and live state, exactly as this recipient's
  // GetDoors would now list it.
  DoorInfo door = 1;
  // The door's own crossable cell pairs — the AtlasDoorway entries a
  // knower's GetAtlas carries for it, absent from this recipient's cached
  // atlas until now. Every edge of a wide door arrives together
  // (rpg-toolkit#1123: a door is one state over a set of edges).
  //
  // ONE ACCEPTED DISCLOSURE, named so it is never mistaken for a leak or
  // a client bug (rpg-project#351): at a region-guarding door these pairs
  // name one cell of hidden floor per entrance, before any region reveal
  // — knowing where a door is includes knowing it leads somewhere. The
  // patched-atlas state that follows, doorways into cells not yet in
  // `cells`, is legal; a client tolerates it until REGION_REVEALED
  // arrives.
  repeated AtlasDoorway doorways = 2;
  // The truth at the door's own edges. Where the mask applies — a
  // concealed door between two spaces the member can see (see
  // GetAtlasResponse) — the recipient's cached atlas holds a synthetic
  // ordinary wall boundary there, and these replace it. Empty is the
  // ordinary case and means whatever stood there simply comes off — a
  // door's edges carry no authored boundary, the doorways above are the
  // truth; at a concealed region's border there was no mask to remove at
  // all. Only the door's own edges — see the message comment on
  // narrowness.
  repeated AtlasBoundary boundaries = 3;
}

// RegionRevealed: a concealed region entered the recipient's knowledge
// (EVENT_KIND_REGION_REVEALED) — they perceived its concealed door open,
// at the opening or arriving later (causes exemplary, as DoorRevealed's
// are). Never fired on merely finding the door: the door reveal and the
// room reveal are two knowledge moments, deliberately distinct (ruled on
// rpg-project#351 — the room hides with its door, since client fog does
// not hide unexplored space and the map itself must keep the secret).
//
// The payload is the region's own atlas slice — everything this
// recipient's GetAtlas withheld under that ruling — and the client
// patches its cached atlas in place: the load-once, beat-refreshed shape
// (rpg-project#264). On the two fields below, a patched atlas and a fresh
// GetAtlas answer the same thing once this beat is applied. STILL
// DELIBERATELY NARROW: one room's own slice, not a sweep — the repo-wide
// GeometryRevealed this repo removed in #197/#198 stays dead, and a wider
// reveal (a scried map, a lit floor) is rpg-toolkit#1020's own design round.
//
// There is no doorways field, on purpose: every entrance of a concealed
// region is itself a concealed door (authoring refuses anything else),
// and doors keep their own law — DoorRevealed, the masquerade wall, the
// probe law. A door never rides a room's reveal.
//
// DEPRECATED: superseded by ConcealmentRevealed (rpg-project#490), where a
// door DOES ride its concealment's reveal — the two knowledge moments this
// message's neighbour kept apart were an artefact of two authored flags, and
// one concealment has one. Kept, tag for tag, until nothing emits
// EVENT_KIND_REGION_REVEALED.
message RegionRevealed {
  option deprecated = true;

  // The AtlasRegion entry the recipient's `regions` was missing. Its own
  // `cells` list IS the patch for the cached `cells` — same absolute
  // frame, same comparator (see AtlasRegion.cells) — so this message
  // carries no second cell list free to disagree with it.
  AtlasRegion region = 1;
  // The props standing in the region, exactly as GetAtlasResponse.props
  // would carry them.
  repeated AtlasProp props = 2;
  // Every boundary touching the region's cells — border walls included,
  // since the never-authored yardstick withheld them all (see
  // GetAtlasResponse) — exactly as GetAtlasResponse.boundaries would
  // carry them. Interior-only would leave the revealed room border-wall-
  // less in the recipient's patched atlas.
  repeated AtlasBoundary boundaries = 3;
  // The region's walls AS THE AUTHOR DREW THEM — every segment this
  // recipient's GetAtlas withheld under the same yardstick, exactly as
  // GetAtlasResponse.segments would carry them now.
  //
  // Presentation only, like its GetAtlasResponse twin: `boundaries` above
  // stays the mechanical truth and nothing here changes what a member may
  // do. Without it a client that draws from segments patches in a revealed
  // secret room with NO WALLS AT ALL — the boundaries arrive, but a client
  // that draws segments is no longer fitting a chain out of them, so it has
  // nothing to draw from. That is the one scenario a concealed region exists
  // to produce.
  //
  // A door's gap is still derived client-side where its doorway meets its
  // segment. No doorway rides this beat, on purpose (see the message
  // comment), so a segment arriving here draws unbroken until the region's
  // own concealed door reveals itself through DoorRevealed.
  repeated AtlasSegment segments = 4;
  // The revealed region's cells that NOBODY CAN STAND ON — the cells its
  // walls run through the middle of. A subset of `region.cells` above, so
  // this adds no cell the patch does not already carry and cannot disagree
  // with it about what exists.
  //
  // A SEALED CELL KEEPS ITS REGION, so membership no longer implies
  // standable — as true of a room arriving by reveal as of one fetched with
  // the atlas. A client that patches these cells in and then places anything
  // by region membership alone will stand it inside a wall.
  //
  // Same absolute frame and the same comparator as AtlasRegion.cells. Sealed
  // floor is still floor: it is drawn and it is lit, and what sight does at
  // it is the wall's business, not this list's.
  repeated Position sealed = 5;
}

// ConcealmentRevealed: one concealment entered the recipient's knowledge
// (EVENT_KIND_CONCEALMENT_REVEALED) — by their own search, by crossing into
// its cells, by perceiving one of its member doors standing open, by
// perceiving a creature standing on its cells, or by intel that names it. The
// causes are exemplary, not a closed set, as DoorRevealed's and
// RegionRevealed's are.
//
// ONE NOUN, ONE REVEAL (design rpg-project#490). The two messages above split
// one authored secret across two kinds and two payloads because the engine hid
// doors and regions with two separate flags; a concealment is the one thing an
// author hides, and its cells, props, member doors, boundaries and walls
// arrive together here. Both are deprecated and retire when nothing emits
// them.
//
// PER-RECIPIENT, NOT PER-OCCURRENCE, like every Event: one reveal becomes one
// Event per member it reached, and their payloads differ because what each
// member held beforehand differs. Projection is decided where perception
// lives, inside the toolkit; rpg-api neither filters nor re-derives it (see
// Event).
//
// THE PAYLOAD IS BUILT FOR ITS RECIPIENT rather than shared. A non-knower held
// no honest wire trace of this concealment — its cells absent from GetAtlas,
// its props absent, its member doors absent from GetDoors and masked as
// ordinary wall in its geometry (see GetAtlasResponse) — so the beat carries
// everything the client needs to patch its cached GetAtlas and GetDoors views
// in place: the load-once, beat-refreshed law (rpg-project#264). Once applied,
// a patched atlas and a fresh GetAtlas answer the same thing.
//
// STILL DELIBERATELY NARROW — one concealment's own slice, never a sweep. The
// repo-wide GeometryRevealed this repo removed in #197/#198 stays dead, and a
// wider reveal (a scried map, a lit floor) is its own design round.
//
// KNOWLEDGE, NOT STATE, and it arrives once. A member who already holds the
// concealment hears the ordinary beats of whatever happened — DoorChanged for
// a door's state, Sighted for who came into view — and never a second reveal.
message ConcealmentRevealed {
  // The author's id for the concealment — the dungeon file's
  // `concealments[].id`, which is what intel binds to with
  // `reveals: { concealment }` and what a client keys its patch on.
  string concealment = 1;
  // The concealment's own floor cells, absolute axial (q, r) — exactly the
  // cells this recipient's GetAtlasResponse.cells withheld, and the patch for
  // it. Same absolute frame and the same comparator as
  // GetAtlasResponse.cells, so a client appends and never re-bases.
  //
  // EMPTY IS LEGAL AND MEANS A CELL-LESS CONCEALMENT — a hidden crossing whose
  // members are doors alone. Nothing about the floor was hidden, so there is
  // nothing to add, and `doors` and `doorways` below are the whole patch.
  repeated Position cells = 2;
  // The props standing on those cells, exactly as GetAtlasResponse.props would
  // carry them. Withheld from a non-knower along with the floor they stand on
  // — a prop in a hidden room is as hidden as the room.
  repeated AtlasProp props = 3;
  // The concealment's member doors, each one's identity and live state,
  // exactly as this recipient's GetDoors would now list them. Absent from that
  // list until this beat.
  //
  // A DOOR RIDES ITS CONCEALMENT'S REVEAL, which is the whole difference from
  // the two messages above: RegionRevealed deliberately carried no door
  // because a concealed region's doors were separately concealed things with
  // their own beat. Membership in one concealment is one secret.
  repeated DoorInfo doors = 4;
  // Those doors' crossable cell pairs — the AtlasDoorway entries a knower's
  // GetAtlas carries for them, absent from this recipient's cached atlas until
  // now. Every edge of a wide door arrives together (rpg-toolkit#1123: a door
  // is one state over a set of edges).
  //
  // A door's gap is still derived client-side where a doorway meets a segment
  // the recipient holds, marked by nothing on the wire — see AtlasSegment.
  repeated AtlasDoorway doorways = 5;
  // The mechanical truth at the revealed edges: every boundary touching the
  // concealment's cells — border walls included, since the never-authored
  // yardstick withheld them all (see GetAtlasResponse) — plus the truth at its
  // member doors' own edges, exactly as GetAtlasResponse.boundaries would
  // carry them now.
  //
  // A REPLACEMENT WHERE THE MASQUERADE STOOD. Where the mask applies — a
  // member door between two spaces the recipient can see — their cached atlas
  // holds a synthetic ordinary wall boundary there, and these replace it. A
  // door's edges otherwise carry no authored boundary and the entry simply
  // comes off, the doorways above being the truth. Interior-only would leave
  // the revealed room border-wall-less in the recipient's patched atlas.
  repeated AtlasBoundary boundaries = 6;
  // The concealment's walls AS THE AUTHOR DREW THEM — every segment this
  // recipient's GetAtlas withheld under the same yardstick, exactly as
  // GetAtlasResponse.segments would carry them now.
  //
  // A DIFFERENCE, NOT THE WHOLE SET: walls the recipient did not have and now
  // does. A segment they already hold is not re-sent — the masquerade wall at
  // a member door was presented as that wall's WHOLE segment, so it drew
  // correctly before this beat and draws correctly after, with the door's gap
  // appearing where the doorways above meet it.
  //
  // Presentation only, like its GetAtlasResponse twin: `boundaries` above
  // stays the mechanical truth and nothing here changes what a member may do.
  // Without it a client that draws from segments patches in a revealed secret
  // room with NO WALLS AT ALL — the boundaries arrive, but a client drawing
  // segments no longer fits a chain out of them, so it has nothing to draw
  // from. That is the one scenario a concealment exists to produce.
  repeated AtlasSegment segments = 7;
  // The revealed cells that NOBODY CAN STAND ON — the cells its walls run
  // through the middle of. A subset of `cells` above, so this adds no cell the
  // patch does not already carry and cannot disagree with it about what
  // exists.
  //
  // A REPLACEMENT over those cells, not a difference: it is the complete
  // answer to which of the arriving cells are sealed, and a client applies it
  // as the sealed set for them rather than merging it into a partial one.
  //
  // A SEALED CELL KEEPS ITS REGION, so membership no longer implies standable
  // — as true of floor arriving by reveal as of floor fetched with the atlas.
  // A client that patches these cells in and then places anything by region
  // membership alone will stand it inside a wall.
  //
  // Same absolute frame and the same comparator as `cells`. Sealed floor is
  // still floor: it is drawn and it is lit, and what sight does at it is the
  // wall's business, not this list's.
  repeated Position sealed = 8;
}

// Looted: a member looted a downed body (EVENT_KIND_LOOTED). Who looted
// whom, and deliberately nothing else.
//
// THE AFFORDANCE MUST NOT SAY WHICH BODY CARRIES INTEL (design
// rpg-project#368 P3). Loot is offered on every downed member, a body with
// nothing to give transfers nothing, and this beat is identical either way:
// no transferred list, no count, no flag. That is the same law SearchResponse
// keeps for the same reason — a beat that varied with what the body held
// would tell a party which corpse was worth searching, which is the one thing
// looting a wrong body must not teach.
//
// What actually moved reaches the LOOTER ALONE as the kind that carries it:
// intel arrives as DOOR_REVEALED on the looter's own stream, audience the
// looter, byte-identical to the reveal a successful search produces (design
// P4 — loot is a second writer of the fact search writes, cause "loot", and
// zero new reveal shape). This beat's audience is everyone present.
message Looted {
  // Who looted.
  string looter = 1;
  // The downed member whose body was looted. A member id, the same
  // vocabulary Exited.member and Downed.member speak.
  string body = 2;
}

// Held: a member picked up a holdable prop (EVENT_KIND_HELD).
//
// PHYSICAL STATE FOLDS ON THE TRUTH GRAIN: an object leaving the floor is
// not a secret, so this beat goes to everyone present and every recipient's
// atlas loses the prop. A client patches its cached GetAtlas by removing the
// prop with this id — the load-once, beat-refreshed law (rpg-project#264)
// running in the subtractive direction, where DOOR_REVEALED runs it in the
// additive one. GetAtlas itself omits held props for everyone, so a refetch
// agrees with the patch.
//
// Who holds it afterwards is this beat's `holder`, and that stays true until
// they carry it out through a bound exit (Exited.holding) or drop it
// (Dropped).
//
// WAS `Taken{taker, prop}` — see EVENT_KIND_HELD for the ruling. Renamed,
// not deprecated: `Taken` is being freed for the merchant lane, so nothing
// here reserves the old name.
message Held {
  // Who picked it up.
  string holder = 1;
  // The placement id of the prop — the dungeon file's `place[].id`, the same
  // id AtlasProp.id carries.
  string prop = 2;
}

// Dropped: a holding landed back on the map (EVENT_KIND_DROPPED).
//
// NOT A PLAYER VERB. There is no Drop RPC and this slice adds none: a drop
// is what happens when a carrier leaves from anywhere but the scenario's
// bound exit (design R9). Without it a carrier who walks out through the
// lobby — or disconnects — walks off with the only win in the run.
//
// The prop reappears as a holdable prop at `at` for everyone present, so a
// client patches its cached GetAtlas by adding it back at that cell; GetAtlas
// places dropped props there too, so a refetch agrees. The journal stays
// append-only underneath — a drop is a new fact, not the erasure of the hold.
message Dropped {
  // Who dropped it — the departing carrier.
  string member = 1;
  // The placement id of the prop dropped.
  string prop = 2;
  // The cell it landed on: where the carrier stood on the way out.
  // Dungeon-absolute, like every position on this seam.
  Position at = 3;
}

// StanceChanged: the stance between two factions changed
// (EVENT_KIND_STANCE_CHANGED). Fired when a disposition's `until` predicate
// holds — the faction's mind came to know the fact the author named — and
// the pair's edge is rewritten (design rpg-project#375 §3.4; R2: to
// `neutral`, "not hostile"). A fight formed between members of these two
// factions dissolves in the same pass, so a FIGHT_ENDED with cause
// DISSOLVE_KIND_BY_STANCE follows this beat for the members who were in
// it, while members of a third faction still hostile keep their fight
// (§3.5, R1).
//
// THE STANCE IS DERIVED, NEVER STORED (§3.4): a reload folds it again from
// the journal, and this beat is how a client learns the fold changed between
// its reads. It names the pair and the word, and nothing of WHY — which
// member carried what to whom is knowledge, per-member by law, and reaches
// its holders on their own streams.
message StanceChanged {
  // The two faction ids the stance is between — the dungeon file's
  // `factions[].id`, or the reserved `party` / `monsters`. Exactly two, and
  // UNORDERED: a disposition is one per pair and has no direction (design
  // §2), so [goblins, party] and [party, goblins] name the same edge.
  // Repeated rather than two named fields for that reason — there is no
  // "first" faction to name.
  repeated string between = 1;
  // The stance the pair now holds: `hostile`, `neutral` or `allied` — the
  // dungeon file's own closed vocabulary (design §2), carried as the word
  // the author wrote rather than an enum, the way Ended.ending carries the
  // author's key: what a stance MEANS to a client (which colour, which
  // sentence) is content the rulebook declares. Neutral is the only value
  // this slice can produce (R2); the other two are here because the word
  // is the file's, and a static `allied` may one day change too.
  string stance = 2;
}

// Arrived: a reserved placement entered the run (EVENT_KIND_ARRIVED). A
// placement authored with `arrives` is spawned at launch and held in
// reserve — no cell, no turn, in no pair, absent from every projection for
// every member (design rpg-project#375 §3.7, R6) — until its predicate
// holds; on the first verb after that it is placed, and this beat says
// what, and where.
//
// NAMES THE THING, NOT ITS ROW — the same shape as Joined. A MONSTER
// arrival is a new roster member, so a client re-pulls GetRoster exactly as
// it does on JOINED; a PROP arrival is a new atlas prop, so it re-pulls
// GetAtlas. The same verb's sight refresh then reports the arrival like any
// member walking into view — a FIGHT_STARTED, or a fight joined, may follow
// on the same correlation.
message Arrived {
  // The placement id — the dungeon file's `place[].id`. For a MONSTER this
  // is also the member id the roster will list; for a PROP it is the
  // AtlasProp.id the atlas will carry.
  string id = 1;
  // Which family of placement arrived, and so which cached view to patch.
  PlacementKind kind = 2;
  // The cell it was placed on, dungeon-absolute like every position on this
  // seam — the authored `at`, or the nearest free floor cell in the same
  // region when `at` was occupied (design §3.7).
  Position cell = 3;
}

// WindowOpened: a reaction window opened and the fight is waiting on it
// (EVENT_KIND_WINDOW_OPENED). The mover is part-way through its turn and is
// leaving `from` for `to`; that departure offered `reaction` to each member in
// `audience`, and until every one of them has answered React no verb at this
// seam writes.
//
// THE STEP HAS NOT HAPPENED. `to` is announced, not taken — a client that drew
// the mover there on this beat would be showing the fight a step ahead of
// itself, and the MOVED that follows the answer would be a no-op.
//
// WHAT IT DOES NOT CARRY: the two answers. They are implied by the VERB_REACT
// declaration the audience already reads from Afford (see ReactChoice), so a
// client narrates the pause from this beat and reads the offer from Afford
// like everything else it may do.
message WindowOpened {
  // The members whose answers the fight is waiting on, each exactly once.
  // Never empty — a window with no audience is not posed. More than one when
  // several reactors are offered the same step, and the freeze lasts until
  // the last of them has answered.
  repeated string audience = 1;
  // Who is moving — the member the reaction would answer. A client rings this
  // member on the canvas.
  string mover = 2;
  // The cell the mover is leaving, dungeon-absolute like every position on
  // this seam. This is where the mover still stands.
  Position from = 3;
  // The cell the mover is stepping to once the window is answered.
  Position to = 4;
  // Which reaction is on offer — the same identity Struck and Missed carry
  // when the strike lands, so a client's icon table needs no second entry.
  ReactionRef reaction = 5;
}

// RollWindowOpened: a reaction window opened on a d20 that has already been
// rolled, and the fight is waiting on it (EVENT_KIND_ROLL_WINDOW_OPENED). The
// member in `audience` rolled `roll` for a total of `total`, and holds
// something they may spend on that roll — `offer` — so the resolution machine
// stopped after the die and before the outcome was read.
//
// THE SWING HAS NOT LANDED. No STRUCK and no MISSED has been written for this
// attack; the beat that says whether it hit follows the answer, and its total
// is this one plus whatever the answer added. A client that narrated a result
// from this beat would be showing the fight a step ahead of itself.
//
// WHAT IT DOES NOT CARRY: the target's AC. The client learns an AC only when
// the server has shown it, and a window that leaked it here would tell the
// player whether their swing lands before they choose — which is the whole
// decision. The struck beat says `against` afterwards, as it does today.
//
// WHAT IT DOES NOT CARRY EITHER: the two answers. They are implied by the
// VERB_REACT declaration the audience already reads from Afford (see
// ReactChoice), the same law WindowOpened states, so a client narrates the
// pause from this beat and reads the offer from Afford like everything else it
// may do.
message RollWindowOpened {
  // The member whose answer the fight is waiting on: the one who rolled the
  // d20. Exactly one — this window is posed to the roller and to nobody else,
  // because the roller is the only audience whose freeze is designed. Never
  // empty; a window with no audience is not posed.
  string audience = 1;
  // Which offer is on the table — the same identity Struck and Missed carry
  // when a strike was a reaction, so a client's icon table needs no second
  // entry. Its name is what the button reads: "Bardic Inspiration".
  ReactionRef offer = 2;
  // The face of the d20 as it was rolled, before anything the answer may add.
  // A natural 1 and a natural 20 are read off this number and the answer does
  // not move them.
  int32 roll = 3;
  // The total the roll stands at right now — the face plus the attacker's
  // bonuses, and nothing the pending answer would add. What the player is
  // deciding about.
  int32 total = 4;
  // The settled sourced calculation at the pause. Later resolution extends
  // this same frozen fact; receivers never reroll or recompute it.
  RollCalculation calculation = 5;
  // Same provider token as AttackResponse, the shared throw and final outcome.
  // Empty on legacy windows; never reconstruct it from recipient-local seq.
  string presentation_id = 6;
}

// Intimidated: a member threatened a creature (EVENT_KIND_INTIMIDATED). The
// facts the table needs to believe the moment — who leaned on whom, what the
// check came to, what it had to reach, and the rulebook's own reading of the
// two. Delivered on a missed threat as well as a beaten one.
//
// THE ONLY ACCOUNT OF THIS ROLL, AND THE ACTOR READS IT TOO. IntimidateResponse
// carries no beaten, total or dc: a response that repeated them would be a
// second, differently shaped copy of the same throw, and two copies of one
// truth is how a client learns to disagree with the table about what was
// rolled. Everyone sees the same die through this beat, and the person who
// threw it is not a special case (ruled by Kirk on rpg-api-protos#339).
//
// THE READING IS THE PROVIDER'S, never a client's comparison of total against
// dc — the law Saved.succeeded and DeathSaveRolled.outcome keep, for the same
// reason: the day a rule changes what beating a DC means, every client that
// derived it would be wrong at once.
//
// NOTHING ABOUT THE CONSEQUENCE. A beaten threat lands an intimidate deed on
// this beat's audience and the threatened creature's mind decides what to do
// with it; a client narrates that from the creature's next turn, not from
// here. Deliberately unlike DoorChanged, which can report the state its own
// check produced, because there is no state here to report — the outcome is a
// decision somebody else has not made yet.
//
// IT AND Persuaded MIRROR EACH OTHER ON PURPOSE. The two carry the same five
// fields, and one shared "skill check beat" with a verb field to discriminate
// on was considered and rejected: a client switching on Event.body gets a
// TYPED VERB out of the arm it matched, and against a shared body it would
// have to read a discriminator before it could write a sentence. The cost of
// mirroring is five field numbers; the cost of sharing is every consumer
// branching twice. A third social verb joins as a third body, not as a third
// value of a discriminator.
message Intimidated {
  // Who threatened. A member id, the same vocabulary every other body speaks.
  string actor = 1;
  // Who was threatened. A member id.
  string target = 2;
  // What the check had to reach — the DC of the one approach the resolver
  // applied, authored on the target's placement or derived from its passive
  // Insight. Always set: unlike DoorChanged.dc, which is zero on a plain open
  // or close, every one of these beats is a check.
  int32 dc = 3;
  // What the check totalled.
  int32 total = 4;
  // The rulebook's own reading of total against dc.
  bool beaten = 5;
  // The authoritative sourced calculation behind total. Its first component is
  // the d20 as actually rolled, both faces under advantage or disadvantage,
  // with the keep record.
  RollCalculation calculation = 6;
}

// Persuaded: a member talked a creature round (EVENT_KIND_PERSUADED).
// Intimidate's twin on the same machine — who leaned on whom, what the check
// came to, what it had to reach, and the rulebook's own reading of the two.
// Delivered on a missed attempt as well as a beaten one, to every member whose
// sight reaches the actor's cell.
//
// IT AND Intimidated MIRROR EACH OTHER ON PURPOSE — see Intimidated's own doc
// for why this is two bodies and not one "skill check beat" with a verb field
// on it.
//
// THE ONLY ACCOUNT OF THIS ROLL, AND THE ACTOR READS IT TOO. PersuadeResponse
// carries no beaten, total or dc, for the reason Kirk ruled on
// rpg-api-protos#339: a response repeating them would be a second, differently
// shaped copy of one throw, and two copies of one truth is how a client learns
// to disagree with the table about what was rolled.
//
// THE READING IS THE PROVIDER'S, never a client's comparison of total against
// dc — the law Saved.succeeded and DeathSaveRolled.outcome keep, for the same
// reason: the day a rule changes what beating a DC means, every client that
// derived it would be wrong at once.
//
// NOTHING ABOUT THE CONSEQUENCE. A beaten check lands a persuade deed on this
// beat's audience and stops. What the creature does about it is the world's
// own roll off the author's table — ANSWERED — and then that creature's mind on
// its next turn. A "helping" field here would make the outcome this verb's
// instead of the world's and the mind's, which is the first cut Intimidate's
// design broke and recorded so it is not proposed again.
message Persuaded {
  // Who talked. A member id, the same vocabulary every other body speaks.
  string actor = 1;
  // Who was talked to. A member id.
  string target = 2;
  // What the check had to reach — the DC of the one approach the resolver
  // applied, authored on the target's placement or derived from its passive
  // Insight. Always set: every one of these beats is a check.
  int32 dc = 3;
  // What the check totalled.
  int32 total = 4;
  // The rulebook's own reading of total against dc.
  bool beaten = 5;
  // The authoritative sourced calculation behind total. Its first component is
  // the d20 as actually rolled, both faces under advantage or disadvantage,
  // with the keep record.
  RollCalculation calculation = 6;
}

// AnswerWord is WHAT A CREATURE DID when the world rolled the author's answer
// table (design rpg-project#458, "The outcome vocabulary"; extended by
// rpg-project#465, "The creature's table"). One word per table entry, and an
// entry carries exactly one of them — two words in one entry is an authoring
// error the validator refuses, so this is a single value and never a set.
//
// THE ENUM GROWS A VALUE PER SLICE, never ahead of one, AND THIS SLICE BRINGS
// `time`. The table is no longer rolled only when a social verb resolves
// against a creature: it is also rolled whenever the creature HAS TIME — its
// turn in a fight, or a round of the world clock — and HOLD, ATTACK, TOWARD
// and AWAY are what a creature can do with one turn's worth of doing (design
// rpg-project#465 §2). FACT and FLEE remain event words; the four arriving
// here are time words.
//
// WHICH WORD IS LEGAL ON WHICH KEY IS THE AUTHOR'S TABLE'S PROBLEM, NOT A
// SECOND ENUM. `attack` under `intimidated` is refused where the table is
// compiled, so a word on the wrong key never reaches this wire and a client
// never has to reject one. Splitting the vocabulary in two here would make
// every consumer carry the legality rule as well.
//
// STILL DELIBERATELY NOT HERE: `alarm`, `lure`, `pretend` and `patrol`. The
// design names all four as words this vocabulary will take, and each arrives
// with the slice that can actually make a creature do it, the way a Verb value
// arrives the day the SDK gates the verb. A value no engine could produce
// would be a promise this contract cannot keep, and a client would grow a
// branch for it that never runs.
//
// `tell` IS NOT A DEFERRED WORD — IT COLLAPSED INTO FACT. The design lists it
// separately as "the party learns a fact, possibly false", but teaching a fact
// is exactly what FACT already does, and the "possibly false" half has no
// engine meaning: a fact is an ID and nothing else, so there is no truth bit
// for a second word to set differently. Whether what a creature says is a lie
// lives in the author's `say` line and in what the party finds when they walk
// into the room. Two words that produce one behaviour would have been a
// distinction every consumer had to branch on and no engine could honour.
enum AnswerWord {
  ANSWER_WORD_UNSPECIFIED = 0;
  // The witnesses learned an authored fact — the world journal's existing
  // path. A disposition's `until` predicate may then flip the pair, which
  // arrives separately as STANCE_CHANGED and is not this beat's claim.
  //
  // WHICH FACT IS NOT ON THIS BEAT. Answered.fact tried to carry it and is
  // deprecated and never filled; see that field for why a learned fact cannot
  // ride a broadcast body at all. This word says a fact was taught to whoever
  // was there, and no more.
  ANSWER_WORD_FACT = 1;
  // The creature holds `fled` from the actor, at now. NOT a flag on the
  // creature, and IT DOES NOT STEP ON THIS BEAT: the verb pays its round on
  // the world clock, and the creature's own `time` table — reading that deed
  // through `fled: {within: N}` — does the running, so the steps arrive as
  // MOVED.
  //
  // NO MIND DECIDES WHAT RUNNING LOOKS LIKE. The mind is retired
  // (rpg-project#465 §7); what a frightened creature does is its author's
  // table, loaded by its temperament, rolled when it next has time.
  ANSWER_WORD_FLEE = 2;
  // Pass — one turn's worth of doing spent standing there. Also what a TIME
  // roll with no eligible entry produces: when every entry's `when` failed,
  // the table was silent, the creature holds, and the beat says so with an
  // empty `candidates` rather than by omitting a word (design §2, "fail
  // closed loudly").
  ANSWER_WORD_HOLD = 3;
  // Strike the selected member. A TIME WORD ONLY: off the turn clock it is
  // refused, because an enemy within reach is a fight sight that has already
  // formed, and the fight's own machinery swings there.
  ANSWER_WORD_ATTACK = 4;
  // Walk toward the selected member's BELIEVED position, or toward an authored
  // cell — the turn's movement. Believed, never actual: where a creature
  // thinks somebody is comes from perception, per observer, and the table only
  // reads it.
  ANSWER_WORD_TOWARD = 5;
  // Walk away from the selected member — the turn's movement. The coward's
  // run, and what a creature holding `fled` does with the time after it.
  //
  // NOT THE COMPELLED WALKS. Command and Dissonant Whispers drive a member
  // through the engine's own Routed path and do not pass through the table at
  // all; this word is a creature choosing to go, not a creature being sent.
  ANSWER_WORD_AWAY = 6;
}

// AnswerKey is WHICH TABLE THE WORLD ROLLED ON — the author's own spelling
// under `on:` in the dungeon file, carried so the beat stands alone (design
// rpg-project#465 §2, "Triggers").
//
// TWO KINDS OF KEY, AND THE DIFFERENCE IS WHEN THE ROLL HAPPENS. The four
// social keys are EVENT keys: the verb resolved against this creature and the
// pick executes now, inside it. TIME is a TIME key: the creature has time —
// its turn in a fight, or a round of the world clock — and the pick is one
// turn's worth of doing. A client that narrates them the same way is right to;
// a client that wants to know why a creature acted reads this field.
//
// IT REPLACES `verb` PLUS `beaten`, WHICH COULD ONLY SPELL FOUR. Two fields
// multiplied to exactly the four social keys, and there is no (verb, beaten)
// pair that means "it was this creature's turn": the old shape would have had
// to answer a TIME pick with an unset verb and a false `beaten`, which reads
// as a failed something. One field naming the key can say all five, and the
// two it supersedes are deprecated rather than removed — see Answered.
//
// SEALED, AND IT GROWS ONE VALUE PER USE CASE, the law AnswerWord keeps. The
// design names no sixth trigger: there is deliberately no `attacked` key
// (what a creature does about being hit is decided when it next has time, off
// the deed it holds) and no `arrived` key (an arrival that should go somewhere
// is a TIME entry with a `when`, a standing order rather than a memory).
enum AnswerKey {
  ANSWER_KEY_UNSPECIFIED = 0;
  // The author's `intimidated` list: a threat that beat the creature's DC.
  ANSWER_KEY_INTIMIDATED = 1;
  // The author's `intimidate_failed` list: a threat that did not. Failure has
  // a table on purpose — a failed threat that raises the alarm is what makes
  // attempting worse than not attempting.
  ANSWER_KEY_INTIMIDATE_FAILED = 2;
  // The author's `persuaded` list: an attempt that beat the creature's DC.
  ANSWER_KEY_PERSUADED = 3;
  // The author's `persuade_failed` list: an attempt that did not.
  ANSWER_KEY_PERSUADE_FAILED = 4;
  // The author's `time` list: the creature had time and this is what it did
  // with it. No verb and no check stand behind a pick on this key, which is
  // why Answered.verb and Answered.beaten are never filled for it.
  ANSWER_KEY_TIME = 5;
}

// Temper is A CREATURE'S TEMPERAMENT: a weight profile and nothing else — a
// map from table word to multiplier, applied to every weighted pick the
// creature makes (design rpg-project#465 §3, R5). Four goblins handed one
// table and one faction mix answer it four different ways, and this is the
// only thing that differs between them.
//
// SEALED, AND AN ENUM FOR THE REASON AnswerWord AND AnswerKey ARE. The design
// seals the set at three words and says in as many words that there is no
// fourth, so the vocabulary is this contract's to carry and a client switches
// on it exhaustively rather than string-matching content.
//
// THE NUMBERS ARE NOT HERE AND NEVER WILL BE. Which multiplier a profile gives
// each word is CONTENT, held in the rulebook beside the default tables and
// tuned by a walk; this enum names the profile and does not describe it. What
// a profile did to a particular roll is already carried on that roll, exactly
// and per line, as AnswerCandidate.percent — which is where a reader looks for
// arithmetic, rather than joining against a copy of the table kept here.
//
// A TEMPERAMENT ADDS NOTHING AND REMEMBERS NOTHING: no entries where a table
// is silent, no triggers of its own, no memory. The moment it grew any of
// those it would be the retired mind under a new name (§7).
//
// NONE IS A VALUE, NOT THE ZERO. Having no temperament is a real answer about
// a creature, so it gets its own word and UNSPECIFIED keeps its meaning across
// this file: the producer failed to set one, a defect (see the EventKind
// comment). This is the shape Slot already uses for the same reason —
// SLOT_NONE beside SLOT_UNSPECIFIED, with the projection mapping the empty
// value to NONE explicitly rather than letting it fall through.
enum Temper {
  // THE PRODUCER FAILED TO SET ONE. A defect, never a creature with no
  // temperament — that is TEMPER_NONE. A well-formed beat never carries this.
  TEMPER_UNSPECIFIED = 0;
  // NO TEMPERAMENT: nobody named a word for this creature, and every
  // AnswerCandidate.percent on its picks is 100. What an untempered creature
  // carries on Answered.temper, and never what Tempered publishes.
  TEMPER_NONE = 1;
  // Every word weighted 1: the profile that multiplies nothing. DISTINCT FROM
  // NONE BY PROVENANCE, NOT BY ARITHMETIC — this word was named, by a
  // placement or by a faction's mix, and a reader that wants to know whether
  // anybody chose it can tell.
  TEMPER_SOLDIER = 2;
  // Runs sooner and fights later: `away` and `flee` weighted up, `attack` and
  // `toward` weighted down. The multipliers are content and a walk tunes them.
  TEMPER_COWARD = 3;
  // Fights sooner and runs later: `attack` and `toward` weighted up, `away`
  // and `flee` weighted down. The multipliers are content and a walk tunes
  // them.
  TEMPER_AGGRESSIVE = 4;
}

// AnswerCandidate is ONE LINE OF THE TABLE AS THE DIE SAW IT — what the author
// wrote, what the creature's temperament did to it, and the share it therefore
// held of the roll (design rpg-project#465 §3, §6).
//
// EVERY ENTRY WHOSE `when` HELD FOR THIS ROLL, AND ONLY THOSE. Entries whose
// `when` did not hold are ABSENT from this list, not present with a zero
// weight (design §2, and "zero values tell the truth"): an entry that was not
// on the table is a different fact from an entry that was on it and lost, and
// a reader must be able to tell a goblin with nothing to run from apart from a
// goblin that rolled badly.
//
// THE ARITHMETIC IS CARRIED, NOT THE RESULT ALONE, so a debug log can show
// authored × temper for every line and a reader can redo the sum the engine
// did. That is the full-data-down-the-log rule every beat here keeps until
// v1; a story renderer shows the word and the line and ignores all of this.
message AnswerCandidate {
  // Which entry this is, ZERO-BASED, in the order the author wrote them under
  // the key — the SAME index space as Answered.entry, so the line that fired
  // is always one of these and a builder can highlight it in the file the
  // author is looking at. The list is in the author's order, and its indices
  // are not contiguous when a `when` filtered a line out.
  int32 entry = 1;
  // What the author wrote, verbatim. A weight the author omitted is 1 here,
  // because 1 is what it means; it is never 0, because an ineligible entry is
  // absent rather than zero-weighted.
  int32 weight = 2;
  // The creature's temperament factor FOR THIS ENTRY'S WORD, IN PERCENT: 100
  // when the creature has no temperament (a soldier) or when the profile does
  // not weight this word, and otherwise the profile's multiplier — the
  // design's ½ and ¼ are 50 and 25, its 3 is 300.
  //
  // Percent rather than a float so this beat's arithmetic is exact integer
  // arithmetic a reader can repeat and get the engine's own answer.
  int32 percent = 3;
  // weight × percent: the share the die was actually rolled against, and what
  // Answered.of sums.
  //
  // IN HUNDREDTHS OF A WEIGHT, deliberately undivided. Dividing by 100 here
  // would turn a coward's half-weighted 1 into 0 and drop the line out of its
  // own table, so the scale is kept and Answered.roll and Answered.of live on
  // it too. Nothing here is a percentage: the ratios between `loaded` values
  // are the whole meaning.
  int32 loaded = 4;
}

// Answered: the creature's authored answer to a check, rolled by the world
// (EVENT_KIND_ANSWERED). The second of the two rolls the design names — the
// player's check published INTIMIDATED or PERSUADED, and this says which of
// the author's weighted entries fired, what the creature did about it, and
// what it said while doing it (design rpg-project#458, "The two rolls").
//
// NOT THE React VERB, WHICH IS THE D&D REACTION. VERB_REACT is a window a
// player answers with the fight frozen on it; this is a creature answering,
// rolled by the world, freezing nothing. See EVENT_KIND_ANSWERED for why the
// wire says ANSWER where the design doc says "reaction table".
//
// THE DIE IS ON THE BEAT (R1, Kirk 2026-09-17), AND NOW SO IS ITS ARITHMETIC
// (rpg-project#465 §6). `roll` is the world's own throw against `of`, which is
// the sum of `loaded` over `candidates` — every entry whose `when` held, each
// one's authored weight times its temperament factor. The whole loaded table
// is carried rather than the total alone, so a debug log can show authored ×
// temper line by line and a reader can redo the engine's sum. A story renderer
// shows `word` and `say` and ignores all of it. That is the
// full-data-down-the-log rule every beat here keeps until v1, not an exposure
// special to this one.
//
// TIME PICKS RIDE THIS SAME BEAT (design §6). A creature that acts because it
// HAD TIME — its turn in a fight, or a round of the world clock — rolls the
// same authored table through the same dice and publishes the same body, with
// `key` naming ANSWER_KEY_TIME. There is no second beat for what a creature
// does on its own initiative: one table, one roll, one shape, and a client
// that narrates an answer already narrates a turn.
//
// ONE ENTRY FIRES. There is no list of OUTCOMES here because the table cannot
// produce one: an entry is one word plus a line, and an author who wants two
// things to happen cannot say so yet. A later slice that pays for it adds a
// list inside an entry, not a second Answered. `candidates` is not that list —
// it is what was ELIGIBLE, of which exactly one fired.
message Answered {
  // Which creature answered. A member id.
  string creature = 1;
  // DEPRECATED — SUPERSEDED BY `key` (rpg-project#465). Which verb it is
  // answering: VERB_INTIMIDATE or VERB_PERSUADE.
  //
  // STILL FILLED ON EVERY ANSWER TO ONE OF THE FOUR SOCIAL KEYS, so a reader
  // written against the shipped shape keeps working unchanged. NEVER FILLED
  // ON A TIME ANSWER, because no verb stands behind one: the creature rolled
  // because it had time, and an unset verb there is the truth rather than a
  // hole a producer forgot to fill.
  //
  // Deprecated because this field and `beaten` together could spell exactly
  // four keys and the table now has five. A reader that switches on the pair
  // reads every time pick as an unspecified verb with a failed check, which is
  // a sentence about a threat that never happened. Read `key`.
  Verb verb = 2 [deprecated = true];
  // DEPRECATED — SUPERSEDED BY `key` (rpg-project#465), on the same terms as
  // `verb`: still filled on every answer to one of the four social keys so
  // existing readers keep working, and NEVER filled on a TIME answer, where
  // there is no check to have beaten and `false` would read as a failure that
  // never happened.
  //
  // Whether the player's check was beaten, which is WHICH TABLE the world
  // rolled on: true is the success table the author wrote under `intimidated`
  // or `persuaded`, false the failure table under `intimidate_failed` or
  // `persuade_failed`. Failure has a table on purpose — a failed threat that
  // raises the alarm is what makes attempting worse than not attempting, and
  // it is what gives the untrained rule its teeth.
  //
  // It is the same reading the INTIMIDATED or PERSUADED beat published a
  // moment earlier, and it is repeated because this beat has to stand alone: a
  // reader needs to know which table `entry` is an index INTO, and pairing two
  // beats to find out would assume an ordering the stream does not promise.
  bool beaten = 3 [deprecated = true];
  // The world's die, as rolled — a face on `of`'s scale, which since
  // rpg-project#465 is hundredths of a weight rather than the author's raw
  // weights. See `of`, and never read this as a percentage.
  int32 roll = 4;
  // What it was rolled against: THE SUM OF `loaded` OVER `candidates`, which
  // is every entry whose `when` held, each authored weight times its
  // temperament factor. Weights are relative and an author writes whatever
  // reads well — 3 and 1, or 70 and 30 — so the total is the engine's own sum
  // and is carried rather than assumed to be 100.
  //
  // THE SCALE MOVED WITH TEMPERAMENT (rpg-project#465). `loaded` is in
  // hundredths of a weight, undivided so a half-weighted 1 does not round to
  // nothing, so this sum is too: an untempered 70-and-30 table rolls against
  // 10000, and the same table under a coward against 16000. The ratios are the
  // meaning; the absolute number is not, and a renderer that showed it as a
  // percentage was reading it wrong before this slice as well.
  int32 of = 5;
  // Which entry fired, ZERO-BASED, in the order the author wrote them under
  // that key. An index into the AUTHOR'S list, so a builder can highlight the
  // line that fired in the file the author is looking at.
  //
  // Always one of `candidates`, which carries every entry eligible for this
  // roll under the same index space.
  int32 entry = 6;
  // What the creature did. One word, never a set — see AnswerWord.
  AnswerWord word = 7;
  // The author's line, VERBATIM, and empty when the author wrote none. THE
  // ENGINE NEVER COMPOSES IT: this is the one place on this seam where a
  // creature speaks, and it speaks because an author typed the sentence. Empty
  // means the creature said nothing, which is a real authoring choice and not
  // a string somebody forgot.
  string say = 8;
  // DEPRECATED, NEVER FILLED. A FACT NEVER RIDES A BROADCAST BEAT (ruled by
  // Kirk 2026-09-17, rpg-project#458). rpg-api leaves this empty on every
  // Answered it publishes, and a client must read it as absent rather than as
  // "no fact was taught".
  //
  // It shipped one PR ago as "the fact id taught", and that was the mistake:
  // a learned fact is PER-OBSERVER KNOWLEDGE. When the world's answer teaches
  // one, the members who were there learn it and the members who were not do
  // not, and the same is true of a member who arrives later or never looks.
  // This beat has ONE body delivered to an audience, so a field on it can only
  // say the same thing to everybody — which means it either tells a member
  // something they have not learned, or it says nothing and a member who DID
  // learn cannot tell that apart from a beat where no fact was taught. The
  // knowledge laws this file keeps everywhere else (Seen, Sighting,
  // Discovery — knowledge is addressed per recipient and never broadcast)
  // were simply not applied here, and this field is where that shows.
  //
  // THE ONLY LAWFUL ROAD IS A PER-VIEWER "WHAT I KNOW" PROJECTION, and it is
  // NOT BUILT. Facts a member has learned belong on a read addressed to that
  // member, the way a sighting is, where absence means "I have not learned it"
  // and presence means "I have" — two claims this field cannot make. Nothing
  // is added here to stand in for it: a second broadcast field with a
  // recipient list would be the same error with more wire, and the absence of
  // the projection is a cost not yet paid rather than a gap to paper over.
  //
  // WHAT STILL WORKS WITHOUT IT. The fact is taught by the engine exactly as
  // before, and a disposition's `until` predicate reads it exactly as before;
  // when a pair flips, that arrives as STANCE_CHANGED, which is truth-grain
  // and broadcast-safe because a stance is the run's own fold rather than
  // anybody's knowledge. Nothing about the world stopped working — only this
  // field's claim to describe it did.
  //
  // Deprecated rather than removed, and 9 is burnt: a field number is never
  // reused and a type never changes in place on this seam.
  string fact = 9 [deprecated = true];
  // WHICH KEY THE WORLD ROLLED ON — the one field that replaces `verb` plus
  // `beaten` (rpg-project#465 §2). The four social keys say the same thing the
  // deprecated pair says; ANSWER_KEY_TIME says the creature acted because it
  // had time, and for it `verb` and `beaten` are both unset.
  AnswerKey key = 10;
  // THE LOADED TABLE AS ROLLED: every entry whose `when` held, in the author's
  // order, each with its authored weight, its temperament factor and their
  // product. `of` is the sum of `loaded` across this list, and `entry` names
  // the one that fired.
  //
  // Empty is a real answer, not a missing one: a TIME roll where no entry's
  // `when` held has nothing on the table, the creature holds, and this beat
  // carries ANSWER_WORD_HOLD with no candidates and `of` zero.
  repeated AnswerCandidate candidates = 11;
  // The creature's temperament, TEMPER_NONE WHEN IT HAS NONE: every
  // candidate's `percent` on this pick is 100 (design §3).
  //
  // AN UNTEMPERED CREATURE IS TEMPER_NONE, NEVER TEMPER_SOLDIER. The two
  // multiply identically, so this costs a reader nothing arithmetically, and
  // it keeps the one thing they do not share: SOLDIER means a placement or a
  // faction's mix NAMED that word, and NONE means nobody did.
  //
  // AND NEVER UNSPECIFIED ON A WELL-FORMED BEAT. Zero is the producer's
  // failure, not a creature's answer, which is why NONE exists at all. A
  // rulebook word the projecting build cannot name is A REFUSAL, never
  // quietly demoted to NONE: demoting would publish "this creature has no
  // temperament", which is a claim about the world rather than an admission
  // about the build, and the creature's picks would read as a soldier's
  // forever after.
  //
  // Here on every pick because temperament is what loaded THIS die: a reader
  // holding one beat can say why the coward ran without joining back to the
  // TEMPERED beat that dealt it, and a creature whose temperament was authored
  // rather than dealt raised no such beat to join to.
  Temper temper = 12;
}

// Tempered: a creature's temperament was dealt from its faction's mix at spawn
// (EVENT_KIND_TEMPERED, design rpg-project#465 §3, R5). A faction that writes
// `temper: { coward: 1, soldier: 2, aggressive: 1 }` hands every placement in
// it the same orders and a different die, and this beat is how the table sees
// which goblin came out the coward.
//
// PLACEMENT-SCOPED LIKE ARRIVED, and audienced the same way — everyone in the
// run. What a creature is made of is not anybody's private knowledge, and the
// deal happens at spawn, before a member could have perceived anything.
//
// THE DIE NAMES ITS ENTITY, like every other pool on this seam: the mix is the
// faction's, so `faction` is who threw, and `member` is who the word landed
// on.
//
// A TEMPERAMENT IS A WEIGHT PROFILE AND NOTHING ELSE. It adds no entry where a
// table is silent, it has no triggers of its own, and it holds no memory; it
// multiplies the weights of the words the author already wrote. The moment it
// grew any of those it would be the retired mind under a new name (§3, and §7
// for what was retired). What it did to a particular roll is visible on that
// roll, as AnswerCandidate.percent.
message Tempered {
  // Which creature was dealt one. A member id, and the same placement id
  // Arrived names for a monster.
  string member = 1;
  // The dealt temperament. NEVER TEMPER_NONE AND NEVER UNSPECIFIED HERE: this
  // beat exists because a mix was rolled and produced a word. A creature with
  // no temperament raises no TEMPERED at all, so NONE could not arrive; and
  // UNSPECIFIED would be a producer defect, as everywhere else on this seam.
  //
  // AN AUTHORED `temper:` ON THE PLACEMENT IS NOT DEALT AND RAISES NO BEAT.
  // Nothing was rolled, so there is nothing for the table to watch; that
  // creature's word still reaches every reader on Answered.temper, on every
  // pick it makes.
  Temper temper = 2;
  // The world's die, as rolled, on the faction's mix.
  int32 roll = 3;
  // What it was rolled against: the summed weights of the mix the faction
  // wrote. Weights are relative and an author writes whatever reads well, so
  // the total is the engine's own sum and is never assumed to be 100.
  int32 of = 4;
  // THE FACTION WHOSE MIX WAS DEALT — THE DIE'S ENTITY (rpg-project#463: every
  // dice pool names the entity whose rule threw it). The mix belongs to the
  // faction, so the faction threw this die, and without it a reader holding
  // the roll cannot say which mix produced it or check the sum against
  // anything.
  //
  // Not the creature: `member` is who RECEIVED the word, and the two are
  // deliberately separate fields because the thrower and the subject of a
  // throw are different questions everywhere else on this seam too.
  string faction = 5;
}

// Stayed: a creature's routed walk moved nobody (EVENT_KIND_STAYED). It was
// sent somewhere — by its own table, or by whatever else routes a walk — and
// the route came back with no path, so the turn ended on the cell it started
// on (design rpg-project#465, from Kirk's walk).
//
// THE BEAT IS THE WHOLE ACCOUNT OF A SPENT ROUND. The world clock charges a
// round per driven creature whether or not anybody moves; before this, a walk
// that moved nobody was narrated as nothing, and a reader could not tell a
// creature nobody asked from one that refused from one sent somewhere
// unreachable. Every one of those now says so, with the cause that routed it
// and the route's own sentence about where it stopped.
//
// NO CELLS ON IT, DELIBERATELY. Nothing moved, so there is no from and no to;
// where the creature is standing is what the roster and the atlas already
// answer, and a position here would be a second copy of a fact nothing
// changed. A client narrates the round and re-reads nothing.
message Stayed {
  // Which creature stayed. A member id.
  string member = 1;
  // WHAT ROUTED IT, as the engine's own reference string —
  // `<module>:<type>:<id>`, so a creature walking under its own orders
  // (`encounter:table:...`) is distinguishable from one being shoved,
  // commanded, or routed by a spell.
  //
  // A ref rather than a free sentence because this is the same question
  // every routed walk answers, and it is required precisely so an observer is
  // never told a creature walked for no reason. This beat says it did not
  // walk; the cause is why it was trying.
  string cause = 2;
  // THE ROUTE'S OWN SENTENCE ABOUT WHY IT STOPPED, VERBATIM, for the debug
  // log — the fold's refusal phrase, such as "is blocked by
  // dnd5e:props:pillar". The engine never composes prose for a story
  // renderer, and this is not that: a story shows that the creature stayed,
  // and the debug log shows this line.
  //
  // EMPTY IS AN ANSWER, NOT A MISSING ONE. The route had nowhere strictly
  // nearer to offer, which is its own reason and not a blocker it could name
  // — a creature already standing where it was sent, or one with no cell
  // closer than the one it is on. A reader must not treat empty as "the
  // producer forgot"; it is the commonest case.
  string why = 3;
}
