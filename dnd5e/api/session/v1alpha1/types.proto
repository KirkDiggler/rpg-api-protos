syntax = "proto3";

package dnd5e.api.session.v1alpha1;

import "dnd5e/api/customization/v1alpha1/types.proto";

option go_package = "github.com/KirkDiggler/rpg-api-protos/gen/go/dnd5e/api/session/v1alpha1;sessionpb";
option java_multiple_files = true;
option java_package = "com.kirkdiggler.rpg.api.dnd5e.session.v1alpha1";

// This package transcribes the exported surface of the toolkit's
// `rulebooks/dnd5e/session` package (read from session/v0.18.0; v0.21.2 added
// Seen on Sighting/Report — ADR-0041; v0.54.0 introduced explicit Death Saves,
// with the current contract verified against v0.54.1;
// combat-turn contract, rpg-project#249;
// SDK fields land with the toolkit issues named inline). Every message here
// mirrors an SDK type field-for-field: rpg-api invents no vocabulary, and a
// field with no SDK counterpart is a design change that goes through
// rpg-project/ideas/session-api/design.md first (rule 1).
//
// THE COMBAT-TURN CONTRACT MERGED AHEAD OF ITS SDK, deliberately. Everything
// marked "lands with rpg-toolkit#<n>" below was ruled whole in
// rpg-project/ideas/combat-turn/design.md (Kirk, 2026-08-22) so the toolkit,
// rpg-api and the web client build against ONE shape in parallel instead of a
// chain of one-field PRs. None of it is invented — each field projects a rule
// the composition already holds (reach, standing, weapon identity, typed
// beats) — but until the named issue closes, "mirrors session.X" would be a
// claim about code that does not exist yet, so the comment names the issue it
// waits on instead.
//
// The SDK's own laws that shape this file:
//   - S2: no inner type crosses the boundary. What the session package exports
//     is what the wire carries; nothing here reaches past it into encounter,
//     combat, clock, intel or record types.
//   - Every string enum the SDK owns exists BECAUSE it maps onto a proto enum
//     (its words). Each one is transcribed as an enum below, not as a string.
//
// ONE MAP. Design §0's ruling — "the encounter has rooms but projects the
// absolute geo of the dungeon so the session package sees it as all one map" —
// is no longer a destination this contract is waiting on. It ARRIVED across
// session v0.10.0 (the Atlas became one map), v0.11.0 (joins, placements and
// outcomes went roomless) and v0.12.0 (a walk crosses a doorway; Traverse
// retired). Room IDs no longer cross this seam anywhere, and every position on
// it is dungeon-absolute.

// =============================================================================
// Enums
// =============================================================================

// ClockKind names which kind of time a member is living in. Mirrors
// session.ClockKind ("world" / "turn").
//
// A member is always in exactly one kind of time — that totality is what makes
// the SDK's ErrInBubble / ErrNotInFight pair meaningful. UNSPECIFIED means the
// producer failed to set it; treat it as a defect, not as a third clock.
enum ClockKind {
  CLOCK_KIND_UNSPECIFIED = 0;
  // Free roam. Everyone acts; their own movement advances the clock and there
  // is no turn order to be next in.
  CLOCK_KIND_WORLD = 1;
  // A fight. The members in it act in an order, one at a time.
  CLOCK_KIND_TURN = 2;
}

// DissolveKind names why a fight ended. Mirrors session.DissolveKind, which the
// SDK documents as the wire form of its sealed session.DissolveCause interface.
//
// Deliberately a closed set with one member. The SDK seals DissolveCause with an
// unexported method so a second cause cannot be declared outside that package —
// defeat, when the composition can see it, arrives as another CALLER of that
// shape rather than as a second way to end a fight. Adding a value here waits on
// the SDK adding one, exactly as the seal intends.
enum DissolveKind {
  DISSOLVE_KIND_UNSPECIFIED = 0;
  // A fight its members chose to walk away from. Named after the SDK constant
  // it mirrors, session.DissolveByDecision — whose own string value is
  // "decision", and which session.ByDecision() is the cause constructor for.
  DISSOLVE_KIND_BY_DECISION = 1;
  // A fight that ended because a side stopped standing: the last skeleton is
  // downed and there is nothing left to fight. Mirrors session.DissolveByDefeat
  // (string value "defeat"), whose cause constructor is session.ByDefeat().
  //
  // NOT HONESTLY DECLARABLE BY A CALLER, and the asymmetry is the point. This
  // value is meaningful on a RESPONSE and on the stream; sending it as
  // DissolveRequest.cause is not believed. Defeat is something the world
  // NOTICES, not something a caller decides: the composition consults the
  // rulebook about who is standing at every sight refresh, and a bubble left
  // with nobody upright on one side dissolves itself in that pass with this
  // cause (rpg-toolkit#1078). A caller who hands it in does not get an error and
  // does not change the outcome — the answer simply reports what actually
  // happened. DissolveRequest.cause says the same thing from its own side.
  //
  // Only the BUBBLE ends. The encounter stays open, the downed stay on the map
  // and in the roster, and Exit still carries them out. A defeat is not an
  // ending; it is a fight running out of a side.
  DISSOLVE_KIND_BY_DEFEAT = 2;
  // A fight that ended because the two factions in it stopped being
  // hostile: a disposition's `until` predicate held — the faction's mind
  // came to know the fact the author named — and the pair's stance folded
  // to neutral, so there is no longer a side to fight (design
  // rpg-project#375, ideas/living-world/hold-out §3.5 and §6, R1). The wire
  // mirror of the toolkit's sealed session.ByStance() cause, landing with
  // the same slice: the wire merges first (plan, wave 0) and the SDK
  // follows, which is the order the seal's own rule above anticipates.
  //
  // Like BY_DEFEAT, NOT HONESTLY DECLARABLE BY A CALLER. The world notices
  // a stance change in the same pass that notices a defeat, and a bubble
  // whose two factions are no longer hostile dissolves itself with this
  // cause; STANCE_CHANGED precedes the FIGHT_ENDED that carries it. Only
  // the pair's bubble ends — members of a third faction still hostile keep
  // their fight, and the encounter stays open.
  DISSOLVE_KIND_BY_STANCE = 3;
}

// GridKind names the map's coordinate family. Mirrors session.GridKind
// ("square" / "hex").
//
// The SDK models this as a string rather than mirroring spatial's iota, for the
// reason it gives: an iota is an in-process enumeration order, not a wire
// contract, and reordering it upstream would silently reinterpret every stored
// and transmitted value. A named proto enum has the same property.
//
// ONE VALUE FOR THE WHOLE MAP, not one per room (v0.10.0). A field has a single
// grid family by law, so a per-room grid was the same answer repeated.
enum GridKind {
  GRID_KIND_UNSPECIFIED = 0;
  // Square grid, where distance is Chebyshev.
  GRID_KIND_SQUARE = 1;
  // Hex grid addressed in axial coordinates, where distance is measured in
  // cube space.
  GRID_KIND_HEX = 2;
}

// HexLayout names which way a hex map's cells point when drawn. Mirrors
// session.HexLayout ("pointy_top" / "flat_top"), which arrived at
// session/v0.20.0 (rpg-toolkit#1140, ADR-0040).
//
// THE ONE FACT A CLIENT CANNOT RECOVER FROM THE CELLS. Axial coordinates fix
// the topology — the same six neighbours either way — and not the picture: the
// same cell set laid out pointy-top and flat-top gives two different images,
// roughly one rotated from the other. The first client to draw the reference
// tomb guessed from the content and got a diagonal staircase.
//
// This is the RENDER word, deliberately not the authoring word. The toolkit's
// composition holds an Orientation — the frame an author typed offset cells
// in — which the session seam consumes when it enumerates the cells and never
// hands out. Same two values, a different question, and the staircase happened
// because the two questions shared a word. Do not infer this from anything
// else on the wire; read it.
enum HexLayout {
  HEX_LAYOUT_UNSPECIFIED = 0;
  // A vertex up: rows run straight and alternate rows stagger.
  HEX_LAYOUT_POINTY_TOP = 1;
  // An edge up: columns run straight and alternate columns stagger.
  HEX_LAYOUT_FLAT_TOP = 2;
}

// MemberKind categorises a member. Mirrors session.MemberKind
// ("player" / "monster" / "world").
enum MemberKind {
  MEMBER_KIND_UNSPECIFIED = 0;
  // A player-controlled member.
  MEMBER_KIND_PLAYER = 1;
  // A member driven by the game rather than a person.
  MEMBER_KIND_MONSTER = 2;
  // A placed, non-combatant world NPC (rpg-toolkit#1404) — a vendor, or any
  // other content a player can Interact with. Structurally excluded from
  // combat: never a side in a fight, never on the turn clock.
  MEMBER_KIND_WORLD = 3;
}

// PlacementKind names which family of authored placement an Arrived beat
// carries — the two families of `place[]` entry that can be held in reserve
// (design rpg-project#375, ideas/living-world/hold-out §2: `arrives` is legal
// on monsters and props).
//
// NOT MemberKind, AND NOT A STRING. MemberKind cannot say PROP — a prop is
// not a member and has no row in any member list — and a client BRANCHES on
// this value (a monster arrival patches the roster, a prop arrival patches
// the atlas), which is the same reason EventKind is an enum. The set grows
// only when a new family of placement can wait in reserve, and that is a
// design change rather than content, so it is closed here.
enum PlacementKind {
  PLACEMENT_KIND_UNSPECIFIED = 0;
  // A monster placement: on arrival, a new MEMBER_KIND_MONSTER member.
  PLACEMENT_KIND_MONSTER = 1;
  // A prop placement: on arrival, a new AtlasProp.
  PLACEMENT_KIND_PROP = 2;
}

// Standing says whether a member is still on their feet. Mirrors
// session.Standing ("up" / "downed").
//
// A READ, NOT A REPLAY DEPENDENCY. EVENT_KIND_DOWNED fires once on the stream;
// Participant and Seen keep its binary compatibility projection readable.
// LifeState below is the richer provider-derived scheduling/presentation fact:
// consumers never infer it from Standing.
//
// TWO VALUES, AND NOT "DOWN". A bare "down" also reads as PRONE, a posture
// condition on a member still acting (Kirk's ruling, rpg-toolkit#1084).
enum Standing {
  STANDING_UNSPECIFIED = 0;
  // On their feet.
  STANDING_UP = 1;
  // At zero hit points. LifeState and provider declarations decide what the
  // member may do and whether they retain an initiative slot.
  STANDING_DOWNED = 2;
}

// LifeState is the session-owned projection of the D&D provider's derived
// combat life state. Mirrors session.LifeState from session/v0.54.1.
//
// This is always explicit wherever projected, even when DeathSaveProgress is
// absent. It is a read of canonical HP/progress/monster facts, not a second
// persisted life-state ledger, and consumers must never infer it from HP,
// Standing, or progress presence.
enum LifeState {
  LIFE_STATE_UNSPECIFIED = 0;
  LIFE_STATE_CONSCIOUS = 1;
  LIFE_STATE_DYING = 2;
  LIFE_STATE_STABILIZED = 3;
  LIFE_STATE_DEAD = 4;
  LIFE_STATE_DEFEATED = 5;
}

// DeathSaveOutcome classifies one authoritative provider-owned Death Save
// result. Consumers render this value; they never classify the d20 themselves.
enum DeathSaveOutcome {
  DEATH_SAVE_OUTCOME_UNSPECIFIED = 0;
  DEATH_SAVE_OUTCOME_SUCCESS = 1;
  DEATH_SAVE_OUTCOME_FAILURE = 2;
  DEATH_SAVE_OUTCOME_CRITICAL_FAILURE = 3;
  DEATH_SAVE_OUTCOME_STABILIZED = 4;
  DEATH_SAVE_OUTCOME_DEAD = 5;
  DEATH_SAVE_OUTCOME_RECOVERED = 6;
}

// DeathSaveContinuation is the provider's instruction for what follows dice
// settlement. It is never derived from roll or progress by a client.
enum DeathSaveContinuation {
  DEATH_SAVE_CONTINUATION_UNSPECIFIED = 0;
  // Invoke the current End Turn declaration after an in-bounds settlement.
  DEATH_SAVE_CONTINUATION_END_TURN = 1;
  // Refresh owner/turn/afford state and leave the recovered actor active.
  DEATH_SAVE_CONTINUATION_KEEP_TURN = 2;
  // Refresh authority only; a terminal transition already advanced or closed
  // the clock, so the client sends no second mutation.
  DEATH_SAVE_CONTINUATION_ALREADY_ADVANCED = 3;
}

// DeathSaveProgress is the provider-owned current progress projected to the
// whole party and to the authenticated owner. Remaining counts are provider
// answers: clients do not compare totals with a threshold or derive how many
// successes or failures remain.
//
// Presence does not define LifeState. Participant uses it for Dying/Stabilized
// progress; authenticated-owner CharacterData also uses it for Dead progress.
// It is absent when progress is not applicable, while LifeState remains
// explicit in every projection.
message DeathSaveProgress {
  int32 successes = 1;
  int32 failures = 2;
  int32 successes_needed = 3;
  int32 failures_remaining = 4;
  bool stabilized = 5;
  bool dead = 6;
}

// Money is a normalized D&D 5e currency amount, denominated in copper — the
// smallest unit — so arithmetic never has to reconcile mixed denominations.
// Mirrors the toolkit's currency.Money field-for-field (rpg-toolkit#1534).
// A character's own copy lives on their persistent sheet (character.Data.
// Wallet), not session state — it survives across dungeons the same way
// inventory does. `session.Trade` mutates that same persistent field when a
// purchase succeeds; nothing about this type is session-scoped.
//
// Defined here rather than in a new package because CharacterData
// (dnd5e.api.v1alpha2.encounter) already imports this file and reuses two
// other session-owned types the same way — LifeState and DeathSaveProgress
// above. The reverse import (session depending on v1alpha2.encounter) is not
// available regardless: that would reopen a path to the retired encounter
// service, which this seam does not allow.
message Money {
  int32 copper = 1;
}

// DamageType names the kind of damage an attack deals. Lands with
// rpg-toolkit#866 as the damage type carried on session.AttackRef; the values
// are the rulebook's own thirteen.
//
// A CLOSED SET, SO AN ENUM (Kirk, rpg-project#249 §6): the UI branches on it —
// a colour, a sound, a word in the beat line ("6 slashing") — and thirteen is
// the whole of 5e's list, sealed by the rulebook rather than open to a
// catalog. Compare AttackRef.ref, which is an OPEN set and stays a string.
enum DamageType {
  DAMAGE_TYPE_UNSPECIFIED = 0;
  DAMAGE_TYPE_ACID = 1;
  DAMAGE_TYPE_BLUDGEONING = 2;
  DAMAGE_TYPE_COLD = 3;
  DAMAGE_TYPE_FIRE = 4;
  DAMAGE_TYPE_FORCE = 5;
  DAMAGE_TYPE_LIGHTNING = 6;
  DAMAGE_TYPE_NECROTIC = 7;
  DAMAGE_TYPE_PIERCING = 8;
  DAMAGE_TYPE_POISON = 9;
  DAMAGE_TYPE_PSYCHIC = 10;
  DAMAGE_TYPE_RADIANT = 11;
  DAMAGE_TYPE_SLASHING = 12;
  DAMAGE_TYPE_THUNDER = 13;
}

// ShortfallReason names WHY a declaration or candidate is unavailable, as a value a UI can
// act on rather than prose it can only repeat. Lands with rpg-toolkit#1010
// (reach) and the structured Shortfall it carries.
//
// Each value is one of the refusals the matching verb would give, named here
// BEFORE the refusal — the same promise Afford has always made, extended from
// the economy to the turn and to reach. A client greys a candidate for
// TARGET_OUT_OF_REACH and disables an Attack declaration for
// NO_TARGET_IN_REACH or NO_BUDGET; it never parses `text` to tell them apart.
enum ShortfallReason {
  SHORTFALL_REASON_UNSPECIFIED = 0;
  // The currency ran out — what Attack refuses as ErrCannotAfford ("action: 1
  // needed, 0 left"). `currency`, `needed` and `left` are populated.
  SHORTFALL_REASON_NO_BUDGET = 1;
  // It is not this member's turn — what Attack, Move and EndTurn refuse as
  // ErrNotYourTurn.
  SHORTFALL_REASON_NOT_YOUR_TURN = 2;
  // No candidate is currently available to Attack — the declaration-level
  // refusal corresponding to ErrOutOfReach (rpg-toolkit#1010). It disables the
  // Attack declaration without removing any candidate rows; each named reach
  // failure uses TARGET_OUT_OF_REACH on that candidate.
  SHORTFALL_REASON_NO_TARGET_IN_REACH = 3;
  // The member is downed. This blocks Attack and Move as ErrDowned; it does not
  // block End Turn, which is governed solely by its clock/turn gate.
  SHORTFALL_REASON_DOWNED = 4;
  // A provider dependency required by this verb could not be read. Attack
  // requires the character and its compiled action; Move requires the
  // character and movement economy; End Turn requires neither and remains
  // governed only by its clock/turn gate. Afford reports the dependency
  // failure per verb so one unreadable action does not erase independent
  // Move or End Turn declarations.
  SHORTFALL_REASON_UNREADABLE = 5;
  // The named target failed the attack's reach gate. This is candidate-level;
  // NO_TARGET_IN_REACH remains the declaration-level answer when no candidate
  // can be attacked.
  SHORTFALL_REASON_TARGET_OUT_OF_REACH = 6;
  // The ability's own precondition failed — already raging, already at full
  // hit points. NOT a budget: nothing ran out, no currency is populated, and
  // waiting will not help the way it does for NO_BUDGET. `text` carries the
  // feature's own words.
  //
  // This is the seam's word for what character.Feature.CanActivate refuses,
  // which is a different question from what the economy refuses. A client that
  // collapsed the two would tell a raging barbarian to come back next turn.
  SHORTFALL_REASON_UNAVAILABLE = 7;
}

// Currency names which of a turn's budgets a NO_BUDGET shortfall ran out of.
// Lands with the structured Shortfall (rpg-project#249).
//
// This is the economy's word for what ran out — it is NOT Slot, although three
// values coincide. Slot says which shape a declaration LIGHTS; Currency says
// which ledger a refusal DRAINED, and movement is a ledger with no shape. The
// two are kept separate so a client that lights shapes never has to treat feet
// as a fourth one.
enum Currency {
  CURRENCY_UNSPECIFIED = 0;
  CURRENCY_ACTION = 1;
  CURRENCY_BONUS = 2;
  CURRENCY_REACTION = 3;
  // Feet, not a count. `needed` and `left` on a MOVEMENT shortfall are in feet,
  // at the server's five per cell.
  CURRENCY_MOVEMENT = 4;
  // Charges of a named feature resource — rage uses, Second Wind uses, ki
  // points. A count, like the three slots.
  //
  // WHICH resource is named only in `text`. This seam does not enumerate the
  // rulebook's resource keys, for the same reason Verb does not enumerate the
  // rulebook's actions: the catalog grows without this contract changing, and
  // a client that branched on the specific pool would be deriving rules.
  // `needed` and `left` are the figures it shows.
  CURRENCY_CHARGES = 5;
}

// Verb names a seam action Afford can gate. Mirrors session.Verb
// ("attack" / "move" / "end_turn" / "activate" / "death_save").
//
// A closed set owned by the session package rather than a reuse of the
// rulebook's own action vocabulary: a declaration is a question about what THIS
// SEAM lets a member declare, not the currency the rulebook happens to price it
// in. A value arrives here the day the SDK gates the verb, never ahead of it:
// Attack came with the economy (session/v0.17.0), Move when a walk on the turn
// clock started spending (rpg-toolkit#1169).
enum Verb {
  VERB_UNSPECIFIED = 0;
  // Attack — swinging a weapon at another member.
  VERB_ATTACK = 1;
  // Move — walking along a path while on the turn clock. The SAME Move RPC,
  // now priced: free-roam walking spends nothing and so never appears in a
  // declaration (the world clock has no declarations at all).
  VERB_MOVE = 2;
  // End Turn — committing the active member's turn. It has no action-economy
  // price and is governed only by its clock/turn gate.
  VERB_END_TURN = 3;
  // Activate — using a combat ability or feature the character already
  // carries: Dodge, Dash, Disengage, Help, Hide, Rage, Second Wind.
  //
  // THE FIRST VERB THAT EMITS MORE THAN ONE DECLARATION. Attack, Move and End
  // Turn each compile exactly one offer, and every reader written before this
  // could assume one row per verb. Activate cannot: six abilities share the
  // action slot, and a barbarian has Rage on the bonus slot at the same moment
  // Attack sits on the action one. Slot lives on the declaration, so they
  // cannot share a row. See Declaration's own note.
  VERB_ACTIVATE = 4;
  // Death Save — the active Dying character's explicit tabletop saving throw.
  // It spends its provider-owned once-per-turn capacity, not an action slot.
  VERB_DEATH_SAVE = 5;
}

// TargetKind tells a client which selector shape a declaration accepts. Its
// values arrive with a proven executor, not in advance — which is why Activate
// added a verb and no new kind: the seven level-1 activations are answered by
// NONE and MEMBER, both of which already had one.
enum TargetKind {
  TARGET_KIND_UNSPECIFIED = 0;
  TARGET_KIND_NONE = 1;
  TARGET_KIND_MEMBER = 2;
  TARGET_KIND_PATH = 3;
}

// Slot names which of a turn's three economy shapes a Declaration draws from.
// Mirrors session.Slot ("" / "action" / "bonus" / "reaction") — the same four
// values the rulebook's character.EconomySlot carries, spelled at the session
// seam rather than imported across it (S2).
//
// The vocabulary is the one a UI already has buttons for. Kirk's ruling on
// rpg-toolkit#1138: "in our ui we hand shapes for action, bonus and reaction
// that lined up with the various things we could do." A client lights the
// shape a declaration names and never learns why that shape is the one.
//
// NONE IS NOT UNSPECIFIED, and the distinction is load-bearing. The SDK spells
// SlotNone as the empty string "", and "this swing spends no shape" is an
// ANSWER: Extra Attack's second swing draws a banked attack and lights none of
// the three shapes, yet it is still priced and can still be unaffordable once
// that bank runs out. Go's zero value for session.Slot is therefore a real
// value, and rpg-api's projection must map "" to SLOT_NONE explicitly — a
// projection that lets Go's "" fall through to proto's 0 would report every
// banked swing as "the producer forgot to say", which is exactly what
// UNSPECIFIED means and exactly what did not happen.
enum Slot {
  SLOT_UNSPECIFIED = 0;
  // No per-turn slot is drawn. NOT the same claim as "costs nothing" — see
  // the note above on banked Extra Attack swings.
  SLOT_NONE = 1;
  // The standard action.
  SLOT_ACTION = 2;
  // The bonus action.
  SLOT_BONUS = 3;
  // The reaction.
  SLOT_REACTION = 4;
}

// =============================================================================
// Spatial
// =============================================================================

// Position mirrors spatial.Position (tools/spatial v0.9.1) — the one value type
// the session SDK lets across its boundary, and therefore the one this contract
// must match rather than choose.
//
// EVERY POSITION ON THIS SEAM IS DUNGEON-ABSOLUTE. That is now uniform rather
// than per-field: as of session v0.11.0 a member's placement is a cell on the
// map, not a cell within a named room, so the Atlas, JoinRequest, MoveRequest,
// Member, MemberOutcome and Step all speak the same coordinates. There is no
// room-local frame left on this contract to get wrong.
//
// Minted here rather than reusing an existing Position, deliberately, and both
// candidates were checked:
//
//   - `api.v1alpha1.Position` is int32 x/y/z cube coordinates. Reusing it would
//     change the type and add an axis the SDK does not have — not a
//     field-for-field mirror (rule 1), and a lossy cast at every boundary.
//   - `dnd5e.api.v1alpha2.encounter.Position` is the same int32 cube shape AND
//     lives in the package the cutover deletes. Importing it would create a
//     path between SessionService and the old encounter stack, which rule 9
//     forbids outright.
message Position {
  double x = 1;
  double y = 2;
}

// =============================================================================
// Roster
// =============================================================================

// Member is one participant's placement on the map. Mirrors session.Member.
message Member {
  // room = 3 held a room ID until session v0.11.0 took rooms off this seam.
  // Retired rather than retyped in place: reusing a tag for a different type is
  // the one proto change that fails silently.
  reserved 3;
  reserved "room";

  string id = 1;
  MemberKind kind = 2;
  // The cell they stand on, dungeon-absolute.
  //
  // This replaced a room ID in session v0.11.0, and the SDK calls that swap the
  // reshape in one field: which chamber somebody is in is the composition's own
  // decomposition, while where they STAND is the thing a client renders, a rule
  // measures, and another member walks toward.
  Position position = 4;
}

// PublicMemberInfo is the public half of one character or monster — what any
// fellow member of the session may know about them (rpg-project#264,
// ideas/characters/presentation): the name they go by and the body they wear.
// The name is the ruling made explicit: everything here is PUBLIC, and nothing
// private (hit points, ability scores, inventory — the sheet) ever lands in
// this message; the sheet stays behind the character service's owner gate
// (rpg-api#814). Identity only, no positions: where somebody STANDS is
// perception and rides GetView/GetWhere — a roster read must not leak the
// cells of members the caller has never perceived (GetWhere's own rule).
//
// Stable by design — it changes at join time and in an editor, not per turn —
// so a client loads the roster ONCE per session (re-pulling on a joined
// event) and references it at render, instead of paying for identity on
// every perception refresh.
message PublicMemberInfo {
  // The session member id — the same id Sighting.subject and Member.id speak.
  string id = 1;
  MemberKind kind = 2;
  // Display name, the same word Sighting.name carries.
  string name = 3;
  // The body, for PLAYER members: the class and race refs the client already
  // maps to models for the local player's own render path. Empty for
  // monsters.
  string class_ref = 4;
  string race_ref = 5;
  // The body, for MONSTER members: the authored monster ref (e.g.
  // "dnd5e:monsters:skeleton"), so a client resolves the model from the ref
  // itself instead of deriving it from the member id's naming convention.
  // Empty for players.
  string monster_ref = 6;
  // Public visual identity projected to the roster. Always set; see
  // Customization.
  Customization customization = 7;
  // The faction this member fights for — a free-form id: the dungeon file's
  // `factions[].id`, or one of the two the rulebook reserves and no author
  // may declare — players are `party`, and a monster placed with no
  // `faction` line is `monsters` (design rpg-project#375 §2, R4).
  //
  // FACTIONS ARE CONTENT, NEVER AN ENUM. An author declares them per
  // dungeon, so this is an open string the way AtlasProp.facing and
  // ScenarioField.kind are, and a client groups or colours by the word
  // without knowing what a goblin is. Who fights whom is not derived from
  // it either: the stance between two factions is the run's own fold, and
  // a change in it reaches a client as STANCE_CHANGED.
  //
  // ON THE ROSTER BECAUSE THE ROSTER IS THE ONLY PER-MEMBER ROW ON THE
  // WIRE. Sighting, Participant and Member all speak a member id and join
  // here for anything stable about them; a faction is stable in exactly the
  // way name and body are — set at spawn, never per turn — so it rides the
  // one row a client already loads once and re-pulls on JOINED and ARRIVED.
  //
  // Empty means the member is in no faction. Today that is exactly a
  // MEMBER_KIND_WORLD member: a world NPC stands structurally outside
  // combat and its own stance is its policy's (the npc lane); folding that
  // into the faction graph is a named shelf (design §11), not a default
  // applied here.
  string faction = 8;
}

// Customization is public visual identity, not owner-private sheet or rules
// data. It uses the neutral customization package so character creation and
// roster projection speak the same semantics without exposing provider paths.
// Semantic validation and public projection are toolkit-owned; the API
// converts and delegates without interpreting customization values.
message Customization {
  // Existing provider-neutral hair customization; its semantics are unchanged.
  dnd5e.api.customization.v1alpha1.HairCustomization hair = 1;

  // Provider-neutral class-outfit color intent. Absent channels preserve the
  // provider's authored channel.
  dnd5e.api.customization.v1alpha1.OutfitCustomization outfit = 2;
}

// MemberOutcome is where a member stood when something closed around them.
// Mirrors session.MemberOutcome.
message MemberOutcome {
  // room = 2 held a room ID until session v0.11.0. See Member.
  reserved 2;
  reserved "room";

  string id = 1;
  // Where they stood when it ended, dungeon-absolute — the same frame every
  // other position on this seam speaks. Keeps the tag it has always had.
  Position position = 3;
}

// CharacterState is what a loaded character reports about itself. Mirrors
// session.CharacterState.
//
// The SDK's own twin of a stored character, not the stored shape: this is what
// one call observed after reconstitution. Deliberately small — it carries what
// a client needs to render a member and what proves the load happened, not the
// sheet in full.
message CharacterState {
  string id = 1;
  string name = 2;
  int32 level = 3;
  // BASE walking speed in feet, from race — not effective speed. Condition-
  // driven modifiers are applied during resolution through the movement chain,
  // never folded in here. A client rendering this shows the sheet's speed, not
  // what the next step will cost.
  int32 speed = 4;
  int32 hit_points = 5;
  int32 max_hit_points = 6;
  int32 armor_class = 7;
  int32 proficiency_bonus = 8;
}

// =============================================================================
// Perception
// =============================================================================

// Seen is what the sight channel knows about a subject: the cell it occupies,
// dungeon-absolute — the same frame every other position on this seam speaks.
// Mirrors session.Seen (ADR-0041, rpg-toolkit#1157).
//
// On Sighting, present when BOTH hold: the sighting was produced by sight
// (gated on channel provenance) AND the composition's payload actually decodes
// as a sight payload. Unset for every other channel — the ordinary, expected
// case. A memory (current_via empty) keeps the seen it last had — the
// last-known cell a client draws a faded marker on.
//
// On Report this is weaker: intel.Report carries no channel of its own, so a
// Report's seen is inferred by decoding its payload rather than gated on
// provenance (rpg-toolkit#1160 closes that gap). Seen present on a Report is
// not proof the report came from sight — today it always does, because sight
// is the only channel this codebase surveils with, not because this field
// checked.
//
// A future channel (hearing, tremorsense) gets its own sub-message with the
// facts that channel actually conveys; a sight-specific fact that arrives
// later (lighting, distance band) belongs inside Seen, not as a new field on
// Sighting.
message Seen {
  // The sighted subject's cell, dungeon-absolute.
  Position position = 1;
  // Whether the sighted subject is on their feet. SIGHT-CHANNEL KNOWLEDGE, not
  // roster truth: an observer who can see a member can see whether they are
  // standing, which is why it belongs inside Seen (ADR-0041's rule — a
  // sight-specific fact goes here, not on Sighting) and not on a roster read
  // this seam deliberately lacks. A memory (current_via empty) keeps the
  // standing it last saw, exactly as it keeps the position. Lands with
  // rpg-toolkit#1137.
  Standing standing = 2;
}

// Report is one thing an observer perceived. Mirrors session.Report.
message Report {
  // What was perceived.
  string subject = 1;
  // What the observer learned, encoded by the composition. Opaque here: rpg-api
  // round-trips these bytes and never builds them (rule 1's corollary — the
  // host invents no vocabulary, including inside a payload).
  bytes payload = 2;
  // The sight channel's typed knowledge, carried the same way Sighting.seen is
  // — first contact and a held sighting are the same fact in the same shape.
  // UNLIKE Sighting.seen, this is not gated on channel provenance: Report
  // carries no channel field, so this is populated by decoding the payload and
  // checking whether it parses. Seen present here is not proof the report
  // came from sight — see Seen's own doc.
  Seen seen = 3;
}

// Discovery is what changed in one observer's perception. Mirrors
// session.Discovery.
//
// Three disjoint lists rather than one "here is everything you now perceive",
// because a client renders them differently: a first sighting is announced, a
// refresh updates silently, a fade greys something out. Collapsing them would
// force the client to diff against its own previous state to recover a
// distinction the composition already knows.
message Discovery {
  // What came into view that the observer did not hold at all — the moments
  // worth announcing.
  repeated Report first_contact = 1;
  // Subjects the observer already held whose knowledge was renewed by a live
  // channel.
  repeated string refreshed = 2;
  // Subjects that stopped being sustained. The observer keeps a memory; it is
  // no longer a live sighting.
  repeated string faded = 3;
}

// Sighting is one thing an observer currently knows about. Mirrors
// session.Sighting.
//
// `channel` and `status` are free-form strings in the SDK, and stay strings
// here. Promoting them to enums would be rpg-api inventing a closed vocabulary
// the toolkit has not committed to (rule 1) — the opposite of what the enums
// above do, which is transcribe vocabularies the SDK already sealed.
message Sighting {
  // What is perceived.
  string subject = 1;
  // What the observer knows about it, encoded by the composition. Retained for
  // channels the SDK has not typed; sight itself is typed through seen below —
  // clients render position from seen and never decode this for sight.
  bytes payload = 2;
  // How it was perceived.
  string channel = 3;
  // The clock reading when this knowledge was last refreshed. A clock reading,
  // not a wall time — see Event.at.
  uint64 at = 4;
  // The channels currently carrying it. Empty means the observer holds a
  // memory rather than a live sighting.
  repeated string current_via = 5;
  // Distinguishes a live sighting from a stale memory.
  string status = 6;
  // The sight channel's own typed knowledge; see Seen. Present iff channel is
  // sight and the payload decoded as a sight payload; unset otherwise. A memory
  // (current_via empty) keeps the seen it last had.
  Seen seen = 7;
  // The sighted subject's display name — "skeleton-1", not a ref or an id.
  // Beside `subject` so a client labels what it draws and narrates what it
  // sees without a second lookup (rpg-dnd5e-web#564: names, not ids). Names are
  // not a perception question: anything an observer can sight, they can name.
  // Lands with rpg-toolkit#1137, alongside Participant.name.
  string name = 8;

  // What kind of member the sighted subject is. Kind, like name, is not a
  // perception question — anything an observer can sight, they can classify at
  // a glance (a fellow adventurer vs a skeleton). Lets a client route a player
  // subject to a player model instead of guessing a monster ref from the
  // subject id (rpg-dnd5e-web#792). Mirrors session.Sighting.Kind
  // (rpg-toolkit#1230); a memory keeps its kind exactly as it keeps its name.
  MemberKind kind = 9;
}

// =============================================================================
// Movement, fights, endings
// =============================================================================

// Step is one cell entered during a walk. Mirrors session.Step.
message Step {
  Position position = 1;
  // The WALKER'S own number for the recorded step — the actor's numbering.
  // seq is per recipient (see Event.seq): dense in the walker's stream alone,
  // and a witness of the same step holds a different number for it.
  uint64 seq = 2;
}

// Outcome is how an encounter closed. Mirrors session.Outcome.
message Outcome {
  // The key of the ending that fired.
  string ending = 1;
  // The clock reading when it fired.
  uint64 at = 2;
  // Where everyone stood when it closed.
  repeated MemberOutcome members = 3;
}

// Formed reports that a fight started, and who is in it. Mirrors
// session.Formed.
//
// It is NEWS, not a decision anyone made: the composition detects contact
// wherever sight changes and starts the fight itself, and whichever verb caused
// it carries the report back. A client renders "roll for initiative" from this;
// it never asks for one. That is why it appears on every verb that can put two
// sides in sight of each other — a walk or an arrival.
message Formed {
  // The fight's initiative order, first to act first.
  repeated string order = 1;
  // The members who entered unaware, a subset of order. Empty under symmetric
  // sight, which is a law as of spatial v0.9.1; it fills when asymmetric
  // perception arrives deliberately (stealth against perception,
  // rpg-toolkit#1020), never through geometry.
  repeated string surprised = 2;
  // The ACTOR'S own number for the beat that recorded the fight starting —
  // the numbering of the member whose verb carried this report back, not a
  // number the fight has. seq is per recipient (see Event.seq): everyone else
  // in `order` holds a different number for this same beat, and it is never
  // the engine's whole-truth sequence.
  uint64 seq = 3;
}

// Participant is one member of the fight the asker is in, as TurnResponse
// reports them. Lands with rpg-toolkit#1137 as session.Participant.
//
// WHAT `order` CANNOT CARRY. TurnResponse.order has always been the initiative
// order as bare ids, and a client rendering an initiative panel from it had to
// ask elsewhere for every name (only on Join/Spawn outputs), had nothing at
// all for standing (#1137), and derived "active" by matching
// TurnResponse.active against each entry. This carries all three beside each
// id. `order` stays, unchanged, for the readers it already has.
//
// NOT A ROSTER READ, and the line matters because this seam refuses one on
// purpose (see GetWhereResponse). Participants are the members of the fight
// the asker is IN — two sides that have, by construction, seen each other —
// so nothing here leaks a cell or a member the asker has not perceived.
// There is no position on it for that reason: where a participant stands is
// GetView's answer, gated by sight.
message Participant {
  // The member's id, as it appears in `order`.
  string member = 1;
  // Display name. Never empty for a member the server can name — which is
  // every member it can list.
  string name = 2;
  MemberKind kind = 3;
  // Binary compatibility projection: on their feet or downed. Read life_state
  // for Dying/Stabilized/Dead/Defeated scheduling and presentation semantics.
  Standing standing = 4;
  // Whether it is this member's turn. EXACTLY ONE TRUE on the turn clock —
  // the same member TurnResponse.active names — so a client marks the active
  // row without a lookup.
  bool active = 5;
  // Always-explicit provider-derived state. Never infer it from standing,
  // optional death_saves, or hit points. These facts are visible to the whole
  // party because the physical Death Save and its pips are table-visible.
  LifeState life_state = 6;
  // Provider-owned progress, present for applicable Dying/Stabilized character
  // progress and absent when not applicable. The remaining counts are already
  // derived by the provider; clients never apply a three-save threshold.
  DeathSaveProgress death_saves = 7;
}

// =============================================================================
// Economy — what a member can still declare
// =============================================================================

// TargetCandidate is one member in a compiled Attack's complete candidate
// universe: every current live-sight holding (`current_via` non-empty) except
// the actor appears exactly once. Stale memories, undisclosed members, and the
// actor are excluded. A live holding whose position is missing fails Afford;
// it must never be silently omitted.
message TargetCandidate {
  string member = 1;
  // The target-specific gate, independent from the declaration's turn/economy
  // gate. A declaration may be unavailable while this remains true.
  bool available = 2;
  // Present if and only if available is false. TARGET_OUT_OF_REACH is a
  // candidate-level reason; global turn/economy reasons are never copied here.
  Shortfall why = 3;
}

// Declaration is one server-compiled action/cost variant. Declarations, not
// remaining currencies (ADR-0042): the client renders availability, identity,
// target kind, and candidates verbatim and never derives game rules. Attack,
// Move, End Turn, Activate and Death Save regenerate the selected offer before
// execution.
//
// # One row per OFFER, not one row per verb
//
// Attack, Move and End Turn each compile exactly one, so for three verbs the
// two readings coincided. VERB_ACTIVATE separates them: a level-1 barbarian
// gets seven Activate declarations, and `slot` is what distinguishes Rage on
// the bonus shape from Dodge on the action one. A consumer that indexes
// declarations by verb, or that treats a second row for a verb as a producer
// defect, is reading a coincidence as a contract.
//
// `id` remains the only thing execution echoes, and it is per-offer — so the
// selector already identified the right row before there was more than one.
message Declaration {
  // Which seam action this prices.
  Verb verb = 1;
  // Which economy shape this declaration would spend, or SLOT_NONE. Read off
  // the SAME SpendProfile the door would charge — never a table of what a
  // verb "usually" costs — so a class table changing what an action buys
  // changes this automatically.
  Slot slot = 2;
  // Whether every gate applicable to this verb currently passes. This is the
  // intentional source/JSON-name rename from `affordable = 3` to
  // `available = 3`: tag and wire shape stay fixed, but generated source names
  // and the JSON name change from `affordable` to `available`.
  bool available = 3;

  // Removed in the intentional production-contract reshape. why.text is the
  // sole prose refusal and candidates replace the former flat target.
  reserved 4, 6;
  reserved "shortfall", "target";
  // Provider-authored display/context for how much movement remains, in feet
  // (rpg-toolkit#1169). Present only for VERB_MOVE declarations; absent for
  // every VERB_ATTACK, VERB_END_TURN, VERB_ACTIVATE, and VERB_DEATH_SAVE
  // declaration.
  //
  // A NUMBER, NOT A PATH PRICE, because Move has no fixed cost until a path is
  // chosen. Clients may display this value verbatim but must not convert it to
  // cells, derive a path budget or cost from it, or use it to decide whether a
  // path will be accepted. The server prices the WHOLE requested path before
  // the first step and refuses it whole; `available` is likewise the server's
  // answer about whether any step is currently possible.
  //
  // `optional`, and this is the OTHER presence law at this seam — the
  // Outcome/Formed one (a message that is present or not), not the bool one
  // (a value that is never absent). Zero is a real answer here — nothing left
  // this turn — and must not collide with "this verb carries no such number at
  // all", which is what an Attack declaration says by leaving it unset. The
  // SDK carries it as a pointer with omitempty for exactly that reason, and
  // rpg-api's projection must keep absent absent: a nil that became 0 would
  // tell a client its attack has no feet left.
  optional int32 remaining = 5;
  // Present if and only if available is false. The server owns refusal
  // precedence. NO_TARGET_IN_REACH disables a compiled Attack without removing
  // its candidate rows.
  Shortfall why = 7;
  // Opaque deterministic selector for this current compiled offer. Non-empty
  // on every compiled Attack, turn-clock Move, End Turn, and Death Save
  // declaration; empty on an early per-verb blocker. The client echoes it and
  // never parses it.
  string id = 8;
  // The sole public Attack identity. Present on every compiled Attack,
  // including compiled offers disabled by budget or target gates; absent for
  // Move, End Turn, Death Save, and early per-verb blockers.
  AttackRef attack = 9;
  // Fixed for every compiled or blocked declaration: Attack -> MEMBER,
  // Move -> PATH, End Turn -> NONE, Death Save -> NONE, Activate -> MEMBER for
  // Help and NONE for the rest. UNSPECIFIED is a producer defect.
  //
  // Activate is the first verb whose kind varies by WHICH offer it is rather
  // than by which verb it is: Help prompts for an ally, and the other six
  // prompt for nothing. The rulebook draws a further line between "targets the
  // actor" (Dodge, Rage) and "targets nobody" (Dash) that this enum
  // deliberately does not: both are the same instruction to a client — do not
  // prompt — and whose sheet the effect lands on is the rulebook's business.
  TargetKind target_kind = 10;
  // Every member in the ruled candidate universe exactly once, including
  // unavailable targets and their server-authored reasons. NO_TARGET_IN_REACH
  // does not remove these rows. Empty for Move, End Turn, Death Save, and early
  // blockers.
  repeated TargetCandidate candidates = 11;
  // The sole public activation identity. Present on every compiled Activate
  // declaration, including one disabled by a budget, charge or feature gate;
  // absent for Attack, Move, End Turn, Death Save, and early per-verb blockers.
  // The same presence law `attack` keeps, for the same reason.
  //
  // A SIBLING OF `attack` RATHER THAN A ONEOF WITH IT. A oneof would make it a
  // wire-level error for one declaration to carry both — and the monk's
  // bonus-action unarmed strike is exactly that: VERB_ATTACK on SLOT_BONUS,
  // gated on having taken the Attack action, which plausibly wants a weapon
  // identity AND the feature that granted the swing. That is a case we can
  // already name rather than a hypothetical, so the wire does not rule it out
  // in advance. If it turns out one declaration never needs both, a oneof can
  // be adopted later; a oneof adopted now cannot be undone without a break.
  AbilityRef ability = 12;
  // The provider-authored Death Save identity. Present only on a compiled
  // VERB_DEATH_SAVE declaration; absent for every other verb and blocker.
  DeathSaveRef death_save = 13;
  // Presence summary: an early per-verb blocker still emits its declaration
  // with available=false, why present, empty id, absent attack, empty
  // candidates, and the fixed target_kind. In particular, Afford emits the
  // Attack blocker even when Attack compilation cannot proceed. Compiled
  // offers use the field-presence rules above.
}

// Shortfall is the structured reason a declaration or candidate is unavailable. Lands
// with rpg-toolkit#1010 as session.Shortfall.
//
// STRUCTURED SO THE UI CAN ACT ON IT; TEXT STAYS FOR NARRATION. The string
// form alone ("action: 1 needed, 0 left") is enough to repeat a refusal in the
// player's own words and not enough to do anything else with it — a client
// that wanted to dim the action shape and show "0 left" on hover had to parse
// prose. `reason` is what it branches on, `currency`/`needed`/`left` are the
// figures it shows, and `text` is what it says. The three agree by
// construction: the SDK renders `text` from the other four, never the
// reverse.
message Shortfall {
  // What kind of refusal this is. Always set.
  ShortfallReason reason = 1;
  // Which ledger ran out. Set for NO_BUDGET; UNSPECIFIED for every other
  // reason, which has no currency to name.
  Currency currency = 2;
  // How much the verb costs, in that currency's unit (feet for MOVEMENT, a
  // count otherwise). Meaningful for NO_BUDGET; zero otherwise.
  int32 needed = 3;
  // How much is left. Meaningful for NO_BUDGET; zero otherwise — and a real
  // zero, which is the usual case.
  int32 left = 4;
  // The refusal in the SDK's own words — "action: 1 needed, 0 left",
  // "movement: 20 ft needed, 15 ft left", "not your turn", "no target in
  // reach". This is the declaration's sole prose refusal and is the same text
  // the verb's FAILED_PRECONDITION would use.
  string text = 5;
}

// AttackRef identifies WHAT was swung — weapon identity, which the seam has
// dropped on the floor since the first swing (rpg-toolkit#866). Lands with
// rpg-toolkit#866 as session.AttackRef, carried on compiled Attack
// Declarations, AttackResponse, and the Struck/Missed event bodies. For one
// selected execution, all three occurrences must be equal; the provider must
// not offer one Attack and resolve another.
//
// Without it a beat line can say "17 vs AC 13, 6 damage" and not "6
// slashing" or "with a longsword": the numbers crossed the seam and the thing
// that produced them did not. This is the AttackProfile's identity projected —
// ref, name and damage type — and nothing of its arithmetic.
message AttackRef {
  // The full core.Ref.String() the attack compiled from, for example
  // "dnd5e:weapons:longsword". Bare definition IDs such as "longsword" are
  // invalid. An OPEN set, so a string: the catalog grows without this contract
  // changing.
  string ref = 1;
  // Display name. "Longsword"; "Unarmed strike" for an empty hand
  // (rpg-toolkit#1168).
  string name = 2;
  // The kind of damage it deals. Closed set, enum — see DamageType.
  DamageType damage_type = 3;
}

// DeathSaveRef identifies the explicit tabletop roll without overloading an
// AttackRef or AbilityRef. It mirrors session.DeathSaveRef.
message DeathSaveRef {
  // Provider-authored display name, rendered verbatim.
  string name = 1;
}

// AbilityRef identifies WHAT is being activated — the combat ability or
// feature behind a VERB_ACTIVATE declaration. Mirrors session.AbilityRef.
//
// It exists for the same reason AttackRef does: a declaration the client
// renders verbatim needs an identity, and "Rage" is not derivable from
// VERB_ACTIVATE the way "Move" is from VERB_MOVE. Attack has one identity per
// weapon; Activate has one per thing the character carries, and there are
// seven of them at level 1.
message AbilityRef {
  // The full core.Ref.String() — "dnd5e:combat_abilities:dodge",
  // "dnd5e:features:rage". Bare IDs such as "rage" are invalid. An OPEN set,
  // so a string: the catalog grows without this contract changing.
  //
  // For correlation and for a client's own icon table. NEVER for a rules
  // decision — a client that branched on this ref to decide what a button does
  // would be deriving 5e, which is the whole thing declarations prevent.
  string ref = 1;
  // Display name — "Dodge", "Rage", "Second Wind". Authored by the ability
  // itself, never derived from the ref by the client.
  string name = 2;
}

// ReactionRef identifies WHAT a strike was taken as, when the strike was a
// reaction rather than a declared action. Carried on the Struck and Missed
// bodies; absent on an ordinary swing.
//
// The third identity in this family, and the only thing the wire cannot say
// about an opportunity attack (rpg-project#316). Every number an OA produces —
// roll, total, the AC it beat, damage, weapon, crit, components — already
// crosses on Struck/Missed, because an opportunity attack IS a strike and
// records through the same path a declared swing does. What does not cross is
// why a fighter dealt damage during a monster's turn. Without this the log
// still tells the truth and reads as a bug.
//
// A client that ignores the field renders exactly as it does today.
message ReactionRef {
  // The full core.Ref.String() of the condition or feature that reacted, for
  // example "dnd5e:conditions:opportunity_attack". An OPEN set, so a string:
  // Shield, Uncanny Dodge and Hellish Rebuke join it without this contract
  // changing.
  //
  // For correlation and for a client's own icon table. NEVER for a rules
  // decision.
  string ref = 1;
  // Display name — "Opportunity Attack". Authored by the reacting rule
  // itself, never derived from the ref by the client.
  string name = 2;
}

// =============================================================================
// Reports every mutating verb carries back
// =============================================================================

// SaveReport names which aggregates were persisted and which were not. Mirrors
// session.SaveReport.
//
// A partial save is an error carrying a populated report, never a silent shrug
// (the SDK's law S6). Both lists non-empty means the world is half-written and
// the caller needs to know which half.
message SaveReport {
  repeated string written = 1;
  repeated string failed = 2;
}

// DeliveryReport says what reached the event stream. Mirrors
// session.DeliveryReport.
//
// Separate from SaveReport because they answer different questions with
// different consequences: a failed save means the world did not change, while a
// failed delivery means it DID and some clients have not heard yet. Conflating
// them would leave a caller unable to tell "retry this" from "this happened,
// tell them again."
message DeliveryReport {
  // How many per-recipient events were handed to the stream.
  int32 events = 1;
  // Delivery did not succeed. The verb still succeeded: the story log is the
  // source of truth, every recipient's own sequence is dense (see Event.seq —
  // seq is per recipient), and a client that misses an event notices the hole
  // in its own numbering and re-queries GetStory.
  bool failed = 2;
}

// =============================================================================
// Atlas — the static world map, in one piece
// =============================================================================

// AtlasProp is one thing standing on the map — a pillar, a coffin, a pile of
// bones — each naming WHAT it is and answering both blocking questions for
// itself. Mirrors session.AtlasProp. Dungeon-absolute.
//
// THIS REPLACED `repeated Position occluders` on GetAtlasResponse in
// session/v0.18.0 (rpg-toolkit#1130). That field was the subset of cells that
// blocked sight, as bare coordinates, and it was wrong in two directions at
// once. It could not say a pillar from a statue — rpg-project#227 recorded the
// complaint as "a pillar and a statue are the same cell" — and it hardcoded ONE
// answer to TWO independent questions: a coffin is walked around but seen over,
// and a pile of bones is neither. A host that wants the old list back filters
// this one on blocks_line_of_sight.
message AtlasProp {
  // Ref names what this is, so a host can draw it.
  string ref = 1;

  // The cell it stands on, in dungeon-absolute space.
  Position at = 2;

  // Whether an entity may enter its cell.
  //
  // PLAIN bool, not `optional bool`, and the choice is deliberate on both of
  // these. The SDK had to strip `omitempty` from its four blocking flags
  // (rpg-toolkit#1136) because hand-rolled JSON carries no schema, so a false
  // vanished and a pile of bones — which blocks neither — serialised carrying no
  // blocking information at all, indistinguishable from a prop nobody declared
  // one for. Proto does not have that hole: false is the schema's default, and a
  // generated client materialises it whether or not the wire spends the bytes.
  //
  // `optional` would be worse than redundant here. It would invent a third
  // state, unspecified, that the producer cannot express: an atlas is the
  // projection of a RESOLVED world in which every prop already has both answers.
  // The `*bool` the composition spends one layer down (rpg-toolkit#1033) guards
  // a genuinely open question — was a capability SUPPLIED — and that question
  // has already been settled by the time anything reaches this seam.
  bool blocks_movement = 3;

  // Whether sight passes through its cell.
  bool blocks_line_of_sight = 4;

  // The AUTHORED facing, verbatim from the dungeonspec `place[].facing` word
  // (rpg-project#261, vocabulary redefined by rpg-project#272). Empty means
  // not authored: render the asset's own default orientation, exactly
  // today's rendering.
  //
  // When present, it is one of the EIGHT true-compass names —
  // n|ne|e|se|s|sw|w|nw — and the SAME eight are valid under BOTH hex
  // orientations. Compass directions live in world space, so the vocabulary
  // does not depend on the atlas's hex orientation; walls have rendered
  // axis-true since rpg-toolkit#802, and a prop must be able to stand
  // squarely against a horizontal wall in a pointy-top dungeon whose hex
  // edges have no "n". This deliberately REDEFINES the four diagonal names
  // from #261's hex-edge semantics (pointy-top `ne` pointed at the 30° edge)
  // to true compass (`ne` is 45°) — rpg-project#272 records the ruling and
  // why no shipped content moves. The wire carries the WORD, never an angle:
  // the name-to-yaw map is ONE client-side calibrated table serving both
  // orientations, not something this transport derives or implies.
  //
  // GRID_KIND_SQUARE atlases carry no authored facings TODAY for a supply
  // reason, not a vocabulary one: the single producer of this field — the
  // dungeonspec dialect — authors hex dungeons only. The compass names are
  // grid-independent by construction, so a square authoring path, when one
  // exists, uses these same eight words; nothing here reserves a different
  // set for it.
  //
  // This is deliberately a different shape from `Placement.facing` (dnd5e/
  // api/v1alpha2/encounter/types.proto) — that field is a fixed hex-direction
  // INDEX for a runtime observation's turn-driven orientation; this one is a
  // world-space compass NAME authored in the dungeon builder, and the two
  // vocabularies do not interconvert.
  string facing = 5;

  // offset_x and offset_y are an authored within-cell visual nudge, in
  // BOUNDING-BOX FRACTIONS OF THE CELL: x in cell widths toward east, y in
  // cell heights toward south, each MUST be in [-0.5, 0.5]. Zero (the
  // default for both) means centered — indistinguishable on the wire from
  // "not authored," which is fine: both render identically, at cell center.
  //
  // The unit is now NAMED rather than left as "a fraction of the cell size,"
  // because a hex has two of those: its bounding box is wider than it is tall
  // under one orientation and taller than it is wide under the other, so one
  // fraction is not the other. ONE OFFSET UNIT serves prop offsets, wall ends
  // and door positions alike (rpg-project#360 §1.11); props move to it from
  // circumradius units in the same wave, and the content that would have
  // needed converting is being recreated rather than converted. Comment only:
  // the fields, their tags, their types and their bounds do not move.
  //
  // VISUAL ONLY. The prop still occupies its whole cell for movement and
  // line of sight; nothing that computes rules may read these fields. A WALL
  // end in the authored file wears this same unit and IS mechanical — same
  // shape, different law — but no wall offset reaches this contract: walls
  // arrive here already resolved, as AtlasBoundary pairs and AtlasSegment
  // lines.
  float offset_x = 6;
  float offset_y = 7;

  // offset_z is the authored height of the prop above the floor, as a
  // fraction of cell size, in [0, 3] (rpg-project#272). Zero (the default)
  // means on the floor — indistinguishable on the wire from "not authored,"
  // which is fine: both render identically, on the floor.
  //
  // Deliberately NOT bound to its siblings' within-cell ±0.5 clamp: raising
  // a prop well past one cell-height is the point (a skull onto an altar, a
  // torch onto a sconce line). VISUAL ONLY, like its two siblings.
  float offset_z = 8;

  // The AUTHOR'S NAME for this placement, verbatim from the dungeonspec
  // `place[].id` — the third id the dialect carries, after a region's and a
  // door's (design rpg-project#368 P2). EMPTY WHEN THE AUTHOR NAMED NONE,
  // which is most props: an id is required only by whatever binds to it — a
  // scenario binding, or the Hold verb, which names its target by this id and
  // nothing else. Unique within the dungeon when present; the compiler
  // refuses a collision by name.
  //
  // A HELD PROP IS ABSENT FROM EVERY MEMBER'S ATLAS, not marked held: the
  // atlas is construction truth projected per member, and an object that
  // left the floor left the floor for everyone (design §4.3). There is no
  // `held` flag here on purpose — a flag would be a second answer to a
  // question absence already answers, and a client that drew flagged props
  // would draw furniture nobody can reach. A prop DROPPED after being
  // carried (see Dropped) appears again, at its drop cell rather than its
  // authored one, and carries this same id.
  string id = 9;

  // Whether this prop can be picked up — the author's `holdable` flag,
  // verbatim.
  //
  // STRUCTURE ON THE TRUTH GRAIN (design rpg-project#368 §5, the wire
  // paragraph), which is why it is here rather than left for a client to
  // discover by trying. A holdable thing LOOKS holdable: a reliquary on an
  // altar reads differently from the altar, and every member who can see the
  // cell sees the same thing, so this is not per-member knowledge and nothing
  // about it is concealed.
  //
  // THE CLIENT OFFERS HOLD ONLY WHERE THIS IS TRUE, AND NEVER GUESSES FROM
  // AN ID. A prop carrying an `id` is not thereby holdable — ids exist for
  // anything a scenario binds to, and inferring the verb from the presence of
  // a name would put a Hold button on the altar as readily as on the
  // reliquary. Two independent facts, asked separately. An author who wants a
  // thing to stay scenery simply does not set this.
  //
  // FALSE IS THE DEFAULT AND IT IS THE TRUTH, not a missing answer: a thing
  // nobody declared holdable IS scenery. Plain bool for AtlasProp's own
  // stated reason — an atlas is the projection of a resolved world, and
  // `optional` would invent an unspecified state the producer cannot mean.
  //
  // OFFERING IS NOT PERMISSION. Hold still refuses out of range, already
  // held, or out of turn on the clock, and a prop inside space the member
  // cannot see is absent from this list entirely (the probe law). This field
  // decides what the client DRAWS a button on, never what the server allows.
  bool holdable = 10;
}

// AtlasBoundary is one wall or barrier crossing between adjacent cells. Mirrors
// session.AtlasBoundary. Both endpoints are dungeon-absolute.
message AtlasBoundary {
  Position from = 1;
  Position to = 2;
  // Whether an entity may cross.
  bool blocks_movement = 3;
  // Whether sight may cross.
  bool blocks_line_of_sight = 4;

  // The authored wall-height MULTIPLIER of the standard rendered wall
  // height, verbatim from the dungeonspec `walls[].height`
  // (rpg-project#273), valid in [1, 3] when authored. Zero (the default)
  // means NOT AUTHORED: a reader maps 0 to the STANDARD height — renders
  // exactly as multiplier 1.0 — and never multiplies by the raw field. The
  // YAML bounds make a literal 0 unauthorable, so the wire is unambiguous:
  // "said nothing" and "said 1.0" render identically by design. No pixels on
  // the wire; the client multiplies into its own calibrated wall height.
  //
  // VISUAL ONLY and RAISE-ONLY (Kirk's rulings on rpg-project#274): height
  // never touches Sight or movement — a wall cannot be seen past at ANY
  // height — and no wall may be authored below standard.
  float height = 5;
}

// AxialPoint is one point in the atlas's axial frame, FRACTIONAL.
//
// Position names a CELL; this names a POINT. Wall ends sit on side midpoints
// and cell centres, which land halfway between whole coordinates as often as
// on them, so a pair that only ever holds a cell's own coordinate cannot say
// where a wall begins. Same frame, same origin, same orientation as every
// Position on this seam — a client's axial-to-world formula already accepts
// fractions, so no unit and no second basis crosses the wire.
//
// Minted rather than reusing Position, which is the same two doubles, because
// the type is the sentence "this is not a cell": a reader holding a Position
// may look it up in GetAtlasResponse.cells, and every point here would fail
// that lookup.
message AxialPoint {
  double q = 1;
  double r = 2;
}

// AtlasSegment is one wall AS THE AUTHOR DREW IT: a straight line between two
// points, with the wall's height. Lands AHEAD of its SDK, like Lighting and
// AtlasRegion before it — the toolkit's counterpart arrives with slice 2 of
// rpg-project#360 (wall-geometry design §5.2) and this message is re-verified
// field-for-field when it tags.
//
// PRESENTATION ONLY, AND NO MECHANIC MOVES WITH IT. AtlasBoundary stays the
// whole answer to what a member cannot walk through or see past, and
// AtlasDoorway stays the whole answer to what may be crossed. This list is
// what a client DRAWS.
//
// It exists because the author's line cannot be recovered from the mechanics.
// A client drawing walls today fits a chain through the cell-crossing pairs in
// `boundaries`, and on a hex grid every corner of such a chain turns 60°
// whatever the author actually drew — so the fitted run reports the grid's
// shape, not the wall's (rpg-project#169). A line that cannot be derived has
// to be sent.
//
// A DOOR DRAWS AS A GAP, derived client-side and marked by nothing on the
// wire: the doorway says which crossing opens, the segment says the line it
// opens in, and the gap is where the two meet. That is also how the absence
// law on GetAtlasResponse keeps working — a concealed door a member has not
// found contributes no doorway, so its wall draws as one unbroken segment,
// the same masquerade `boundaries` already performs.
message AtlasSegment {
  // Where the author's line starts.
  AxialPoint from = 1;
  // Where it ends. `from` and `to` are the WHOLE of a wall's geometry: the
  // cells it passes through, the crossings it blocks and the cells it seals
  // are all derived from these two points, and none of them is sent twice.
  AxialPoint to = 2;
  // The wall's height MULTIPLIER of the standard rendered wall height — the
  // same authored number AtlasBoundary.height carries, read the same way: 0
  // means NOT AUTHORED and renders exactly as 1.0, and no reader ever
  // multiplies by the raw field.
  //
  // `float`, THE SAME WIDTH AS AtlasBoundary.height, on purpose. One authored
  // number reaching a client in two widths would not compare equal to itself:
  // a client deriving a door's gap holds the boundary's float32-rounded 0.7
  // beside this one's float64 0.7 and finds them different. `from` and `to`
  // above stay double because they carry fractional positions, where the
  // precision is the point.
  float height = 3;
}

// AtlasDoorway is one crossable cell pair. Mirrors session.AtlasDoorway.
//
// TWO CELLS, NOT TWO ROOMS. Before session v0.10.0 this named a source room, a
// destination room and a cell in each; now it is a connection ID and the two
// adjacent absolute cells it joins. That is the one-map reshape at its sharpest
// — the far side of a doorway is simply the next cell along.
//
// It is also load-bearing for movement rather than decorative: ADJACENCY IS NOT
// PERMISSION. A pair of cells can be perfectly adjacent and still have nothing
// to walk through. A client planning a route must consult this list and not
// just `cells` — a step between two cells that no doorway joins is refused with
// the SDK's ErrNoCrossing.
message AtlasDoorway {
  // 2..5 were from/from_cell/to/to_cell — a room-pair plus a cell in each —
  // until session v0.10.0 made a doorway two absolute cells. `from` and `to`
  // come back below at fresh tags with a new type, so their NAMES are reused
  // and cannot be reserved; the retired tags are, and so are the two names that
  // do not come back.
  reserved 2, 3, 4, 5;
  reserved "from_cell", "to_cell";

  string connection = 1;
  // One of the two cells, dungeon-absolute.
  Position from = 6;
  // The other, adjacent to `from`.
  Position to = 7;
}

// Lighting is a region's light as the assets should render it: an intensity
// slider on top of the region's archetype. Lands AHEAD of its SDK (plan T1/T3,
// rpg-project#256) so toolkit, api and web build in parallel; session.Lighting
// is transcribed from this shape, not the other way round, until it tags.
//
// Carried from the author UNREAD by the composition: the encounter passes it
// through to the atlas and never consults it. What an intensity MEANS to
// perception — whether 0.2 is "dim light" and what dim light does to a
// Perception check — is a rule, and lives in the rulebook, not in a number on
// the wire. This field says how bright the assets should draw the hall; the
// rulebook decides what that costs a member standing in it.
message Lighting {
  // 0..1. 0 is dark, 1 is the archetype's full light.
  double intensity = 1;
}

// AtlasRegion is a named set of absolute cells carrying the per-area facts no
// rule can derive: which cells, what archetype dresses it, how bright it is.
// Dungeon-absolute. Like Lighting, AHEAD of its SDK: session.AtlasRegion
// arrives with plan T3 and is re-verified field-for-field when it tags.
//
// REGIONS REPLACE ROOMS (rpg-project PR #255). Nothing past the authored file
// has a room: no origin, no room-local frame, no chain. A region is only a
// name over a set of cells that already exist in `cells` above, and no cell
// belongs to two regions — a floor cell in none of them is SCENERY, see
// GetAtlasResponse.regions. Walls are declared, not implied by regions — see
// GetAtlasResponse.boundaries; two regions side by side are one open space
// until somebody draws the seam.
//
// Regions are on the atlas because lighting is a WORLD FACT, not a render
// hint. A client that cannot read "this hall is dark" off the wire
// re-derives it by experiment — the same argument that put `layout` here
// (ADR-0040) and `Seen` on Sighting (ADR-0041). Audio will be a second field
// on this message when it arrives.
message AtlasRegion {
  string id = 1;
  string name = 2;
  // The region's cells, absolute axial (q, r), sorted by coordinate — the
  // SAME frame and the same comparator as GetAtlasResponse.cells. Not a
  // bounding box, not a rectangle: exactly the cells, so a client tests
  // membership and never infers it.
  repeated Position cells = 3;
  // archetype is a presentation ref the assets resolve — lighting kind, audio
  // profile — e.g. "crypt".
  //
  // LAW: AN ARCHETYPE NEVER DECIDES MECHANICS. Not start, not blocking, not
  // sight, not intensity. The dialect this replaces had an archetype that
  // silently chose where the party stood — "entrance" meant spawn here — and
  // that is the rpg-toolkit#1033 trap and why it was deleted: a word meant
  // for the renderer had grown a rule nobody could see from the file. This
  // one may only say what the assets show and play. Where the party starts
  // is `start` in the file; what blocks is a wall or a prop; how bright it
  // is, is `lighting`.
  string archetype = 4;
  Lighting lighting = 5;
}

// AtlasExit is one authored way out of the dungeon: an id and a floor cell.
//
// STRUCTURE, NOT SCENARIO. A dungeon has ways out whatever the party came
// for, so exits sit in the atlas beside cells and regions rather than inside
// whatever scenario happens to be bound (design rpg-project#368 §3.1, and §5's
// wire paragraph). Same shape as the file's `start`, and the same for every
// member: an exit is not concealable and nothing here is per-member knowledge.
//
// FOR DRAWING THE WAY OUT, NOT FOR GATING IT. Leave is offered everywhere and
// the SERVER decides what a departure means — R9 REQUIRES a departure from
// the vault to be possible, because that is the departure that drops the
// artifact where the carrier stood. A client that only offered Leave at these
// cells would make R9 unreachable. So this list says where the way out IS;
// when the member happens to stand on one, the button may say so.
//
// NOTHING IS DEFAULTED INTO IT. `start` is not implicitly an exit: a dungeon
// whose entrance is also its exit says so, by authoring one here.
message AtlasExit {
  // The author's id for this exit — the dungeon file's `exits[].id`, which
  // is what a scenario binds to and what Exited.exit reports.
  string id = 1;
  // The floor cell a member stands on to use it, dungeon-absolute.
  Position at = 2;
}

// AtlasStart is where the party comes in, and which way they are looking
// when they get there.
//
// THE AUTHORED START, verbatim from the dungeon file's `start`. The same for
// every member, like AtlasExit beside it: where a dungeon begins is not
// concealable and nothing here is per-member knowledge.
//
// FOR AIMING THE CAMERA, NOT A RULE. `facing` exists because a party that
// spawns looking at the back wall spends its first seconds spinning around
// (Kirk, walking the build). A client that spawns a member here points the
// camera the authored way and the player starts looking at the room they
// came to see. NOTHING GATES ON IT: it does not decide where a member may
// walk, what they can see, or which way anything is oriented mechanically.
// It is a presentation fact, and a client that ignores it renders a correct
// dungeon with a worse first second.
message AtlasStart {
  // The floor cell the party comes in on, dungeon-absolute.
  Position at = 1;

  // The authored starting facing, verbatim from the file. EMPTY MEANS THE
  // AUTHOR STATED NONE — the zero value telling the truth, not a hidden
  // default — and a client that finds it empty aims the camera exactly as it
  // does today.
  //
  // When present it is one of the EIGHT true-compass names —
  // n|ne|e|se|s|sw|w|nw — the SAME vocabulary and the same eight words
  // AtlasProp.facing already carries, redefined to true compass by
  // rpg-project#272. Read that field's comment for the whole law; the short
  // version is that compass directions live in world space, so the words do
  // not depend on the atlas's hex orientation, and the wire carries the WORD
  // and never an angle. The name-to-yaw map is one client-side calibrated
  // table serving both orientations.
  //
  // AN OPEN STRING, matching AtlasProp.facing rather than inventing an enum
  // beside it. One vocabulary, one shape: a client that already maps a prop's
  // facing to a yaw maps this one with the same table and no second branch.
  string facing = 2;
}

// =============================================================================
// Doors
// =============================================================================

// DoorState is what a door is doing right now.
//
// A door's state is ENCOUNTER STATE, NOT ATLAS GEOMETRY. GetAtlas carries a
// door's edges (AtlasDoorway — construction truth, cached once); this enum is
// the live half, read via GetDoors and updated from DOOR events. A door is one
// state over a set of edges (rpg-toolkit#1123): every edge of a wide gate
// opens and locks together.
enum DoorState {
  DOOR_STATE_UNSPECIFIED = 0;
  DOOR_STATE_OPEN = 1;
  DOOR_STATE_CLOSED = 2;
  DOOR_STATE_LOCKED = 3;
}

// CheckApproach is one accepted route through an authored check: an ability
// or skill, maybe a tool, and the DC that route must beat.
//
// A CHECK IS A LIST OF THESE, NOT ONE ABILITY AND ONE DC (ruled on
// rpg-project#350): a locked door is forced with Strength or picked with
// Dexterity and tools; a concealed door is spotted with Perception or
// reasoned out with Investigation. Success by any listed approach, and the
// author prices each route separately. No approach choice is pushed to the
// player in this slice — the resolver applies the attempting character's
// best listed approach; a sheet-driven choice is its own later design
// round, and this shape already carries the vocabulary that round would
// read.
message CheckApproach {
  // Opaque rulebook ref for the ability or skill this approach rolls, e.g.
  // "str", "dex", "perception", "investigation". Carried, not interpreted —
  // what the ref means is the rulebook's, exactly as the single-approach
  // lock held its `ability` opaquely.
  string ability = 1;
  // Opaque item ref for a named tool, e.g. "dnd5e:item:thieves-tools".
  // Empty when the approach names none — the reference tomb's lock does not.
  string tool = 2;
  // What this route must beat. Per approach, not per check: forcing the
  // door and picking its lock need not cost the same.
  int32 dc = 3;
}

// DoorLock is an authored lock, carried not interpreted.
//
// The DCs are public knowledge down to the number — full data until v1.0
// (rpg-project#269 §0), and so is an attempt's rolled total (UnlockResponse,
// DoorChanged). The told-not-compared law is about a different boundary: the
// session rolls the check and the toolkit COMPOSITION learns only the
// verdict, never the total — what the composition may know and what the wire
// shows are separate questions, and this paragraph answers only the first.
//
// 1..3 were dc/ability/tool — one approach, flat on the message — until the
// multi-approach ruling (rpg-project#350, this repo's #266) made a check a
// list of accepted approaches. An in-place break, consumers moved in the
// same wave, per the proto-versioning trigger (few consumers, one sitting).
message DoorLock {
  reserved 1, 2, 3;
  reserved "dc", "ability", "tool";

  // The accepted ways through, each with its own DC. An authored lock lists
  // at least one; an attempt resolves through exactly one of them (the
  // character's best — see CheckApproach), which is the approach whose DC
  // UnlockResponse and DoorChanged report.
  repeated CheckApproach approaches = 4;
}

// DoorInfo is one door's identity and live state.
message DoorInfo {
  // The same id AtlasDoorway.connection carries — join the two to know
  // WHERE the door is; this message says WHAT it is doing.
  string door = 1;
  DoorState state = 2;
  // Set only while state is LOCKED.
  DoorLock lock = 3;
}
