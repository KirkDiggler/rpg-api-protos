syntax = "proto3";

package dnd5e.api.authoring.v1alpha1;

import "dnd5e/api/session/v1alpha1/service.proto";

option go_package = "github.com/KirkDiggler/rpg-api-protos/gen/go/dnd5e/api/authoring/v1alpha1;authoringpb";
option java_multiple_files = true;
option java_package = "com.kirkdiggler.rpg.api.dnd5e.authoring.v1alpha1";

// AuthoringService is the in-game dungeon builder's seam: write a world file,
// get back the world the game will play.
//
// THIS IS THE SECOND AuthoringService AT THIS PATH, AND A REPLACEMENT, NOT A
// REVISION (rpg-project PR #255, slice rpg-project#256). The first described
// the room-chain dialect — `FloorPlan`, `door_row`, `start_column`, an
// `archetype` that silently chose where the party stood — and its only server
// was deleted with the old encounter module in rpg-api#801. Under
// no-backcompat there is nothing to stay compatible with, so the old shapes
// are gone rather than reserved: there is no wire to keep safe, and carrying
// a dead dialect beside a live one is the Rule 1 violation this repo already
// pays for once.
//
// The one idea that survives from the first cut is the transport decision:
// a malformed REQUEST is a gRPC status, a file that fails to COMPILE is a
// body. See PutDungeonRequest.
//
// There is no DeleteDungeon. Not now: nothing in the builder's first loop
// (draw, validate, save, play, reopen) deletes, and an RPC with no caller is
// the Rule 4 violation this repo is still paying down elsewhere.
service AuthoringService {
  // PutDungeon compiles a dungeon file and, unless validate_only, stores it
  // under its key so StartEncounter can find it. Either way it answers with
  // the compiled atlas — the same GetAtlasResponse the game plays from.
  //
  // Gated server-side by RPG_AUTHORING_ENABLED: with the gate off the RPC is
  // not registered and callers see Unimplemented, which is how a client tells
  // "authoring is off" from "server unreachable". The gate lives in rpg-api,
  // not here.
  rpc PutDungeon(PutDungeonRequest) returns (PutDungeonResponse);
  // GetDungeon returns the stored file for a key so an author can reopen it.
  // Unknown key is NotFound. Ungated: reading content mutates nothing.
  rpc GetDungeon(GetDungeonRequest) returns (GetDungeonResponse);
}

// PutDungeonRequest carries one dungeon file, in its authored form.
//
// `key` is `[a-z0-9-]` and MUST equal the YAML's own `key:` line — the
// request names the file and the file names itself, and they may not
// disagree. A key outside the charset, or a mismatch, is a malformed request:
// gRPC InvalidArgument, no body. There is no meaningful atlas or error list
// for a request that could not name its target, and a non-OK status never
// delivers a body anyway, so pretending otherwise would only drop it.
//
// A well-formed request whose YAML fails to compile is NOT an error status.
// It answers OK with `errors` populated and `atlas` unset — the builder's
// inline-error path, where the author needs the list, not a status code.
message PutDungeonRequest {
  string key = 1;
  // The dungeon file, verbatim UTF-8 text. The server compiles exactly this
  // text and stores exactly this text; it never re-marshals, so what an author
  // wrote (comments, ordering, spacing) is what GetDungeon hands back.
  string yaml = 2;
  // validate_only compiles and answers without writing anything. This is the
  // builder's per-edit preview, and it NEVER refuses a half-drawn map: a file
  // with no start cell, a region with no cells, a wall between nowhere and
  // nowhere all come back as `errors`, not as a status. The author is in the
  // middle of drawing; the service's job is to say what is wrong so far.
  bool validate_only = 3;
}

// PutDungeonResponse is delivered only on gRPC OK (see PutDungeonRequest for
// the status side). Two shapes, told apart by `errors`:
//
//   - `errors` empty: the file compiled. `atlas` is set, and if the request
//     was not validate_only the file is stored under its key.
//   - `errors` non-empty: the file did not compile. `atlas` is unset and
//     nothing was written.
//
// There is no `bool success`: an empty error list IS success, and a flag that
// could disagree with it would be a second source of truth.
message PutDungeonResponse {
  // Every problem the compiler found, each naming the YAML path it is about.
  // A list, not one flat message, because an author fixing a map needs to see
  // all of it at once — the cell that is in two regions AND the wall whose
  // endpoints are not adjacent — not one complaint per round trip.
  repeated FieldError errors = 1;
  // THE SAME MESSAGE THE GAME PLAYS FROM. The builder draws what PutDungeon
  // returns, and what PutDungeon returns is the AUTHOR'S view — what
  // GetAtlas would answer an all-knowing member once a session starts on
  // this file (GetAtlas is member-scoped for concealed structure; an
  // author already knows everything they drew) — one message type, one
  // producer, one geometry. The first AuthoringService answered with its
  // own `FloorPlan`, a builder-shaped second projection of the world that had to be kept in
  // step with the atlas by hand; the moment the two disagreed the builder
  // was lying. Returning the atlas itself leaves the builder nothing to keep
  // in step.
  dnd5e.api.session.v1alpha1.GetAtlasResponse atlas = 2;
}

// FieldError is one compile problem and the YAML path it is about.
//
// `path` is the author's coordinate system, not the compiler's: a path into
// the file as written, so the builder can point at the thing. Examples:
// "regions[1].cells[0][3]", "walls[3]", "place[7].blocks_los", "start".
// Empty means the problem is the file as a whole (it did not parse).
message FieldError {
  string path = 1;
  string message = 2;
}

// GetDungeonRequest names a stored dungeon by key.
message GetDungeonRequest {
  string key = 1;
}

// GetDungeonResponse is the stored file.
message GetDungeonResponse {
  // The stored file, VERBATIM UTF-8 TEXT — never a re-marshal. An author reopening
  // a map gets back exactly what they saved: their comments, their ordering,
  // their spacing. A server that round-tripped the file through its own
  // model would hand back its opinion of the file instead of the file.
  string yaml = 1;
}
