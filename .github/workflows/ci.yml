name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Default pull_request types are [opened, synchronize, reopened]; adding
    # labeled/unlabeled lets the breaking-change-approved override (see the
    # "Breaking change detection" step) take effect when the label is applied
    # *after* the PR is opened. Without this, applying the label later doesn't
    # retrigger CI and the breaking step keeps failing on its first run.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: write
  packages: write

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      
      - name: Lint
        run: buf lint
      
      - name: Format check
        run: buf format --diff --exit-code
      
      - name: Breaking change detection
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'breaking-change-approved')
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main"

      - name: Breaking change override notice
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'breaking-change-approved')
        run: |
          echo "::warning::buf breaking skipped — PR carries 'breaking-change-approved' label."
          echo "::warning::Per docs/how-to/breaking-change-workflow.md, this is acceptable for alpha packages with explicit reviewer ack, or when a version bump (e.g. v1alpha1→v1alpha2) is the chosen migration path."

  generate-and-test:
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v4
        with:
          go-version: '1.25'
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Test refgen tool
        run: cd tools/refgen && go test ./...

      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@latest

      - name: Generate code
        run: buf generate
      
      - name: Generate mocks
        run: make mocks
      
      - name: Verify Go generation
        run: |
          cd gen/go
          # Just verify the files were generated correctly
          find . -name "*.pb.go" -o -name "*.connect.go" | head -10
          echo "✓ Go files generated successfully"
      
      - name: Install TypeScript dependencies
        run: npm ci
      
      - name: Test TypeScript compilation
        run: |
          npx tsc --noEmit --project tsconfig.json
      
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-code
          path: gen/

  publish-packages:
    runs-on: ubuntu-latest
    needs: [lint-and-format, generate-and-test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: actions/setup-go@v4
        with:
          go-version: '1.25'
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
      
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      
      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@latest

      - name: Generate all code
        run: |
          buf generate
          make mocks
      
      - name: Setup Go module
        run: |
          cd gen/go
          go mod init github.com/KirkDiggler/rpg-api-protos/gen/go
          go mod tidy
      
      - name: Create release branch
        run: |
          # Create or update release branch with generated code
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create release branch
          git checkout -B generated
          
          # Remove gen/ from gitignore temporarily
          sed '/^gen\/$/d' .gitignore > .gitignore.tmp && mv .gitignore.tmp .gitignore
          
          # Add generated code
          git add gen/
          git add .gitignore
          
          # Commit if there are changes
          git diff --staged --quiet || git commit -m "chore: update generated code and mocks"
          
          # Push release branch
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" generated --force
          
          # Fetch all tags from origin
          git fetch --tags origin
          
          # Get the latest root tag and increment it. Module-qualified tags do
          # not participate in the release version clock.
          LATEST_TAG="$(git tag -l 'v*' | sort -V | tail -1)"
          if [ -z "$LATEST_TAG" ]; then LATEST_TAG="v0.0.0"; fi
          NEW_TAG="$(printf '%s\n' "$LATEST_TAG" | awk -F. '{$NF = $NF + 1;} 1' | sed 's/ /./g')"
          GO_MODULE_TAG="gen/go/$NEW_TAG"
          GENERATED_COMMIT="$(git rev-parse HEAD)"
          
          echo "Latest root tag: $LATEST_TAG"
          echo "New root tag: $NEW_TAG"
          echo "New Go module tag: $GO_MODULE_TAG"
          
          # Keep the root release tag and add the nested-module tag on the
          # exact same generated commit.
          git tag -a "$NEW_TAG" -m "Generated code for $NEW_TAG" "$GENERATED_COMMIT"
          git tag -a "$GO_MODULE_TAG" -m "Generated Go module for $NEW_TAG" "$GENERATED_COMMIT"

          # Validate the module/tag shape and both annotated tag targets before
          # publishing either tag.
          MODULE_PATH="$(cd gen/go && go list -m)"
          REPOSITORY_MODULE_PATH="github.com/${{ github.repository }}"
          EXPECTED_MODULE_PATH="$REPOSITORY_MODULE_PATH/gen/go"
          if [ "$MODULE_PATH" != "$EXPECTED_MODULE_PATH" ]; then
            echo "Expected Go module $EXPECTED_MODULE_PATH, found $MODULE_PATH" >&2
            exit 1
          fi
          MODULE_TAG_PREFIX="${MODULE_PATH#"$REPOSITORY_MODULE_PATH/"}"
          EXPECTED_GO_MODULE_TAG="$MODULE_TAG_PREFIX/$NEW_TAG"
          if [ "$GO_MODULE_TAG" != "$EXPECTED_GO_MODULE_TAG" ]; then
            echo "Expected Go module tag $EXPECTED_GO_MODULE_TAG, found $GO_MODULE_TAG" >&2
            exit 1
          fi
          for TAG in "$NEW_TAG" "$GO_MODULE_TAG"; do
            if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
              echo "Expected annotated tag: $TAG" >&2
              exit 1
            fi
            if [ "$(git rev-parse "$TAG^{}")" != "$GENERATED_COMMIT" ]; then
              echo "Tag $TAG does not point to generated commit $GENERATED_COMMIT" >&2
              exit 1
            fi
          done

          git push --atomic "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            "refs/tags/$NEW_TAG" "refs/tags/$GO_MODULE_TAG"
          
          # Export both tag names for later steps.
          {
            echo "NEW_TAG=$NEW_TAG"
            echo "GO_MODULE_TAG=$GO_MODULE_TAG"
          } >> "$GITHUB_ENV"
      
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
      
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Copy generated TypeScript to package root
          cp -r gen/ts/* .
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}