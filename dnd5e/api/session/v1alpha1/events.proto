syntax = "proto3";

package dnd5e.api.session.v1alpha1;

import "dnd5e/api/session/v1alpha1/types.proto";

option go_package = "github.com/KirkDiggler/rpg-api-protos/gen/go/dnd5e/api/session/v1alpha1;sessionpb";
option java_multiple_files = true;
option java_package = "com.kirkdiggler.rpg.api.dnd5e.session.v1alpha1";

// Read from session/v0.18.0; typed event bodies from the combat-turn contract
// (rpg-project#249) — they land with rpg-toolkit#941.

// EventKind names what an event reports. Mirrors session.EventKind.
//
// A proto enum, because the SDK says so in as many words: it models EventKind as
// a string enum rather than free-form prose precisely because "it maps directly
// onto a proto enum", and it is the field clients branch on.
//
// Read from session/v0.18.0, WITH THE FIRST RETIREMENT: the vocabulary held
// UNCHANGED across v0.9.0 -> v0.13.0 (the one-map reshape and the Where read
// added no beat and removed none), then v0.18.0 both dropped TRAVERSED and
// added DOWNED — see each below for why. The set has grown since (DOOR,
// rpg-project#269; DOOR_REVEALED, rpg-api-protos#266) and will again, so a
// client pinned to an older set must be re-read rather than counted.
//
// Removing a kind is the compatible half of that pair only because nothing can
// produce it: TRAVERSED's number and name are RESERVED here, so no future beat
// can silently inherit either. A client still holding the old generated enum
// keeps a symbol nothing will ever send, which is a dead branch, not a
// misreading. That is the strongest guarantee available for a removal, and it
// is why the removal is safe to make while the deliberate ambiguity of REUSING
// the tag would not be.
//
// The vocabulary is OPEN TO GROWTH, which is a property of proto3 enums rather
// than something this file has to build: an unrecognised number is PRESERVED on
// the wire and readable by the receiver (`EventKind(37)` in Go, the raw number
// in @bufbuild/es), never dropped and never a parse failure. So a kind the
// combat train adds (rpg-toolkit#959) reaches an old client intact, and that
// client's `seq` accounting keeps working — which is the whole point of the
// SDK's delivered-not-dropped rule. Adding a kind is compatible; changing what
// an existing one means is not.
//
// A parallel `string kind_raw` was considered and rejected: it has no SDK
// counterpart, and design rule 1 makes inventing one a design change rather than
// a transcription. The enum already carries what a passthrough string would.
//
// UNSPECIFIED and UNKNOWN are different things, and the split follows the
// house precedent set by HexState in the v1alpha2 encounter package:
//   - UNSPECIFIED (0) means the producer failed to set a kind. A defect.
//   - UNKNOWN mirrors the SDK's own session.EventUnknown — a beat THIS VERSION
//     of the toolkit does not recognise, delivered on purpose rather than
//     dropped so the recipient still learns its sequence advanced. Dropping it
//     would manufacture a gap and trigger a resync that was never needed.
enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;

  // A member stepped to a new cell.
  EVENT_KIND_MOVED = 1;
  // 2 was EVENT_KIND_TRAVERSED: a member's step carried them through a doorway.
  //
  // IT OUTLIVED THE VERB, THEN THE BEAT OUTLIVED IT. There has been no Traverse
  // RPC since session/v0.12.0, and this kind stayed distinct from MOVED through
  // that reshape on the SDK's own argument — ONE MAP DOES NOT MEAN ONE
  // NARRATION. session/v0.18.0 retired it anyway, for the reason that argument
  // could not answer: the composition stopped EMITTING the beat. A crossing is
  // written like any other step now (rpg-toolkit#1048, #1059), which was the
  // point of absolute coordinates, so nothing upstream can tell the two apart.
  // A kind nothing can produce is worse than no kind at all — it reads as a
  // contract.
  //
  // The information is not lost, only moved. GetAtlasResponse.doorways lists
  // every crossable pair, so a step whose from/to matches one IS a traversal,
  // and a client that draws a doorway differently from a corridor derives it
  // there. Restoring the distinction means deriving it, not waiting for a beat
  // that is not coming.
  reserved 2;
  reserved "EVENT_KIND_TRAVERSED";
  // A member entered the encounter.
  EVENT_KIND_JOINED = 3;
  // A member left the encounter.
  EVENT_KIND_EXITED = 4;
  // The encounter closed.
  EVENT_KIND_ENDED = 5;
  // The encounter's opening beat.
  EVENT_KIND_SCENE_OPENED = 6;
  // The clock advanced.
  EVENT_KIND_TICK = 7;
  // A member's turn in a fight ended and the order moved on.
  EVENT_KIND_TURN_ENDED = 8;
  // Two sides came into contact and a fight began, with its initiative order.
  // Every member of the encounter hears it, not only the ones in the fight: a
  // fight is localized (the rest of the party keeps free-roaming) but it is not
  // secret, and a client that learned of it only from the fighters' own
  // responses could not render the party's shared view of the scene.
  EVENT_KIND_FIGHT_STARTED = 9;
  // A fight dissolved and its members returned to free roam.
  EVENT_KIND_FIGHT_ENDED = 10;
  // An attack landed. The payload carries the numbers behind it — the roll,
  // what it totalled, what it had to reach, and how much was done.
  EVENT_KIND_STRUCK = 11;
  // An attack did not land. Two kinds rather than one with a hit flag, because
  // a client branches on them: a landed blow and a whiffed one are different
  // animations, different sounds, and different things to say. A miss omits the
  // damage key rather than reporting zero — "missed for 0" reads as a hit that
  // did nothing.
  EVENT_KIND_MISSED = 12;
  // A member is DOWNED: at zero hit points, with Attack and Move blocked. The
  // member remains in initiative and End Turn remains governed only by the
  // clock/turn gate. The opposite state is UP.
  //
  // DOWNED rather than "down" because a bare "down" also reads as PRONE, and
  // prone is a different thing entirely — a posture condition the rulebook
  // tracks, still in the fight and still acting. A client narrating the two the
  // same way would say somebody died every time they were knocked flat (Kirk's
  // ruling, rpg-toolkit#1084).
  //
  // Kind and who, and nothing else: hit points are NOT on this beat. What a
  // client renders is somebody down; how much damage produced it is a separate
  // question with its own answer (ruled fork (d) on rpg-toolkit#959).
  //
  // Nobody announces it — the world NOTICES it. There is no downing verb and no
  // way to push this beat in: the composition asks the rulebook who is standing
  // at every sight refresh (rpg-toolkit#1077), so it arrives on whatever verb
  // happened to refresh sight, frequently NOT the verb that dealt the damage.
  //
  // There is deliberately no kind for coming back up. Nothing in v1 can revive
  // a downed member, so a kind for it would be vocabulary against a future
  // nobody has built; it earns its own name when death saves arrive.
  //
  // Read this one alongside STRUCK and MISSED — same family, same audience, and
  // a client reads all three side by side while narrating one exchange.
  EVENT_KIND_DOWNED = 13;
  // A door changed — opened, closed, or an unlock attempt, beaten or not. A
  // failed attempt is as much fiction as a beaten one, and the composition
  // writes both through one path. Every member WHO KNOWS THE DOOR hears it:
  // for a door that was never concealed that is every member (full data
  // until v1.0), and for a concealed one it is exactly the members it has
  // been revealed to — scoped as far as concealed structure requires and no
  // further. A member's first knowledge of a door is never this kind; it is
  // DOOR_REVEALED, below.
  EVENT_KIND_DOOR = 14;
  // A door entered THIS RECIPIENT'S knowledge — found by their own search,
  // or opened in their presence. Recipient-scoped by design: a concealed,
  // unknown door is ABSENT from a non-knower's wire (GetDoors, GetAtlas —
  // absence, not a flag), so the beat that introduces it carries everything
  // the client needs to patch its cached view — the load-once,
  // beat-refreshed law (rpg-project#264). This is rpg-toolkit#1020's shelf
  // coming due for doors, per the standing ruling that detection beats are
  // per-player from birth.
  EVENT_KIND_DOOR_REVEALED = 15;

  // A beat the producing toolkit version does not recognise. See the enum
  // comment: deliberately delivered, and NOT the same as UNSPECIFIED.
  EVENT_KIND_UNKNOWN = 100;
}

// Event is one thing that happened, addressed to one recipient. Mirrors
// session.Event field-for-field (design rule 3), which the SDK shaped flat and
// non-polymorphic for exactly this mapping: no interface-valued fields, no type
// switches on the wire, and no payload shape that varies by kind in a way a
// generated client cannot express.
//
// PER-RECIPIENT, NOT PER-OCCURRENCE. The same underlying beat becomes several
// Events, one per viewer who may know about it, and their payloads may differ.
// Projection is a rule decided where perception lives — inside the toolkit.
// rpg-api neither filters nor re-derives visibility (design rule 4); a host that
// filtered a single shared payload would be reimplementing perception, and its
// first mistake would leak fog of war.
message Event {
  // The session this event belongs to.
  string session = 1;
  // The story sequence this event was derived from: monotonic, gapless, and
  // never renumbered. A recipient that notices a gap has missed an event and
  // re-queries GetStory from its last known value (design rule 6 — delivery is
  // best-effort, the story log is truth, and the stream carries no replay
  // obligation).
  uint64 seq = 2;
  // The clock reading when the underlying beat was recorded. The world's clock,
  // not a wall time — hence uint64 rather than google.protobuf.Timestamp, which
  // is what the neighbouring v1alpha2 encounter stream uses for its own
  // (differently defined) timestamp.
  uint64 at = 3;
  // Groups cause and effect across events. Empty is legal.
  string correlation = 4;
  // The member this projection is addressed to. StreamEvents only ever delivers
  // events whose recipient is the subscribing member (see StreamEventsRequest),
  // so this is an assertion the client can check rather than a filter it applies.
  string recipient = 5;
  // What happened.
  EventKind kind = 6;
  // The kind-specific body, encoded by the toolkit. PASSTHROUGH: rpg-api
  // round-trips these bytes and never builds or inspects them.
  //
  // REMAINS FOR KINDS NOT YET TYPED. For every kind that has a member of
  // `body` below, the body is the beat and this is at most the same facts in
  // the toolkit's own encoding. A CLIENT READS `body` AND NEVER DECODES
  // `payload` — not as a fallback, not for a field it wishes were typed. A
  // fact a client needs that only `payload` carries is a missing body field
  // and goes through the design, the way Seen did for Sighting (ADR-0041).
  bytes payload = 7;

  // The beat, typed. Lands with rpg-toolkit#941 — beats record a declared
  // kind and a typed body, and the session seam projects them, replacing the
  // "TEMPORARY SHAPE" where session's kindOf unmarshalled the JSON payload to
  // learn what it was carrying. Done properly rather than bridged (Kirk,
  // rpg-project#249 §6): nothing here is a stopgap to be thrown away later.
  //
  // ONE-TO-ONE WITH `kind` where a body exists: a TURN_ENDED event carries
  // turn_ended, and so on down the list. A kind with no body member here
  // (SCENE_OPENED, TICK, UNKNOWN) leaves this unset and is read from `kind`
  // alone — those beats are not narrated from facts a client needs typed,
  // yet. Adding one is one additive oneof member — which is how JOINED and
  // EXITED got theirs (rpg-project#260), and how ENDED and DOOR got theirs
  // (rpg-project#269).
  //
  // Tags start at 10 to leave room beside the spine; 8 and 9 are unassigned.
  oneof body {
    TurnEnded turn_ended = 10;
    Downed downed = 11;
    Struck struck = 12;
    Missed missed = 13;
    FightStarted fight_started = 14;
    FightEnded fight_ended = 15;
    Moved moved = 16;
    Joined joined = 17;
    Exited exited = 18;
    Ended ended = 19;
    DoorChanged door = 20;
    DoorRevealed door_revealed = 21;
  }
}

// =============================================================================
// Typed bodies — one per kind a client narrates from
// =============================================================================
//
// Every id below is a member id, the same vocabulary Participant.member and
// Sighting.subject speak; a client that needs a name joins against
// TurnResponse.participants or Sighting.name. Bodies carry FACTS, not prose:
// "You hit skeleton-1 — 17 vs AC 13, 6 slashing" is rendered by the client
// from Struck, and the server never writes a sentence.

// TurnEnded: a member's turn ended and the order moved on (EVENT_KIND_TURN_ENDED).
//
// This is also "X's turn" as a moment: one of these per driven member, so the
// monster's turn is a visible beat ("skeleton-1's turn", then whatever its
// driver did) rather than a gap between two of the player's. Pacing is the
// client's (rpg-dnd5e-web#561).
message TurnEnded {
  // Whose turn ended.
  string member = 1;
  // Whose turn it is now — the same answer EndTurnResponse.next gives the
  // member who ended it, here for everyone else.
  string next = 2;
}

// Downed: a member is at zero hit points with Attack and Move blocked, while
// End Turn remains governed only by clock/turn (EVENT_KIND_DOWNED). Who, and
// nothing else — see the kind's own doc for why hit points are not here.
message Downed {
  string member = 1;
}

// DamageComponent is one ordered source-attributed input to resolved damage.
message DamageComponent {
  string source = 1;
  string source_ref = 2;
  string dice = 3;
  repeated int32 final_rolls = 4;
  int32 flat_bonus = 5;
  DamageType damage_type = 6;
  // Presence distinguishes an additive component from immunity's real zero.
  optional double multiplier = 7;
}

// AttackModifierSource identifies one source of advantage or disadvantage.
message AttackModifierSource {
  string source_ref = 1;
  string source_id = 2;
}

// Struck: an attack landed (EVENT_KIND_STRUCK). The numbers AttackResponse
// gives the attacker, here for every witness, plus what was swung.
message Struck {
  string attacker = 1;
  string target = 2;
  // The d20 as rolled.
  int32 roll = 3;
  // The roll plus everything the attack chain added.
  int32 total = 4;
  // The number the total had to reach.
  int32 against = 5;
  // What was dealt. Never zero on a Struck; a miss is a Missed.
  int32 damage = 6;
  // What was swung. Must equal the selected Declaration.attack and the
  // corresponding AttackResponse.attack. Lands with rpg-toolkit#866.
  AttackRef attack = 7;
  bool critical = 8;
  repeated DamageComponent damage_components = 9;
  repeated AttackModifierSource advantage_sources = 10;
  repeated AttackModifierSource disadvantage_sources = 11;
  // Set when this strike was a reaction rather than a declared action — an
  // opportunity attack lands here, during somebody else's turn. Absent on an
  // ordinary swing, which is how a witness tells the two apart.
  ReactionRef reaction = 12;
}

// Missed: an attack did not land (EVENT_KIND_MISSED). A separate body rather
// than Struck with damage 0, for the reason the kinds are separate — a whiff
// is a different animation, sound and sentence — and it carries no damage
// field at all so "missed for 0" cannot be said.
message Missed {
  string attacker = 1;
  string target = 2;
  int32 roll = 3;
  int32 total = 4;
  int32 against = 5;
  // What was swung. Must equal the selected Declaration.attack and the
  // corresponding AttackResponse.attack. Lands with rpg-toolkit#866.
  AttackRef attack = 6;
  // Set when this strike was a reaction rather than a declared action — see
  // Struck.reaction. A missed opportunity attack is still worth naming: the
  // reactor spent their reaction on it.
  ReactionRef reaction = 7;
}

// FightStarted: two sides came into contact and a fight began
// (EVENT_KIND_FIGHT_STARTED). Delivered to every member of the encounter, in
// or out of the fight — see the kind.
message FightStarted {
  // The fight's members in initiative order, first to act first — the same
  // list Formed.order hands the member whose verb started it.
  repeated string members = 1;
}

// FightEnded: a fight dissolved and its members returned to free roam
// (EVENT_KIND_FIGHT_ENDED). `cause` says why, in the same enum
// DissolveResponse.cause speaks: BY_DECISION when somebody disengaged,
// BY_DEFEAT when a side ran out of standing members. TurnResponse.clock flips
// to WORLD on the same beat.
message FightEnded {
  DissolveKind cause = 1;
}

// Moved: a member stepped to a new cell (EVENT_KIND_MOVED). Dungeon-absolute,
// like every position on this seam. One body per step — a walk of four cells
// is four of these, each with its own seq.
message Moved {
  string member = 1;
  Position to = 2;
}

// Joined: a member entered the encounter (EVENT_KIND_JOINED). Who, and nothing
// else. This kind was read from `kind` alone until rpg-project#260: without a
// body a witness learns an arrival happened but not whose, and the feed showed
// exactly that — kind and no subject (rpg-dnd5e-web#786).
message Joined {
  // Who entered.
  string member = 1;
}

// Exited: a member left the encounter (EVENT_KIND_EXITED). The mirror of
// Joined, for the mirror reason: a departure without a name is not narratable.
message Exited {
  // Who left.
  string member = 1;
}

// Ended: the encounter closed (EVENT_KIND_ENDED). The key of the declared
// ending that fired — "boss-down", "withdrawn", "abandoned". Keys are content
// strings, not an enum: what an ending MEANS is authored, and the client maps
// key to sentence (rpg-project#269 §6.3). The full outcome — where everybody
// stood — is GetStatus's answer. This beat arrives on the WORLD clock: the
// bubble dissolves before the encounter closes (rpg-project#269 §6.6), so
// FIGHT_ENDED precedes it.
message Ended {
  string ending = 1;
}

// DoorChanged: a door changed (EVENT_KIND_DOOR) — opened, closed, or an
// unlock attempt. Delivered only to members who know the door — see the
// kind; a member learning of the door for the first time gets DoorRevealed
// instead, on the same underlying beat.
message DoorChanged {
  string door = 1;
  DoorState state = 2;
  // Who did it. Empty when nobody did — authored state reported at open.
  string actor = 3;
  // dc, total and beaten are set only on unlock-attempt beats — the
  // composition's door beat carries them on those and nothing on a plain
  // open or close. A beat with dc = 0 is a plain open/close. On a
  // multi-approach lock, dc is the DC of the approach the resolver applied
  // (see CheckApproach) — an attempt resolves through exactly one route.
  int32 dc = 4;
  int32 total = 5;
  bool beaten = 6;
}

// DoorRevealed: a door entered the recipient's knowledge
// (EVENT_KIND_DOOR_REVEALED) — found by their own search, or opened in
// their presence. The payload is BUILT for its recipient rather than
// shared: a non-knower had no wire trace of this door, so the reveal
// carries the door's identity, live state and its own geometry, and the
// client patches its cached GetDoors and GetAtlas views in place — the
// load-once, beat-refreshed shape (rpg-project#264).
//
// DELIBERATELY NARROW — one door's own edges and nothing else — unlike the
// repo-wide GeometryRevealed this repo removed in #197/#198. A wider
// reveal (a lit room, a scried map) is not this beat grown fatter; it is
// rpg-toolkit#1020's own design round.
//
// A knower who already holds the door gets DoorChanged, never a second
// reveal: DOOR_REVEALED is about knowledge, DOOR is about state.
message DoorRevealed {
  // The door's identity and live state, exactly as this recipient's
  // GetDoors would now list it.
  DoorInfo door = 1;
  // The door's own crossable cell pairs — the AtlasDoorway entries a
  // knower's GetAtlas carries for it, absent from this recipient's cached
  // atlas until now. Every edge of a wide door arrives together
  // (rpg-toolkit#1123: a door is one state over a set of edges).
  repeated AtlasDoorway doorways = 2;
  // The boundaries at the door's own edges as a knower's atlas holds them,
  // replacing whatever this recipient's cached atlas held on those edges.
  // Only the door's edges — see the message comment on narrowness.
  repeated AtlasBoundary boundaries = 3;
}
