syntax = "proto3";

package dnd5e.api.authoring.v1alpha1;

import "dnd5e/api/lobby/v1alpha1/service.proto";
import "dnd5e/api/session/v1alpha1/service.proto";

option go_package = "github.com/KirkDiggler/rpg-api-protos/gen/go/dnd5e/api/authoring/v1alpha1;authoringpb";
option java_multiple_files = true;
option java_package = "com.kirkdiggler.rpg.api.dnd5e.authoring.v1alpha1";

// AuthoringService is the in-game dungeon builder's seam: write a world file,
// get back the world the game will play.
//
// THIS IS THE SECOND AuthoringService AT THIS PATH, AND A REPLACEMENT, NOT A
// REVISION (rpg-project PR #255, slice rpg-project#256). The first described
// the room-chain dialect — `FloorPlan`, `door_row`, `start_column`, an
// `archetype` that silently chose where the party stood — and its only server
// was deleted with the old encounter module in rpg-api#801. Under
// no-backcompat there is nothing to stay compatible with, so the old shapes
// are gone rather than reserved: there is no wire to keep safe, and carrying
// a dead dialect beside a live one is the Rule 1 violation this repo already
// pays for once.
//
// The one idea that survives from the first cut is the transport decision:
// a malformed REQUEST is a gRPC status, a file that fails to COMPILE is a
// body. See PutDungeonRequest.
//
// ListDungeons, DeleteDungeon and RenameDungeon were deliberately absent
// while nothing in the builder's loop (draw, validate, save, play, reopen)
// listed, deleted or renamed — an RPC with no caller is the Rule 4 violation
// this repo is still paying down elsewhere. The studio's Open panel is their
// caller (rpg-project#585): it lists what the author can open, and renames
// and deletes the author's own.
//
// TWO STORES, ONE WORLD (rpg-project#585, design R20–R24). Every dungeon RPC
// here acts for the caller in the caller's world — the one the auth boundary
// verified for the request, never a request field. Writes land only in that
// world's store, each record owned by the caller's player id; the server's
// shipped references are read-only. A key is unique within a world and
// resolves world store first, then shipped. A request with no trusted world
// is FailedPrecondition "trusted world context is required".
//
// The refusal sentences below are the status messages, verbatim: a client
// shows them where the author is looking (the key field, the panel row), so
// they are part of the contract.
service AuthoringService {
  // PutDungeon compiles a dungeon file and, unless validate_only, stores it
  // under its key in the caller's world store, owned by the caller, so
  // StartEncounter can find it. Either way it answers with the compiled atlas
  // — the same GetAtlasResponse the game plays from. It never writes a
  // shipped reference.
  //
  // Under a key the caller already owns in the world it replaces the record
  // (the overwrite case). Two refusals, for validate_only too and with
  // nothing written, so the per-edit preview surfaces them at the key field
  // before a save is attempted:
  //
  //   - another member of the world owns the key: PermissionDenied
  //     "that key belongs to another member of this world"
  //   - the key names a shipped reference: PermissionDenied
  //     "that key is a reference; save it under your own key"
  //
  // An author who opened a reference saves a copy under a key of their own.
  //
  // Gated server-side by RPG_AUTHORING_ENABLED: with the gate off the RPC is
  // not registered and callers see Unimplemented, which is how a client tells
  // "authoring is off" from "server unreachable". The gate lives in rpg-api,
  // not here.
  rpc PutDungeon(PutDungeonRequest) returns (PutDungeonResponse);
  // GetDungeon returns the stored file for a key so an author can reopen it.
  // The key resolves for the caller: their world store, then shipped — any
  // member's record in the world, since every member opens and plays them.
  // Unknown key is NotFound. Ungated: reading content mutates nothing.
  rpc GetDungeon(GetDungeonRequest) returns (GetDungeonResponse);
  // ListDungeons is the studio Open panel's list, the same answer and order
  // as LobbyService.ListDungeons for the same caller: every record in the
  // caller's world sorted by key (source WORLD, owner set), then the
  // References sorted by key (source SHIPPED, owner empty). A reference whose
  // key the world holds is left out, and so is every shipped file below the
  // single-room dialect (root `version: 3`), which the studio cannot open.
  //
  // Ownership is read from `owner`, never from `source`: a WORLD row may be
  // another member's, and only the owner renames or deletes it. Ungated, for
  // GetDungeon's reason: it reads and mutates nothing.
  rpc ListDungeons(ListDungeonsRequest) returns (ListDungeonsResponse);
  // DeleteDungeon removes one of the caller's own records from the world
  // store. Refusals:
  //
  //   - another member owns the key: PermissionDenied
  //     "that key belongs to another member of this world"
  //   - the key is a shipped reference not held in the world:
  //     PermissionDenied
  //     "that key is a reference; references cannot be renamed or deleted"
  //   - no record or reference has the key: NotFound
  //
  // Gated by RPG_AUTHORING_ENABLED, as PutDungeon: it writes.
  rpc DeleteDungeon(DeleteDungeonRequest) returns (DeleteDungeonResponse);
  // RenameDungeon moves one of the caller's own records from `key` to
  // `new_key`, atomically, and rewrites the file's one root-level `key:`
  // line to `new_key` so the file still names itself. Every other byte, and
  // the owner, are unchanged. Refusals, nothing moved:
  //
  //   - `new_key` outside the key grammar `[a-z0-9-]`: InvalidArgument
  //   - `new_key` equal to `key`, or already one of the caller's records:
  //     AlreadyExists "new key already names one of your encounters"
  //   - `new_key` owned by another member: PermissionDenied
  //     "that key belongs to another member of this world"
  //   - `new_key` a shipped reference: PermissionDenied
  //     "that key is a reference; save it under your own key"
  //   - `key` owned by another member: PermissionDenied
  //     "that key belongs to another member of this world"
  //   - `key` a shipped reference not held in the world: PermissionDenied
  //     "that key is a reference; references cannot be renamed or deleted"
  //   - no record or reference has `key`: NotFound
  //
  // Gated by RPG_AUTHORING_ENABLED, as PutDungeon: it writes.
  rpc RenameDungeon(RenameDungeonRequest) returns (RenameDungeonResponse);
  // ListScenarios reports every scenario a dungeon may be bound to, and the
  // form each one needs filled in. Ungated, for GetDungeon's reason: it
  // reads a registry and mutates nothing.
  rpc ListScenarios(ListScenariosRequest) returns (ListScenariosResponse);
  // ListWeapons reports every weapon the server's rulebook can arm a placed
  // monster with, for the builder's action palette. Ungated, for GetDungeon's
  // reason: it reads a registry and mutates nothing.
  rpc ListWeapons(ListWeaponsRequest) returns (ListWeaponsResponse);
  // GetMachineWords reports every word a behaviour machine's step may use —
  // the beats it can be on, what its condition can read, what it can do —
  // with where each is allowed and how each is said, as the engine the
  // server runs publishes them (rpg-project#997, #1001). It takes no file:
  // the words belong to the engine version, not to a dungeon, so a studio
  // has its dropdowns and labels before any file compiles. Ungated, for
  // GetDungeon's reason: it reads a table and mutates nothing.
  rpc GetMachineWords(GetMachineWordsRequest) returns (GetMachineWordsResponse);
  // GetStatusWords reports every word a status effect may be written with,
  // with where each goes, what it takes and how each is said, as the rules the
  // server runs publish them (rpg-toolkit rulebooks/dnd5e/status Words(),
  // rpg-project#1036). Takes no file: the words belong to the rules release.
  // Ungated, for GetDungeon's reason: it reads a table and mutates nothing.
  rpc GetStatusWords(GetStatusWordsRequest) returns (GetStatusWordsResponse);
  // SayStatus says one status, in the author's words, the way the rules read it
  // (rulebooks/dnd5e/status Say()), or refuses it naming the place inside it.
  // It judges the status alone: what a line's row gives it to is the
  // dungeon check's (PutDungeon validate_only). Ungated, for GetDungeon's
  // reason: it stores nothing.
  rpc SayStatus(SayStatusRequest) returns (SayStatusResponse);
}

// PutDungeonRequest carries one dungeon file, in its authored form.
//
// `key` is `[a-z0-9-]` and MUST equal the YAML's own `key:` line — the
// request names the file and the file names itself, and they may not
// disagree. A key outside the charset, or a mismatch, is a malformed request:
// gRPC InvalidArgument, no body. There is no meaningful atlas or error list
// for a request that could not name its target, and a non-OK status never
// delivers a body anyway, so pretending otherwise would only drop it.
//
// A well-formed request whose YAML fails to compile is NOT an error status.
// It answers OK with `errors` populated and `atlas` unset — the builder's
// inline-error path, where the author needs the list, not a status code.
message PutDungeonRequest {
  string key = 1;
  // The dungeon file, verbatim UTF-8 text. The server compiles exactly this
  // text and stores exactly this text; it never re-marshals, so what an author
  // wrote (comments, ordering, spacing) is what GetDungeon hands back.
  string yaml = 2;
  // validate_only compiles and answers without writing anything. This is the
  // builder's per-edit preview, and it NEVER refuses a half-drawn map: a file
  // with no start cell, a region with no cells, a wall between nowhere and
  // nowhere all come back as `errors`, not as a status. The author is in the
  // middle of drawing; the service's job is to say what is wrong so far.
  bool validate_only = 3;
}

// PutDungeonResponse is delivered only on gRPC OK (see PutDungeonRequest for
// the status side). Two shapes, told apart by `errors`:
//
//   - `errors` empty: the file compiled. `atlas` is set; `read_back` is set
//     when the file is a site document (root `version: 3` and above) and
//     the request was validate_only; and if the request was not
//     validate_only the file is stored under its key.
//   - `errors` non-empty: the file did not compile. `atlas` and `read_back`
//     are unset and nothing was written.
//
// There is no `bool success`: an empty error list IS success, and a flag that
// could disagree with it would be a second source of truth.
message PutDungeonResponse {
  // Every problem the compiler found, each naming the YAML path it is about.
  // A list, not one flat message, because an author fixing a map needs to see
  // all of it at once — the cell that is in two regions AND the wall whose
  // endpoints are not adjacent — not one complaint per round trip.
  repeated FieldError errors = 1;
  // THE SAME MESSAGE THE GAME PLAYS FROM. The builder draws what PutDungeon
  // returns, and what PutDungeon returns is the AUTHOR'S view — what
  // GetAtlas would answer an all-knowing member once a session starts on
  // this file (GetAtlas is member-scoped for concealed structure; an
  // author already knows everything they drew) — one message type, one
  // producer, one geometry. The first AuthoringService answered with its
  // own `FloorPlan`, a builder-shaped second projection of the world that had to be kept in
  // step with the atlas by hand; the moment the two disagreed the builder
  // was lying. Returning the atlas itself leaves the builder nothing to keep
  // in step.
  dnd5e.api.session.v1alpha1.GetAtlasResponse atlas = 2;
  // THE ENGINE'S SENTENCES ABOUT THE FILE (rpg-project#967): what the
  // compiled encounter does, said back in plain words, one statement per
  // thing, each naming the YAML path it is set at and what it reads or
  // changes. The producer is the engine's read-back (rpg-toolkit
  // `rulebooks/dnd5e/encounter/dungeonspec/readback`); the server maps it
  // here field for field and adds nothing.
  //
  // Present only when `errors` is empty AND the file is a site document
  // (root `version: 3` and above), the dialect the read-back reads, AND the
  // request was validate_only. A file that does not compile has no
  // read-back: its refusals are the answer. A save's response carries none:
  // the client already holds the read-back of the check it made before
  // saving, and saying the file back again would double the cost of every
  // save for nothing. The read-back rides the check (rpg-project#967).
  //
  // This is not the second builder-shaped projection the note on `atlas`
  // retires. The atlas is the world's geometry and stays the one place the
  // builder draws from; nothing here repeats a cell, a wall or a door's
  // shape. The read-back is the engine saying what the file MEANS — who
  // holds the gate, what a line grants, what wakes a routine — which no
  // message carried before, so there is nothing for it to drift from. If a
  // client and the sentences disagree, the sentences are the engine's word.
  ReadBack read_back = 3;
  // The content hash of what was just compiled, on a validate_only check
  // and on a save alike: lower-case hex SHA-256 of the compiled form
  // (rpg-toolkit dungeonspec `Compiled.ContentHash()`, rpg-project#1001).
  // Empty exactly when the file did not compile (`errors` is set).
  //
  // ON THE RESPONSE, NOT INSIDE ReadBack: the read-back is absent on a save,
  // on a refused file and on a file below the site dialect, while a save of
  // a compiled file still has a hash.
  //
  // WHAT IT COVERS: everything the compiler keeps — a line's words, a
  // check's DC, a machine's step, a post, a creature, a region, a door's
  // state, the map's void and orientation, an ending's trigger, the key and
  // the name. Comments, key order, quoting, layout, and declarations the
  // compiler does not keep do not change it. So the same content under
  // another key hashes differently.
  //
  // ENGINE-RELEASE-SPECIFIC: another encounter release may compile the same
  // file differently and hash it differently. Compare two hashes only when
  // their engine releases match (this server's is
  // GetMachineWordsResponse.encounter_version); otherwise the honest answer
  // is "saved under another engine". A run launched from this content
  // records the same value as `content_hash` on its `scene_content` beat.
  string content_hash = 4;
}

// ReadBack is a whole encounter said back by the engine: sections of groups
// of statements, in reading order, plus what the read-back cannot yet say.
// Fields 1-4 mirror the read-back's exported JSON shape exactly, so a field
// added there is added here by the same name; `folded` carries what the
// engine's `Folded()` returns.
message ReadBack {
  // The file's root `key`.
  string key = 1;
  // The file's root `name`.
  string name = 2;
  // The headings in reading order: the place, the creatures, the
  // conversations, the topics, the facts, the routines.
  repeated ReadBackSection sections = 3;
  // Every authored thing the read-back cannot yet say. Empty means every
  // part of the file has a sentence; a client shows a non-empty list rather
  // than let the author believe the sentences are the whole file.
  repeated ReadBackUnsaid not_yet_said = 4;
  // THE SAME STATEMENTS, FOLDED FOR A PERSON TO READ (rpg-project#978): a
  // line said once with its requirements as short entries under it, things
  // that differ only by state said once with the states listed, creatures
  // that share lines said once. The producer is the engine
  // (`ReadBack.Folded()` in rpg-toolkit dungeonspec/readback), not a field
  // of its JSON; the server maps its result here and adds nothing.
  //
  // Folding adds no fact and drops none. Every item carries the path of
  // every statement it stands for, so a client opens an item to the
  // statements in `sections` with those paths, and every statement is
  // reachable from some item. A client never folds statements itself: the
  // wording of a fold is the engine's, and a client that folded would be
  // writing sentences of its own.
  //
  // Set whenever `sections` is: the read-back of a validate_only check.
  repeated ReadBackFoldedSection folded = 5;
}

// ReadBackFoldedSection is one heading of the folded read-back, titled as
// the ReadBackSection it folds. A section with nothing to say is left out.
message ReadBackFoldedSection {
  string title = 1;
  repeated ReadBackFoldedItem items = 2;
}

// ReadBackFoldedItem is one entry of the folded read-back: its text, the
// paths of every statement it stands for, and the entries under it.
message ReadBackFoldedItem {
  // The entry, ready to show.
  string text = 1;
  // The path of every statement this entry stands for, entries beneath it
  // included, in ReadBackStatement.path's coordinate system. Opening the
  // entry is finding the statements with these paths.
  repeated string paths = 2;
  // The path prefix the paths of the entries beneath this one are shown
  // relative to, so a client can show a short tail under a line rather than
  // repeat its whole path. It holds for every entry below until one sets its
  // own; empty sets none. A display hint only: `paths` are always whole.
  string base = 3;
  // The entries under this one, in reading order.
  repeated ReadBackFoldedItem items = 4;
}

// ReadBackSection is one heading of the read-back.
message ReadBackSection {
  string title = 1;
  repeated ReadBackGroup groups = 2;
}

// ReadBackGroup is the statements about one thing, in reading order.
message ReadBackGroup {
  string title = 1;
  // The thing the group is about.
  ReadBackSubject about = 2;
  repeated ReadBackStatement statements = 3;
}

// ReadBackStatement is one plain sentence about one thing, with where it is
// set.
message ReadBackStatement {
  // The stable name of what the statement says ("creature.post",
  // "line.grant", "routine.wake"). A client keys on `kind`, never on the
  // sentence, which the engine may reword. An open string, not an enum: the
  // kinds are the engine's and it adds one without a wire change, so a
  // client treats an unknown kind as a statement it shows plainly.
  string kind = 1;
  // The thing the statement is about.
  ReadBackSubject about = 2;
  // The sentence, ready to show.
  string sentence = 3;
  // The YAML path the statement is set at, in FieldError's coordinate
  // system. The literal "(engine rule)" marks a statement that says how the
  // engine runs what the file authors rather than something the file sets:
  // it has no place in the file to point at.
  string path = 4;
  // What the statement reads or changes, and how: the edges between things.
  // Empty when the statement touches nothing else.
  repeated ReadBackConnection connects = 5;
}

// ReadBackSubject names a thing in the file: a kind of thing and its id
// ("creature" "gate-1", "topic" "admitted"). `kind` is an open string owned
// by the engine, for ReadBackStatement.kind's reason.
message ReadBackSubject {
  string kind = 1;
  string id = 2;
}

// ReadBackConnection is one thing a statement reads or changes, and how.
message ReadBackConnection {
  // The kind of the thing connected to, as in ReadBackSubject.
  string kind = 1;
  // The thing's id in the file.
  string id = 2;
  // A verb from the reader's side, for example "grants", "asks", "teaches",
  // "wakes-on", "advances", "reads", "said-to", "uses", "door", "carries",
  // "does", "declares", "sets", "clears". On a statement that gives or reads
  // a topic (rpg-project#1001, rpg-toolkit encounter v0.229.0) a client also
  // meets:
  //   - "about": {who, <who-word>, about, at: <topic>}, whom the note is
  //     about, or whom a read asks about;
  //   - "takes": {who, <who-word>, takes, is: <way>, at: <topic>}, a rule
  //     for who comes to note it, and the way the note comes;
  //   - "may-note": {creature, <id>, may-note, is: <way>, at: <topic>}, each
  //     creature that rule resolves to in the file: who MAY come to note it,
  //     not who will;
  //   - "whose": {creature, <id>, whose, at: <topic>}, a read of one
  //     creature's notes;
  //   - "on": {option, <id>, on, is: said|win|miss}, the line and its
  //     outcome that gave it;
  //   - "enters": {conversation, <id>, enters, is: <state>}, the
  //     conversation state whose entry gave it.
  // The who-words, their labels and their ways are
  // GetMachineWordsResponse.who_words. The list is not the set: an open
  // string owned by the engine, for ReadBackStatement.kind's reason.
  string role = 3;
  // A number the connection carries where its kind has one: the difficulty
  // of a check on a `method` connection, which the engine sets on the way
  // statements (`place.way.*`, the ways through a join), so a client can
  // count an encounter's ways by method and difficulty. Zero means the
  // connection carries no number. Mirrors the engine's `value` by the same
  // name (rpg-toolkit encounter v0.218.0).
  int32 value = 4;

  // Fields 5-8 are set on the connection kinds that need them, and empty on
  // every other (`readback.Connection` by the same names). First a
  // "condition" connection (rpg-project#997, encounter v0.224.0): one
  // condition a machine step's `when` reads, role "asks"; its `id` is the
  // word as authored with its open part filled ("heard.claim",
  // "noted:admitted", "noted.anyone:admitted", "fact:gate-cowed", "within",
  // "rounds", "flag:lit"), a word of GetMachineWordsResponse.conditions, and
  // with these four a client rebuilds the condition from connections alone.
  // Then "act" and "flag" connections (encounter v0.228.0) and the who
  // edges of a topic given or read (encounter v0.229.0; see `role`).

  // A value, as text. WHAT IT SPELLS DEPENDS ON THE KIND, and the
  // difference is standing:
  //   - on a "condition", the plain word the words table's `values` use:
  //     "failed", "true", "3"; empty where the condition carries none
  //     (`flag:<name>`, whose name is in `id`; `all`, `any`, `not`);
  //   - on an "act" or a "flag", a JSON literal: "true", "3",
  //     "\"a string\"";
  //   - on a "takes" or "may-note" edge, the WAY the note comes, in the
  //     engine's word: "judgement" or "heard" (MachineWhoWord.way);
  //   - on an "on" edge, the outcome that gave the note ("said", "win",
  //     "miss"); on an "enters" edge, the conversation state entered.
  string is = 5;
  // The comparison where it is not equality, as the engine spells it. A
  // client meets "gte" (at least: `rounds`) and "lte" (at most: `within`
  // and `regions`, which always compare so); empty means "eq", equality.
  // Their plain words are GetMachineWordsResponse.ops'.
  string op = 6;
  // True when the condition sits under an odd number of `not`s. A HINT,
  // NOT THE STRUCTURE: `at` is what makes the structure exact. Under
  // `not: { all: [a, b] }` both a and b carry `negated`, at "when.not.all[0]"
  // and "when.not.all[1]", and the step needs NOT (a and b), not
  // (NOT a) and (NOT b). Mirrors the engine's `Not`; named `negated` on the
  // wire because `not` is a keyword or operator in several target languages.
  bool negated = 7;
  // Where the connection sits. On a "condition", where it sits inside the
  // step's `when`, as the author wrote it: "when", "when.all[1]",
  // "when.any[0].not"; several conditions at one place are one node, all of
  // them needed, and it keeps the `all` / `any` / `not` shape, so an editor
  // can rebuild the condition. On an "act", its place in the step: "to",
  // "do[1]". On a who edge ("about", "takes", "may-note", "whose"), the
  // topic the edge belongs to, so a statement that gives or reads two
  // topics keeps each one's edges apart.
  string at = 8;
}

// ReadBackUnsaid is one authored thing the read-back cannot yet say.
message ReadBackUnsaid {
  // The YAML path of the thing, as in FieldError.
  string path = 1;
  // What kind of thing it is.
  string kind = 2;
  // Why it is not said yet.
  string why = 3;
}

// FieldError is one compile problem and the YAML path it is about.
//
// `path` is the author's coordinate system, not the compiler's: a path into
// the file as written, so the builder can point at the thing. Examples:
// "regions[1].cells[0][3]", "walls[3]", "place[7].blocks_los", "start".
// Empty means the problem is the file as a whole (it did not parse).
message FieldError {
  string path = 1;
  string message = 2;
}

// GetDungeonRequest names a stored dungeon by key.
message GetDungeonRequest {
  string key = 1;
}

// GetDungeonResponse is the stored file.
message GetDungeonResponse {
  // The stored file, VERBATIM UTF-8 TEXT — never a re-marshal. An author reopening
  // a map gets back exactly what they saved: their comments, their ordering,
  // their spacing. A server that round-tripped the file through its own
  // model would hand back its opinion of the file instead of the file.
  string yaml = 1;
  // The content hash of the stored file as this server's engine compiles it
  // now, exactly as PutDungeonResponse.content_hash (what it covers, and that
  // it is engine-release-specific). Empty when the stored file does not
  // compile under this engine: GetDungeon still returns such a file, so an
  // author can open it and see why, and it has no hash to give.
  string content_hash = 2;
}

// ListDungeonsRequest has no fields: the caller and their world come from
// the verified request identity, never from the request.
message ListDungeonsRequest {}

// ListDungeonsResponse is the caller's list, in the server's order (see
// AuthoringService.ListDungeons). It repeats the lobby's DungeonSummary
// rather than copying it, so the studio and the lobby picker read one shape.
message ListDungeonsResponse {
  repeated dnd5e.api.lobby.v1alpha1.DungeonSummary dungeons = 1;
}

// DeleteDungeonRequest names one of the caller's own records by key.
message DeleteDungeonRequest {
  string key = 1;
}

// DeleteDungeonResponse is empty: OK means the record is gone.
message DeleteDungeonResponse {}

// RenameDungeonRequest moves one of the caller's own records to a new key.
message RenameDungeonRequest {
  // The record's current key, in the caller's world.
  string key = 1;
  // The key it moves to. Same grammar as PutDungeonRequest.key.
  string new_key = 2;
}

// RenameDungeonResponse is empty: OK means the record now lives under
// `new_key`, and `key` names nothing in the world.
message RenameDungeonResponse {}

// ListScenariosRequest asks for the whole registry. No fields, and none are
// coming: the set of scenarios is a property of the SERVER'S rulebook build,
// not of any one dungeon, so there is nothing here to scope it by. A builder
// that has drawn no map yet still needs this list to show what a map could
// become.
message ListScenariosRequest {}

// ListScenariosResponse is every scenario the server's rulebook offers.
//
// Empty is legal and means the build offers none. The builder shows no
// scenario panel rather than an error: a dungeon with no scenario bound is a
// perfectly good dungeon, which is every dungeon shipped before this one.
message ListScenariosResponse {
  repeated ScenarioDescriptor scenarios = 1;
}

// ScenarioDescriptor is one scenario and the form it needs filled in.
//
// THE DESCRIPTOR IS CONTENT, AND THIS SERVICE TRANSLATES IT VERBATIM (design
// rpg-project#368 §3.2, ruled 2026-09-01). Each scenario package in the
// rulebook exports its own descriptor — the field keys its `New(cfg)`
// validates and the refusal words that constructor would use — and rpg-api
// copies it onto this wire without interpreting it. Nothing on the server
// path learns what a captain is, what an artifact is, or what winning means;
// the builder renders one picker per field type and sends back a map of
// key to placement id, which travels to the compiler inside the dungeon
// YAML (see PutDungeonRequest) and is validated there by the package that
// declared the form.
//
// That is why there is no `recover_the_artifact` message here and never will
// be. A typed message per scenario would put the rulebook's vocabulary in
// this contract, and every new scenario would then need a proto change, an
// rpg-api change and a web change before an author could use it — which is
// exactly the coupling the descriptor exists to remove.
message ScenarioDescriptor {
  // The scenario's id — the key a dungeon file binds under, in its
  // `scenarios:` map. Stable: renaming it orphans every dungeon bound to it.
  string id = 1;
  // The author-facing name, for the panel's heading.
  string name = 2;
  // The form, in the order the author should see it. A scenario with no
  // fields is legal — it binds nothing and its ending stands on its own.
  repeated ScenarioField fields = 3;
}

// ScenarioField is one blank on a scenario's form.
message ScenarioField {
  // The binding key the dungeon file writes under this scenario — e.g.
  // `artifact`, `exit`. What the builder emits as the YAML key and what the
  // package's Config reads.
  string key = 1;
  // The author-facing label for the blank.
  string label = 2;
  // What kind of blank this is, which decides the widget.
  FieldType type = 3;
  // WHAT the blank accepts, when `type` needs narrowing — for an ENTITY_REF,
  // which family of authored thing the picker should list: "prop", "exit",
  // "door", "monster", "faction". A "faction" picker lists the dungeon
  // file's declared `factions[]` — the hold-out's `convince` is the first
  // blank of that kind (rpg-project#375 §2).
  //
  // AN OPEN STRING, DELIBERATELY NOT AN ENUM. The descriptor is content: a
  // rulebook that grows a new kind of bindable thing must not need a proto
  // release to say so, and this repo's own VendorStockEntry.equipment_type
  // is a plain string for the same reason. A builder that meets a kind it has
  // no picker for shows the raw id field rather than refusing — the author
  // can still type the id, and the package still validates it.
  //
  // Empty when the type needs no narrowing (a CHECK names no family).
  string kind = 4;
  // The refusal this blank's constructor would use, VERBATIM — form-filler
  // words, not developer words: "this scenario needs an artifact — which
  // placed thing is the party here to recover". The builder shows it as
  // guidance while the blank is empty and as the error when it is wrong, so
  // the sentence an author reads is the sentence the rulebook wrote. There is
  // no second copy of it in rpg-api or in the web.
  string guidance = 5;
}

// FieldType says what widget a scenario blank wants.
//
// A CLOSED ENUM, unlike `kind` beside it, and the split is on purpose: the
// set of WIDGET SHAPES is the builder's own vocabulary and grows only when
// the builder learns to render something new, while the set of THINGS a
// widget can point at is content and grows with the rulebook. Adding a value
// here is a real contract change because a client cannot render a shape it
// has never heard of; adding a `kind` is not.
enum FieldType {
  FIELD_TYPE_UNSPECIFIED = 0;
  // Points at one authored thing in this dungeon, named by its id — a
  // placement's `place[].id`, an exit's `exits[].id` or a faction's
  // `factions[].id`. `kind` says which family the picker lists.
  FIELD_TYPE_ENTITY_REF = 1;
  // Names an ability or skill check the scenario resolves. NOTHING BINDS ONE
  // YET: the first is the parchment shelf's "reading is a check" (design §9),
  // and the value is here because the descriptor's shape was designed with it
  // in view, not because a field of this type exists today. A builder may
  // ship without a widget for it and show the raw value.
  FIELD_TYPE_CHECK = 2;
}

// ListWeaponsRequest asks for the whole catalog. No fields, and none are
// coming, for ListScenariosRequest's reason: the set of weapons is a property
// of the SERVER'S rulebook build, not of any one dungeon and not of any one
// monster. A builder that has placed nothing yet still needs this list to
// show what a monster could be armed with.
message ListWeaponsRequest {}

// ListWeaponsResponse is every weapon the server's rulebook offers.
//
// THE CATALOG IS CONTENT, AND THIS SERVICE TRANSLATES IT VERBATIM — the same
// reason ListScenarios exists (see ScenarioDescriptor). The rulebook owns the
// words and the builder must not: a web client holding its own list of weapon
// names would need a release before an author could reach a weapon the
// rulebook already has, and the day the two lists disagreed the palette would
// be offering a chip that writes a file the compiler refuses.
//
// Empty is legal and means the build offers none. The builder shows no weapon
// palette rather than an error — a monster with no authored actions falls back
// to its definition's own, which is every monster shipped before this one.
message ListWeaponsResponse {
  repeated WeaponDescriptor weapons = 1;
}

// WeaponDescriptor is one weapon in the form a palette chip needs: what to
// write, what to show, and enough to group by without reading the rulebook.
//
// It is deliberately NOT the weapon. No damage dice, no range, no properties,
// no weight, no cost. The palette does not compute an attack — the toolkit
// assembles one at spawn from the wielding monster's own ability scores and
// proficiency (design rpg-project#448, decision 1), which is why a skeleton
// shortbow and a goblin shortbow are the same weapon. Numbers here would be a
// second copy of the rulebook's, and the moment they disagreed the palette
// would be lying about what the author just armed. They arrive if a use case
// asks for them, not before.
message WeaponDescriptor {
  // WHAT THE AUTHOR WRITES — the full ref, e.g. "dnd5e:weapons:shortbow". A
  // placement's `actions:` list in the dungeon file is a list of exactly these
  // strings, in the author's own preference order, and the palette emits this
  // value verbatim.
  //
  // A STRING, NOT THIS REPO'S dnd5e.api.v1alpha2.weapons.Weapon ENUM, and the
  // choice is the one ScenarioField.kind makes for the same reason. That enum
  // is generated 1-to-1 from the toolkit registry, so a rulebook that grew a
  // weapon would need a regeneration, a proto release and a web release before
  // an author could reach it — exactly the coupling this RPC exists to remove.
  // And the enum names the weapon without naming its ref: a client holding
  // WEAPON_SHORTBOW would have to rebuild "dnd5e:weapons:" + "shortbow" to
  // write the file, and a client that reconstructs an id will eventually
  // reconstruct it wrong. The server hands over the string the file wants.
  string ref = 1;
  // The author-facing name, for the chip's label — "Shortbow".
  string name = 2;
  // Whether this weapon attacks at range. THE SERVER'S ANSWER, not the
  // client's inference: it is the rulebook's own predicate, the same question
  // a monster's mind asks when it decides whether it can shoot from where it
  // stands. A palette offering a "ranged / melee / both" filter reads this
  // bool rather than looking for "ranged" inside `category`. The day the
  // rulebook spells a ranged category some other way, this stays true and that
  // substring hunt breaks.
  //
  // The filter is a palette convenience that WRITES A WEAPON LIST and is never
  // stored: a category is not a thing held, and a placement names weapons
  // (design rpg-project#448, "the two cuts that broke").
  bool ranged = 3;
  // The rulebook's own category word, VERBATIM AND OPAQUE — today
  // "simple-melee", "simple-ranged", "martial-melee", "martial-ranged". It is
  // for grouping and for showing: a palette may section its chips under this
  // value, and must not branch on it.
  //
  // An open string for ScenarioField.kind's reason — a rulebook that grows a
  // category must not need a proto release to say so — and this repo's own
  // VendorStockEntry.equipment_type is a plain string for the same reason.
  //
  // It is not `ranged`'s source. The word happens to fuse the proficiency tier
  // and the melee/ranged split today; a client that took that as license to
  // split it apart would be holding the rulebook's vocabulary again.
  string category = 4;
}

// GetMachineWordsRequest asks for the machine words of the engine the
// server runs. Empty: the words belong to the engine version, not to any
// dungeon or caller.
message GetMachineWordsRequest {}

// GetMachineWordsResponse is every word a behaviour machine's step may use,
// mirroring the engine's published table field for field
// (`encounter.MachineWords()`, rpg-toolkit rulebooks/dnd5e/encounter
// machinewords.go). The server maps it and adds nothing.
//
// THE TABLE IS THE ENGINE'S, AND THIS SERVICE TRANSLATES IT VERBATIM, for
// ListWeapons' reason: a studio holding its own list of beats or conditions
// would offer a word the compiler refuses the day the two disagreed. A word
// is AS AUTHORED: a whole word ("heard"), or a prefix whose open part the
// author fills ("noted:", "deed:", "clock:"). The engine's own spellings
// (where content is lowered before the engine sees it) never appear.
//
// LABEL TEMPLATES. `label`, `label_with`, `label_not` and `value_labels` are
// a few plain words for an arrow or a dropdown, and may hold slots in braces
// that a client fills: {id} the open part of the word, or the thing an act
// names (a state, a table key, a flag); {value} a condition's or an act's
// value; {n} a count (cells, rooms, rounds); {op} a comparison's plain words
// from `ops`. A client meeting any other slot shows the template as written.
//
// SENTENCE TEMPLATES. `long` and `short` are the read-back's own sentence
// and folded form, filled by the engine when it says a file back; they are
// published so a client can show what a word will say before it is used.
// Besides the label slots they may hold slots only the read-back fills:
// {who} the runner, {whose} its possessive, {verb} a noting's polarity,
// {about} the one a beat names, {raised} a loudness, {name} a fact's own
// word, {beat} the whole beat, {parts} a node's parts joined by `join`, and
// {inner} the guard a `not` wraps.
message GetMachineWordsResponse {
  // The engine release the api was built with, from its build info (for
  // example "v0.224.0"), so a client caching the table knows when to fetch
  // it again. Empty when unknown.
  string encounter_version = 1;
  // The beats a step can be on, in the order every refusal lists them: the
  // fixed words, then the open families.
  repeated MachineBeatWord beats = 2;
  // What a step's condition can read: engine facts first, then the
  // machine's guard leaves.
  repeated MachineConditionWord conditions = 3;
  // What a step can do: the move (`to`) first, then the acts.
  repeated MachineActWord acts = 4;
  // Every comparison a condition can make, with its plain words, so no
  // client maps the engine's "eq" or "gte" itself.
  repeated MachineOpWord ops = 5;
  // Every word that names who in a note (rpg-project#1001): who takes it,
  // whom it is about, whom a read asks about. A `give`, a line's
  // requirement, a post's pass and a machine's guard name them, and the
  // read-back's who edges carry them (ReadBackConnection.role).
  repeated MachineWhoWord who_words = 6;
}

// GetStatusWordsRequest takes nothing: the words belong to the rules release
// the server runs, not to a file.
message GetStatusWordsRequest {}

// GetStatusWordsResponse is the status words table, field for field as the
// rules publish it (rulebooks/dnd5e/status Words()). A client builds its form
// and its labels from this and holds no word list or prose of its own.
message GetStatusWordsResponse {
  // The rulebooks/dnd5e release the api was built with, from its build info
  // (for example "v0.226.0"), so a client caching the table knows when to
  // fetch it again. Empty when unknown. It names a different module from
  // GetMachineWordsResponse.encounter_version, hence a different field.
  string rulebook_version = 1;
  // Every word a status can be written with, in the order the rules list them.
  repeated StatusWord words = 2;
}

// StatusWord is one word a status effect may be written with. Mirrors the
// rules' `status.Word`. `shape`, `place`, `written_in` and `holds` are open
// strings owned by the engine, never enums, so a rules release that adds one
// needs no proto release.
message StatusWord {
  // The word as authored ("changes", "cannot", "lasts").
  string word = 1;
  // Where the word goes: the part of a status that may carry it. An open
  // string owned by the engine.
  string place = 2;
  // What the word takes: the shape of its value (a number, a choice, a list,
  // and so on). An open string owned by the engine.
  string shape = 3;
  // For a word that takes a choice, each value it may take, in the engine's
  // order; empty for any other shape.
  repeated StatusWordValue values = 4;
  // A few plain words for a form label or a dropdown, as the rules say them.
  string label = 5;
  // Where the word is written inside the status, as the rules name the
  // place. An open string owned by the engine.
  string written_in = 6;
  // What the word holds when it carries others inside it, as the rules name
  // it; empty when it holds nothing. An open string owned by the engine.
  string holds = 7;
  // True when a status that has the word's place must write it.
  bool required = 8;
  // True when writing the word narrows what the status does, rather than
  // widening it.
  bool narrows = 9;
  // The conditions under which the word is allowed, as the rules name them;
  // empty when it is allowed everywhere its place is.
  repeated string when = 10;
  // The limits of a number word. Unset when the word is not a number.
  StatusNumberBounds bounds = 11;
}

// StatusWordValue is one value a choice word may take. Mirrors the rules'
// `status.Value`.
message StatusWordValue {
  // The value as authored.
  string word = 1;
  // A few plain words for a dropdown entry, as the rules say them.
  string label = 2;
  // The conditions under which this value is allowed, as the rules name them;
  // empty when it is always allowed.
  repeated string when = 3;
}

// StatusNumberBounds are the limits of a number word. Mirrors the rules'
// `status.Bounds`.
message StatusNumberBounds {
  // The least the number may be.
  int32 min = 1;
  // The most the number may be.
  int32 max = 2;
  // True when zero is a value the number may take.
  bool zero_allowed = 3;
}

// SayStatusRequest carries one status to be said.
message SayStatusRequest {
  // The status's id, the key it sits under in the file's `statuses:`.
  string id = 1;
  // The one status as JSON, in the author's words, exactly as it sits under
  // the file's `statuses.<id>`. The engine reads JSON; a client turns its
  // parsed YAML into JSON.
  string status_json = 2;
}

// SayStatusResponse is one status said by the engine, or refused. A refused
// status answers with `errors` and nothing else, with an OK status, like a
// validate-only PutDungeon.
message SayStatusResponse {
  // The status's name as the rules say it. Empty when refused.
  string name = 1;
  // The whole status in a sentence built from the table's labels. Empty when
  // refused.
  string sentence = 2;
  // The sentence in its parts, each tied to the place it says. Empty when
  // refused.
  repeated StatusSaidPart parts = 3;
  // Why the status was refused; empty when it was said. Each path is inside
  // the status ("changes[0].cannot[1]"), so a client marks
  // `statuses.<id>.` plus the path; each message is the rules' words after
  // that place.
  repeated FieldError errors = 4;
}

// StatusSaidPart is one part of a status's sentence. Mirrors the rules'
// `status.SaidPart`.
message StatusSaidPart {
  // The place inside the status this part says ("changes[0]").
  string path = 1;
  // The words the rules say for that place.
  string text = 2;
}

// MachineBeatWord is one beat a step can be on. Mirrors `encounter.BeatWord`.
message MachineBeatWord {
  // The beat as authored: "heard", or a prefix "deed:", "clock:".
  string word = 1;
  // What fills a prefix word's open part, and from where: "deed" (a deed
  // word the rulebook names), "clock" (a clock the file declares), "fact" (a
  // fact the file can set), "topic" (a topic something in the file gives),
  // "loudness" (a loudness the rulebook names), "flag" (a key the machine's
  // bag declares); empty for a whole word. One of the values of
  // MachineArg.names; an open string owned by the engine, for
  // ReadBackStatement.kind's reason.
  string open = 2;
  // A beat the clock raises ("time", "turn").
  bool timed = 3;
  // A beat that happened somewhere: `within` and `regions` may be asked of it.
  bool scoped = 4;
  // A beat whose event names the one it is about: `noted:` may be read on it.
  // Mirrors the engine's `BeatWord.Names`; named `names_someone` on the wire
  // so it is not read as MachineArg.names, a string with another meaning.
  bool names_someone = 5;
  // The read-back's words for the one a naming beat is about; empty exactly
  // when `names_someone` is false. A sentence template (see
  // GetMachineWordsResponse).
  string about = 6;
  // A beat a step may act on with `pick`.
  bool picks = 7;
  // A few plain words for an arrow or a dropdown ("hears something").
  string label = 8;
  // `label` with the thing the beat is about filled in, for a beat that
  // takes one ("learns {id}"); empty where it takes none, or where `label`
  // itself already holds the slot ("{id} is done").
  string label_with = 9;
  // The read-back's folded form, about "it".
  string short = 10;
  // The read-back's sentence template.
  string long = 11;
  // Where the beat is written: the step's `on` (in "on", no key, no field).
  MachineWritten written = 12;
  // What the beat takes, in order: an open beat's part (`deed:<word>`);
  // empty for a whole word.
  repeated MachineArg args = 13;
}

// MachineConditionWord is one thing a step's condition can read: an engine
// fact (`fact` true) or a machine guard leaf. Mirrors `encounter.ConditionWord`.
message MachineConditionWord {
  // The word as authored: "heard.claim", "noted:", "fact:", "within", "all".
  string word = 1;
  // What fills a prefix word's open part, as MachineBeatWord.open.
  string open = 2;
  // True for an engine fact a `fact:` guard leaf names; false for a machine
  // guard leaf (`flag:`, `within`, `regions`, `rounds`, `all`, `any`, `not`).
  bool fact = 3;
  // The value's kind: "bool", "string" or "int"; empty for a node that
  // carries none (`all`, `any`, `not`).
  string kind = 4;
  // The closed set of values it may ask, in the order a refusal lists them;
  // empty for an open value.
  repeated string values = 5;
  // The real beats it may be read on, as MachineBeatWord.word spells them:
  // a whole beat, or an open family's word ("deed:") for every beat of that
  // family. Empty means any beat.
  repeated string on = 6;
  // How the states dialect writes it in a `when` ("{ enemy }"); empty where
  // the dialect does not read it.
  string states_form = 7;
  // How the read-back joins a node's parts: " and " for `all`, ", or " for
  // `any`; empty for a leaf.
  string join = 8;
  // A few plain words for an arrow ("it was a claim that {value}"); for a
  // word with closed values, the fallback for a value `value_labels` does
  // not name.
  string label = 9;
  // The label when the condition is asked to be false ("has not learned
  // {id}"); empty where `label`'s own negation reads right.
  string label_not = 10;
  // For a word with closed values, each value's own label ("failed": "it was
  // a claim that failed").
  map<string, string> value_labels = 11;
  // The read-back's sentence template.
  string long = 12;
  // Where the condition is written: a key of a `when` map.
  MachineWritten written = 13;
  // What it takes, in order: its open part, the value it compares, a
  // comparison, a count, the conditions a node holds.
  repeated MachineArg args = 14;
}

// MachineActWord is one thing a step can do: move (`to`) or an act.
// Mirrors `encounter.ActWord`.
message MachineActWord {
  // The word as authored: "to", "pick", "wake_in", "set", "clear", "anchor".
  string word = 1;
  // The real beats a step may do it on, as MachineConditionWord.on; empty
  // means any beat.
  repeated string on = 2;
  // How the states dialect writes it in `do` ("{ pick: <key> }"); empty
  // where the dialect does not take it.
  string states_form = 3;
  // A few plain words for an arrow ("changes to {id}").
  string label = 4;
  // The read-back's folded form.
  string short = 5;
  // The read-back's sentence form.
  string long = 6;
  // Where the act is written: a key of a `do` map, or of the step itself
  // (`to`).
  MachineWritten written = 7;
  // What the act takes, in order.
  repeated MachineArg args = 8;
}

// MachineOpWord is one comparison a condition can make. Mirrors
// `encounter.OpWord`.
message MachineOpWord {
  // The engine's spelling: "eq", "gte", "lte".
  string op = 1;
  // How a label or a sentence says it: "exactly", "at least", "at most".
  string words = 2;
}

// MachineWritten is where a word is written in a step, as the author writes
// it in a native recipe (`on`, `when`, `do`), so a client places a word and
// its args with no code of its own per word. Mirrors `encounter.Written`.
//
// Closed sets here and in MachineArg are open strings documented with their
// values, as the read-back's kinds are, not enums: the sets are the engine's
// and grow with it (encounter v0.224.1 added four kinds of thing an argument
// names), and a client meeting a value it does not know shows the word
// plainly rather than failing to decode it.
message MachineWritten {
  // The part of the step it is written in: "on" (the step's `on` itself),
  // "when" (a key of a condition's map), "do" (a key of an act's map) or
  // "step" (a key of the step itself).
  // Mirrors the engine's `Written.In`; named `part` on the wire because `in`
  // is a keyword in several target languages.
  string part = 1;
  // The key it is written under ("fact", "flag", "scope", "rounds", "all",
  // "any", "not", "pick", "wake_in", "set", "clear", "anchor", "to"); empty
  // for a beat, which is `on`'s value itself.
  string key = 2;
  // The field inside the key's map the word itself is spelled in
  // (`fact: { name: fact:gate-cowed }` has field "name"); empty when the word
  // is spelled only by its key, or, for a beat, as `on`'s value.
  string field = 3;
}

// MachineArg is one thing a word takes: what a studio offers for it, and
// where it goes in what the author writes. A word's label fills "{" + name +
// "}" with it. Mirrors `encounter.Arg`.
message MachineArg {
  // The argument's name: "id", "value", "n", "op", "parts", "inner"; its
  // label slot is "{" + name + "}".
  string name = 1;
  // Where it is written:
  //   - "open": after the word's colon, where the word is spelled:
  //     `on: deed:<id>`, `fact: { name: fact:<id> }`.
  //   - "value": the value of the word's key: `flag: <id>`, `pick: <id>`,
  //     `wake_in: <n>`, `to: <id>`, `not: <inner>`, `all: [<parts>]`,
  //     `clear: [<id>]`, `anchor: true`.
  //   - "field": a field inside the key's map, named by `field`:
  //     `fact: { value: <value>, op: eq }`, `rounds: { op: <op>, n: <n> }`,
  //     `scope: { within: <n> }`, `set: { key: <id>, value: <value> }`.
  //   - "implied": written nowhere: what the word itself means, stated in
  //     `fixed` (`within: 2` is at most 2 cells: op "lte").
  string goes = 2;
  // The field it is written in when `goes` is "field"; empty otherwise.
  string field = 3;
  // What it names: "state" (a state of this machine), "list" (a key of the
  // machine's table of rows), "flag" (a key the machine's bag declares),
  // "fact", "topic", "deed", "clock", "loudness" (as MachineBeatWord.open),
  // "op" (a comparison, one of GetMachineWordsResponse.ops), "condition" (a
  // condition built from these words); empty for a plain value.
  string names = 4;
  // Its type: "string", "int", "bool", "condition" (a condition written as
  // these words), or "of": the kind the flag named by the argument
  // `kind_of` was declared with, one of `kinds`.
  string kind = 5;
  // The name of the argument whose flag gives this one its kind, when
  // `kind` is "of"; empty otherwise.
  string kind_of = 6;
  // The kinds an "of" argument may take: what a flag may be declared with
  // ("bool", "int", "string").
  repeated string kinds = 7;
  // The closed set it may be, in order; empty for an open one.
  repeated string values = 8;
  // True when it is written as a list of several (`clear`, `all`, `any`).
  bool many = 9;
  // True when it may be left out; `default_value` is then what leaving it
  // out means. None is optional today.
  bool optional = 10;
  // What leaving an optional argument out means.
  // Mirrors the engine's `Arg.Default`; named `default_value` on the wire
  // because `default` is a keyword in most target languages.
  string default_value = 11;
  // A value it always has: written for the author, offered to no one (a
  // fact leaf's `op: eq`, `anchor: true`). Empty for an argument the author
  // chooses.
  string fixed = 12;
}

// MachineWhoWord is one word that names who in a note. Mirrors
// `encounter.WhoWord` (rpg-toolkit encounter v0.229.0); two fields cross
// under other names, so neither is read as a neighbour's: the engine's
// `Role` is `plays` (ReadBackConnection.role is a verb, a different thing)
// and its `Allowed` is `allowed_in` (a place to write it, not the beats of
// MachineConditionWord.on).
message MachineWhoWord {
  // The word as authored, or as the read-back names it: "spoken_to",
  // "carriers_who_witnessed", "party_in_sight", "speaker", "the_speaker",
  // "the_walker", "the_one_named", "anyone", and the engine's own
  // "the_arresting", "the_taken", "the_gone".
  string word = 1;
  // The part it plays in a note: "taker" (who comes to note it), "about"
  // (whom a given note is about) or "read" (whom a read asks about). An
  // open string owned by the engine, documented with its closed set, as
  // the other machine words.
  string plays = 2;
  // A few plain words for it ("the one the line is said to").
  string label = 3;
  // Where it is written: "give.to", "give.about", "give.heard_by",
  // "requires", "pass", "noted:", "noted.anyone:", or "engine" for a word
  // only the engine's own grants (an arrest, a jail, a seizure) use.
  string allowed_in = 4;
  // How a taker comes by the note, in the engine's own word: "judgement" or
  // "heard"; empty for a word that takes nothing (plays "about" or "read").
  // The value a "takes" or "may-note" connection carries in `is`.
  string way = 5;
}
