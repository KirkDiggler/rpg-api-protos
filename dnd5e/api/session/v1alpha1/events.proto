syntax = "proto3";

package dnd5e.api.session.v1alpha1;

option go_package = "github.com/KirkDiggler/rpg-api-protos/gen/go/dnd5e/api/session/v1alpha1;sessionpb";
option java_multiple_files = true;
option java_package = "com.kirkdiggler.rpg.api.dnd5e.session.v1alpha1";

// The roll trace that v1 verb responses carry. The v1 event stream (Event,
// EventKind and its bodies) was deleted with StreamEvents and GetStory
// (rpg-project#631); the act stream on session/v1alpha2 StoryService carries
// what a client narrates.

// -----------------------------------------------------------------------------
// Roll trace primitives — the dice and sourced additive modifiers any roll
// domain carries. From Session v0.51.0 (rpg-toolkit#1479), via
// rpg-api-protos#283.
// -----------------------------------------------------------------------------
//
// These five messages describe dice and sourced additive modifiers the way the
// producing rulebook asserts them, and nothing else: damage type, critical
// state, multipliers, AC, DC, requested/applied amounts and HP stay on the
// domain bodies that carry them. A receiver maps these fields through to
// presentation and performs NO arithmetic — every subtotal and total below is
// asserted by the producer, not derived here, and a ref is never parsed, mapped
// to a rule, or turned into a label by anything downstream.

// RollSource names one provider-authored source of a roll, a reroll, or a
// modifier. Ref is the canonical catalog identity when the source has one
// ("dnd5e:features:second_wind"); name is the provider's display name for it
// ("Second Wind"); label is the provider's term for this specific contribution
// when it is narrower than the whole source ("Fighter level" for the
// class-level modifier on a Second Wind heal). Receivers print these; they do
// not interpret them.
message RollSource {
  // Canonical ref when the source has catalog identity; empty otherwise.
  string ref = 1;
  // Provider-authored display name.
  string name = 2;
  // Provider-authored term for this contribution, when more specific than
  // name.
  string label = 3;
  // The responsible character or entity when this contribution has entity
  // provenance. This is not a player, dice-set, or presentation-style key.
  string source_id = 4;
}

// DiceReroll is one reroll applied to one die of a DiceTrace, in the order it
// happened.
message DiceReroll {
  // The stable index of the rerolled die — the same index space
  // DiceTrace.original_rolls and final_rolls number.
  int32 die_index = 1;
  // The face the die showed before this reroll — the value current at
  // die_index at this point in the ordered history.
  int32 before = 2;
  // The face the die shows from this reroll on.
  int32 after = 3;
  // Who ordered the reroll (e.g. Great Weapon Fighting).
  RollSource source = 4;
}

// KeepRule names the rule that decided DiceTrace.kept_indices.
enum KeepRule {
  KEEP_RULE_UNSPECIFIED = 0;
  KEEP_RULE_ADVANTAGE = 1;
  KEEP_RULE_DISADVANTAGE = 2;
  // Granted and imposed sources met; the pool was rolled straight and the
  // record says why. kept_indices is empty.
  KEEP_RULE_CANCELLED = 3;
}

// DiceKeep records the rule that decided kept_indices and who brought it.
// Absent when nothing touched the pool: a straight roll keeps every face.
// The sibling of rerolls: rerolls explain final_rolls, keep explains
// kept_indices.
message DiceKeep {
  KeepRule rule = 1;
  // Sources that granted advantage. Each carries the granting entity in
  // source_id (Help names the helper).
  repeated RollSource granted = 2;
  // Sources that imposed disadvantage (Untrained names the roller).
  repeated RollSource imposed = 3;
}

// DiceTrace is one homogeneous physical dice group AS ACTUALLY ROLLED — the
// physical faces AND the notation of that physical pool, not a rule's printed
// pool: a critical whose printed domain dice are 2d6 records 4d6 here, the
// printed 2d6 remaining a separate domain fact beside the trace, and an
// advantaged d20 carries two physical faces, the one kept, and the keep
// record naming the rule that kept it.
//
// The face fields are one ordered story over the same stable die indices:
// original_rolls is what each index first showed; rerolls rewrite individual
// indices in application order; final_rolls is what every index shows once all
// rerolls have applied; kept_indices selects which final faces count.
message DiceTrace {
  // The physical dice expression this group ACTUALLY rolled — the notation of
  // the physical pool, doubled pool included: "4d6" when a critical doubled a
  // printed 2d6, never the printed "2d6" alongside the doubled faces. The
  // domain's printed expression stays a separate domain fact.
  string notation = 1;
  // The size of every die in the group.
  int32 die_size = 2;
  // What each die first showed, in index order, before any reroll —
  // including faces later rerolled away.
  repeated int32 original_rolls = 3;
  // Every reroll applied to the group, IN THE ORDER APPLIED. Each entry's
  // before is the value current at its die_index at that moment, and its
  // after is the value from then on. Empty when nothing rerolled.
  repeated DiceReroll rerolls = 4;
  // What each die shows after all rerolls, in the same index order and
  // cardinality as original_rolls.
  repeated int32 final_rolls = 5;
  // Which final faces participate — indices into original_rolls/final_rolls,
  // after advantage, disadvantage, or another keep/drop rule. Empty means
  // every final face is kept.
  repeated int32 kept_indices = 6;
  // The authoritative sum of the kept final faces, as the producing rulebook
  // asserts it. Receivers must not recompute it from the faces.
  int32 subtotal = 7;
  // The rule that decided kept_indices, and who granted or imposed it. Absent
  // when nothing touched the pool — a straight roll keeps every face and has
  // no rule to name. Present with KEEP_RULE_CANCELLED on a single-die pool
  // whose granted and imposed sources met: the faces look straight and this
  // record is the only account of why.
  DiceKeep keep = 8;
}

// RollComponent is one sourced input to a domain's roll calculation: who
// contributed (source), the physical dice they rolled (dice), and the flat
// additive modifier they added (modifier).
message RollComponent {
  // Who contributed.
  RollSource source = 1;
  // The physical dice this component rolled. Absent on a modifier-only
  // component.
  DiceTrace dice = 2;
  // The flat additive modifier this component contributed, signed — including
  // zero when a zero modifier actually participated.
  //
  // PRESENCE IS THE FACT. Unset (nil in Go, undefined in TS) means this
  // component carried no additive modifier at all; present with the value 0
  // means a modifier participated and its amount was zero. These are
  // different facts and the wire preserves the difference.
  optional int32 modifier = 3;
  // Whether this component's dice subtotal is subtracted from the calculation.
  // This applies only to dice; modifier remains a signed additive value.
  bool subtract_dice = 4;
}

// RollCalculation is one domain's ordered roll inputs and the total the
// producing rulebook asserts for them.
message RollCalculation {
  // The ordered sourced components, in producer order. A multiplier such as
  // resistance or immunity is NOT one of these — multipliers remain damage
  // facts beside the calculation, never additive modifiers within it.
  repeated RollComponent components = 1;
  // The authoritative total of every component's dice and additive modifiers,
  // as the producing rulebook asserts it. Receivers must not recompute it
  // from the components.
  int32 total = 2;
}
