syntax = "proto3";

package dnd5e.api.v1alpha2.character;

import "dnd5e/api/v1alpha2/encounter/types.proto";

option go_package = "github.com/KirkDiggler/rpg-api-protos/gen/go/dnd5e/api/v1alpha2/character;characterpb";
option java_multiple_files = true;
option java_package = "com.kirkdiggler.rpg.api.dnd5e.v1alpha2.character";

// =============================================================================
// RPC request / response messages
// =============================================================================

// EquipItemRequest equips an item from inventory into a slot. Two-handed occupancy and
// slot-swap semantics are toolkit rules — the caller sends a Ref + slot key, nothing else.
// The same request serves every seat a character can be in; what it costs and who hears of
// it is decided by the session SDK's Equip verb, never by this message (see EquipItem below
// and rpg-project#542).
message EquipItemRequest {
  string character_id = 1;
  dnd5e.api.v1alpha2.encounter.Ref item = 2; // item from inventory to equip
  string slot_key = 3; // which slot to equip it into
}

// EquipItemResponse carries the recomputed authenticated-owner CharacterData projection.
// The host binds the character to the caller before returning it. Message reuse with the
// legacy encounter Entity does not authorize owner-private fields 9-14 for foreign viewers.
// equipped/inventory/slots/armor_class_detail all reflect the post-equip state (including
// any occupant the toolkit displaced back to inventory).
message EquipItemResponse {
  dnd5e.api.v1alpha2.encounter.CharacterData character = 1;
}

// UnequipItemRequest clears a slot, returning its occupant to inventory.
message UnequipItemRequest {
  string character_id = 1;
  string slot_key = 2;
}

// UnequipItemResponse carries the recomputed character view — see EquipItemResponse.
message UnequipItemResponse {
  dnd5e.api.v1alpha2.encounter.CharacterData character = 1;
}

// GetCharacterDataRequest asks for one character's current view. This is the read the
// equipment screen uses to load its initial state on the session stack. Read-only; nothing
// about the character changes.
//
// WHY A READ EXISTS HERE NOW. This service began as writes only (EquipItem/UnequipItem,
// protos#187), because the old encounter route seeded the equipment screen (rpg-dnd5e-web#571)
// from the encounter snapshot it already held. The session stack has no such snapshot —
// SessionService carries a deliberately small CharacterState and nothing about equipment, and
// the combat-turn contract keeps it that way (rpg-project#249 §2, equipment row: "equipment
// stays in the character service"). So the screen needs a read on THIS service before it can
// mount on the session route. The host binds character_id to the authenticated owner — a
// character is read by the player who owns it, never by id alone.
message GetCharacterDataRequest {
  string character_id = 1;
}

// GetCharacterDataResponse carries the SAME CharacterData the equip writes return, so a screen
// that seeds from this read and then re-renders from an EquipItemResponse uses one type and one
// code path. NOT_FOUND if the character does not exist or is not the caller's.
message GetCharacterDataResponse {
  dnd5e.api.v1alpha2.encounter.CharacterData character = 1;
}

// =============================================================================
// Service
// =============================================================================

// CharacterService is the authenticated-owner character surface. Equip/unequip here is the
// one equip path, between runs and inside them; its public consequence inside a run is the
// session stream's EQUIPMENT_CHANGED beat, but exact CharacterData fields 9-14 remain an
// owner read and are never projected to peers. See CharacterData's disclosure rule in
// dnd5e/api/v1alpha2/encounter/types.proto.
service CharacterService {
  // GetCharacterData reads one character's current view. The equipment screen loads its
  // initial state from this on the session stack (rpg-project#249 §2). Read-only; bound to
  // the owner.
  rpc GetCharacterData(GetCharacterDataRequest) returns (GetCharacterDataResponse);

  // EquipItem puts an item into a slot through the session SDK's Equip verb, the one equip
  // path for every surface (rpg-project#542). Where the character is seated decides the rest:
  //   - unseated: a plain sheet edit — no cost, no beat;
  //   - seated, outside a fight: no cost; every member who sees the character hears the
  //     EQUIPMENT_CHANGED beat on the session stream (R8, a draw into an empty hand included);
  //   - seated, in a fight: a turn action, priced by the rulebook (stowing a held item costs
  //     the action, drawing into an empty hand the object interaction, a swap both — R1; a
  //     shield costs the action — R6), and told as the same beat.
  // In a fight it is refused FAILED_PRECONDITION, writing nothing, when it is not the
  // character's turn (ErrNotYourTurn), the character is downed (ErrDowned), the price cannot be
  // paid (ErrCannotAfford), or the slot is body armour, which cannot change in a fight (R6).
  rpc EquipItem(EquipItemRequest) returns (EquipItemResponse);
  // UnequipItem clears a slot through the session SDK's Unequip verb — EquipItem's seats,
  // price, beat (a STOW) and in-fight refusals, unchanged.
  rpc UnequipItem(UnequipItemRequest) returns (UnequipItemResponse);
}
