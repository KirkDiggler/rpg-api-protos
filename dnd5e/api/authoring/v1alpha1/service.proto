syntax = "proto3";

package dnd5e.api.authoring.v1alpha1;

import "dnd5e/api/session/v1alpha1/service.proto";

option go_package = "github.com/KirkDiggler/rpg-api-protos/gen/go/dnd5e/api/authoring/v1alpha1;authoringpb";
option java_multiple_files = true;
option java_package = "com.kirkdiggler.rpg.api.dnd5e.authoring.v1alpha1";

// AuthoringService is the in-game dungeon builder's seam: write a world file,
// get back the world the game will play.
//
// THIS IS THE SECOND AuthoringService AT THIS PATH, AND A REPLACEMENT, NOT A
// REVISION (rpg-project PR #255, slice rpg-project#256). The first described
// the room-chain dialect — `FloorPlan`, `door_row`, `start_column`, an
// `archetype` that silently chose where the party stood — and its only server
// was deleted with the old encounter module in rpg-api#801. Under
// no-backcompat there is nothing to stay compatible with, so the old shapes
// are gone rather than reserved: there is no wire to keep safe, and carrying
// a dead dialect beside a live one is the Rule 1 violation this repo already
// pays for once.
//
// The one idea that survives from the first cut is the transport decision:
// a malformed REQUEST is a gRPC status, a file that fails to COMPILE is a
// body. See PutDungeonRequest.
//
// There is no DeleteDungeon. Not now: nothing in the builder's first loop
// (draw, validate, save, play, reopen) deletes, and an RPC with no caller is
// the Rule 4 violation this repo is still paying down elsewhere.
service AuthoringService {
  // PutDungeon compiles a dungeon file and, unless validate_only, stores it
  // under its key so StartEncounter can find it. Either way it answers with
  // the compiled atlas — the same GetAtlasResponse the game plays from.
  //
  // Gated server-side by RPG_AUTHORING_ENABLED: with the gate off the RPC is
  // not registered and callers see Unimplemented, which is how a client tells
  // "authoring is off" from "server unreachable". The gate lives in rpg-api,
  // not here.
  rpc PutDungeon(PutDungeonRequest) returns (PutDungeonResponse);
  // GetDungeon returns the stored file for a key so an author can reopen it.
  // Unknown key is NotFound. Ungated: reading content mutates nothing.
  rpc GetDungeon(GetDungeonRequest) returns (GetDungeonResponse);
  // ListScenarios reports every scenario a dungeon may be bound to, and the
  // form each one needs filled in. Ungated, for GetDungeon's reason: it
  // reads a registry and mutates nothing.
  rpc ListScenarios(ListScenariosRequest) returns (ListScenariosResponse);
  // ListWeapons reports every weapon the server's rulebook can arm a placed
  // monster with, for the builder's action palette. Ungated, for GetDungeon's
  // reason: it reads a registry and mutates nothing.
  rpc ListWeapons(ListWeaponsRequest) returns (ListWeaponsResponse);
}

// PutDungeonRequest carries one dungeon file, in its authored form.
//
// `key` is `[a-z0-9-]` and MUST equal the YAML's own `key:` line — the
// request names the file and the file names itself, and they may not
// disagree. A key outside the charset, or a mismatch, is a malformed request:
// gRPC InvalidArgument, no body. There is no meaningful atlas or error list
// for a request that could not name its target, and a non-OK status never
// delivers a body anyway, so pretending otherwise would only drop it.
//
// A well-formed request whose YAML fails to compile is NOT an error status.
// It answers OK with `errors` populated and `atlas` unset — the builder's
// inline-error path, where the author needs the list, not a status code.
message PutDungeonRequest {
  string key = 1;
  // The dungeon file, verbatim UTF-8 text. The server compiles exactly this
  // text and stores exactly this text; it never re-marshals, so what an author
  // wrote (comments, ordering, spacing) is what GetDungeon hands back.
  string yaml = 2;
  // validate_only compiles and answers without writing anything. This is the
  // builder's per-edit preview, and it NEVER refuses a half-drawn map: a file
  // with no start cell, a region with no cells, a wall between nowhere and
  // nowhere all come back as `errors`, not as a status. The author is in the
  // middle of drawing; the service's job is to say what is wrong so far.
  bool validate_only = 3;
}

// PutDungeonResponse is delivered only on gRPC OK (see PutDungeonRequest for
// the status side). Two shapes, told apart by `errors`:
//
//   - `errors` empty: the file compiled. `atlas` is set, and if the request
//     was not validate_only the file is stored under its key.
//   - `errors` non-empty: the file did not compile. `atlas` is unset and
//     nothing was written.
//
// There is no `bool success`: an empty error list IS success, and a flag that
// could disagree with it would be a second source of truth.
message PutDungeonResponse {
  // Every problem the compiler found, each naming the YAML path it is about.
  // A list, not one flat message, because an author fixing a map needs to see
  // all of it at once — the cell that is in two regions AND the wall whose
  // endpoints are not adjacent — not one complaint per round trip.
  repeated FieldError errors = 1;
  // THE SAME MESSAGE THE GAME PLAYS FROM. The builder draws what PutDungeon
  // returns, and what PutDungeon returns is the AUTHOR'S view — what
  // GetAtlas would answer an all-knowing member once a session starts on
  // this file (GetAtlas is member-scoped for concealed structure; an
  // author already knows everything they drew) — one message type, one
  // producer, one geometry. The first AuthoringService answered with its
  // own `FloorPlan`, a builder-shaped second projection of the world that had to be kept in
  // step with the atlas by hand; the moment the two disagreed the builder
  // was lying. Returning the atlas itself leaves the builder nothing to keep
  // in step.
  dnd5e.api.session.v1alpha1.GetAtlasResponse atlas = 2;
}

// FieldError is one compile problem and the YAML path it is about.
//
// `path` is the author's coordinate system, not the compiler's: a path into
// the file as written, so the builder can point at the thing. Examples:
// "regions[1].cells[0][3]", "walls[3]", "place[7].blocks_los", "start".
// Empty means the problem is the file as a whole (it did not parse).
message FieldError {
  string path = 1;
  string message = 2;
}

// GetDungeonRequest names a stored dungeon by key.
message GetDungeonRequest {
  string key = 1;
}

// GetDungeonResponse is the stored file.
message GetDungeonResponse {
  // The stored file, VERBATIM UTF-8 TEXT — never a re-marshal. An author reopening
  // a map gets back exactly what they saved: their comments, their ordering,
  // their spacing. A server that round-tripped the file through its own
  // model would hand back its opinion of the file instead of the file.
  string yaml = 1;
}

// ListScenariosRequest asks for the whole registry. No fields, and none are
// coming: the set of scenarios is a property of the SERVER'S rulebook build,
// not of any one dungeon, so there is nothing here to scope it by. A builder
// that has drawn no map yet still needs this list to show what a map could
// become.
message ListScenariosRequest {}

// ListScenariosResponse is every scenario the server's rulebook offers.
//
// Empty is legal and means the build offers none. The builder shows no
// scenario panel rather than an error: a dungeon with no scenario bound is a
// perfectly good dungeon, which is every dungeon shipped before this one.
message ListScenariosResponse {
  repeated ScenarioDescriptor scenarios = 1;
}

// ScenarioDescriptor is one scenario and the form it needs filled in.
//
// THE DESCRIPTOR IS CONTENT, AND THIS SERVICE TRANSLATES IT VERBATIM (design
// rpg-project#368 §3.2, ruled 2026-09-01). Each scenario package in the
// rulebook exports its own descriptor — the field keys its `New(cfg)`
// validates and the refusal words that constructor would use — and rpg-api
// copies it onto this wire without interpreting it. Nothing on the server
// path learns what a captain is, what an artifact is, or what winning means;
// the builder renders one picker per field type and sends back a map of
// key to placement id, which travels to the compiler inside the dungeon
// YAML (see PutDungeonRequest) and is validated there by the package that
// declared the form.
//
// That is why there is no `recover_the_artifact` message here and never will
// be. A typed message per scenario would put the rulebook's vocabulary in
// this contract, and every new scenario would then need a proto change, an
// rpg-api change and a web change before an author could use it — which is
// exactly the coupling the descriptor exists to remove.
message ScenarioDescriptor {
  // The scenario's id — the key a dungeon file binds under, in its
  // `scenarios:` map. Stable: renaming it orphans every dungeon bound to it.
  string id = 1;
  // The author-facing name, for the panel's heading.
  string name = 2;
  // The form, in the order the author should see it. A scenario with no
  // fields is legal — it binds nothing and its ending stands on its own.
  repeated ScenarioField fields = 3;
}

// ScenarioField is one blank on a scenario's form.
message ScenarioField {
  // The binding key the dungeon file writes under this scenario — e.g.
  // `artifact`, `exit`. What the builder emits as the YAML key and what the
  // package's Config reads.
  string key = 1;
  // The author-facing label for the blank.
  string label = 2;
  // What kind of blank this is, which decides the widget.
  FieldType type = 3;
  // WHAT the blank accepts, when `type` needs narrowing — for an ENTITY_REF,
  // which family of authored thing the picker should list: "prop", "exit",
  // "door", "monster", "faction". A "faction" picker lists the dungeon
  // file's declared `factions[]` — the hold-out's `convince` is the first
  // blank of that kind (rpg-project#375 §2).
  //
  // AN OPEN STRING, DELIBERATELY NOT AN ENUM. The descriptor is content: a
  // rulebook that grows a new kind of bindable thing must not need a proto
  // release to say so, and this repo's own VendorStockEntry.equipment_type
  // is a plain string for the same reason. A builder that meets a kind it has
  // no picker for shows the raw id field rather than refusing — the author
  // can still type the id, and the package still validates it.
  //
  // Empty when the type needs no narrowing (a CHECK names no family).
  string kind = 4;
  // The refusal this blank's constructor would use, VERBATIM — form-filler
  // words, not developer words: "this scenario needs an artifact — which
  // placed thing is the party here to recover". The builder shows it as
  // guidance while the blank is empty and as the error when it is wrong, so
  // the sentence an author reads is the sentence the rulebook wrote. There is
  // no second copy of it in rpg-api or in the web.
  string guidance = 5;
}

// FieldType says what widget a scenario blank wants.
//
// A CLOSED ENUM, unlike `kind` beside it, and the split is on purpose: the
// set of WIDGET SHAPES is the builder's own vocabulary and grows only when
// the builder learns to render something new, while the set of THINGS a
// widget can point at is content and grows with the rulebook. Adding a value
// here is a real contract change because a client cannot render a shape it
// has never heard of; adding a `kind` is not.
enum FieldType {
  FIELD_TYPE_UNSPECIFIED = 0;
  // Points at one authored thing in this dungeon, named by its id — a
  // placement's `place[].id`, an exit's `exits[].id` or a faction's
  // `factions[].id`. `kind` says which family the picker lists.
  FIELD_TYPE_ENTITY_REF = 1;
  // Names an ability or skill check the scenario resolves. NOTHING BINDS ONE
  // YET: the first is the parchment shelf's "reading is a check" (design §9),
  // and the value is here because the descriptor's shape was designed with it
  // in view, not because a field of this type exists today. A builder may
  // ship without a widget for it and show the raw value.
  FIELD_TYPE_CHECK = 2;
}

// ListWeaponsRequest asks for the whole catalog. No fields, and none are
// coming, for ListScenariosRequest's reason: the set of weapons is a property
// of the SERVER'S rulebook build, not of any one dungeon and not of any one
// monster. A builder that has placed nothing yet still needs this list to
// show what a monster could be armed with.
message ListWeaponsRequest {}

// ListWeaponsResponse is every weapon the server's rulebook offers.
//
// THE CATALOG IS CONTENT, AND THIS SERVICE TRANSLATES IT VERBATIM — the same
// reason ListScenarios exists (see ScenarioDescriptor). The rulebook owns the
// words and the builder must not: a web client holding its own list of weapon
// names would need a release before an author could reach a weapon the
// rulebook already has, and the day the two lists disagreed the palette would
// be offering a chip that writes a file the compiler refuses.
//
// Empty is legal and means the build offers none. The builder shows no weapon
// palette rather than an error — a monster with no authored actions falls back
// to its definition's own, which is every monster shipped before this one.
message ListWeaponsResponse {
  repeated WeaponDescriptor weapons = 1;
}

// WeaponDescriptor is one weapon in the form a palette chip needs: what to
// write, what to show, and enough to group by without reading the rulebook.
//
// It is deliberately NOT the weapon. No damage dice, no range, no properties,
// no weight, no cost. The palette does not compute an attack — the toolkit
// assembles one at spawn from the wielding monster's own ability scores and
// proficiency (design rpg-project#448, decision 1), which is why a skeleton
// shortbow and a goblin shortbow are the same weapon. Numbers here would be a
// second copy of the rulebook's, and the moment they disagreed the palette
// would be lying about what the author just armed. They arrive if a use case
// asks for them, not before.
message WeaponDescriptor {
  // WHAT THE AUTHOR WRITES — the full ref, e.g. "dnd5e:weapons:shortbow". A
  // placement's `actions:` list in the dungeon file is a list of exactly these
  // strings, in the author's own preference order, and the palette emits this
  // value verbatim.
  //
  // A STRING, NOT THIS REPO'S dnd5e.api.v1alpha2.weapons.Weapon ENUM, and the
  // choice is the one ScenarioField.kind makes for the same reason. That enum
  // is generated 1-to-1 from the toolkit registry, so a rulebook that grew a
  // weapon would need a regeneration, a proto release and a web release before
  // an author could reach it — exactly the coupling this RPC exists to remove.
  // And the enum names the weapon without naming its ref: a client holding
  // WEAPON_SHORTBOW would have to rebuild "dnd5e:weapons:" + "shortbow" to
  // write the file, and a client that reconstructs an id will eventually
  // reconstruct it wrong. The server hands over the string the file wants.
  string ref = 1;
  // The author-facing name, for the chip's label — "Shortbow".
  string name = 2;
  // Whether this weapon attacks at range. THE SERVER'S ANSWER, not the
  // client's inference: it is the rulebook's own predicate, the same question
  // a monster's mind asks when it decides whether it can shoot from where it
  // stands. A palette offering a "ranged / melee / both" filter reads this
  // bool rather than looking for "ranged" inside `category`. The day the
  // rulebook spells a ranged category some other way, this stays true and that
  // substring hunt breaks.
  //
  // The filter is a palette convenience that WRITES A WEAPON LIST and is never
  // stored: a category is not a thing held, and a placement names weapons
  // (design rpg-project#448, "the two cuts that broke").
  bool ranged = 3;
  // The rulebook's own category word, VERBATIM AND OPAQUE — today
  // "simple-melee", "simple-ranged", "martial-melee", "martial-ranged". It is
  // for grouping and for showing: a palette may section its chips under this
  // value, and must not branch on it.
  //
  // An open string for ScenarioField.kind's reason — a rulebook that grows a
  // category must not need a proto release to say so — and this repo's own
  // VendorStockEntry.equipment_type is a plain string for the same reason.
  //
  // It is not `ranged`'s source. The word happens to fuse the proficiency tier
  // and the melee/ranged split today; a client that took that as license to
  // split it apart would be holding the rulebook's vocabulary again.
  string category = 4;
}
